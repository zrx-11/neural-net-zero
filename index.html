nline\">f(x)+g(x)<\/span><\/td><td><span class=\"katex-inline\">f&#x27;(x)+g&#x27;(x)<\/span><\/td><td>加法逐项求导<\/td><\/tr><\/tbody><\/table>\n<p>用这条幂法则验一下上面的结果：<span class=\"katex-inline\">(x^2)&#x27;=2x^{2-1}=2x<\/span>，和手推一致。<\/p>\n<h3>神经网络为什么盯着导数<\/h3>\n<p>训练网络时，我们有一个&quot;损失&quot;（第 9 章会定义），它衡量输出错得有多离谱。目标是让损失变小。<\/p>\n<p>假设损失只由一个参数 <span class=\"katex-inline\">w<\/span> 决定，记作 <span class=\"katex-inline\">L(w)<\/span>。要知道&quot;<span class=\"katex-inline\">w<\/span> 往哪边调能让 <span class=\"katex-inline\">L<\/span> 变小&quot;，就看 <span class=\"katex-inline\">L<\/span> 对 <span class=\"katex-inline\">w<\/span> 的导数：<\/p>\n<ul><li>\n导数为正：<span class=\"katex-inline\">w<\/span> 增大，<span class=\"katex-inline\">L<\/span> 变大，应该把 <span class=\"katex-inline\">w<\/span> 调小；\n<\/li><li>\n导数为负：<span class=\"katex-inline\">w<\/span> 增大，<span class=\"katex-inline\">L<\/span> 变小，应该把 <span class=\"katex-inline\">w<\/span> 调大；\n<\/li><li>\n导数为 0：这个位置暂时是平的。\n<\/ul>\n<p>导数的正负号提供方向，大小提供&quot;有多陡&quot;。第 10 章的梯度下降，整台机器就靠这个符号和大小决定每一步怎么走。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：导数像汽车仪表盘上的瞬时速度表。平均速度是&quot;这段路开了多久、跑了多远&quot;，瞬时速度是&quot;此刻指针指在哪&quot;。导航软件用平均速度估算到达时间，自动驾驶控制油门看的是瞬时速度。<\/p>\n<p>类比失效的地方：速度表读的是真实车辆，导数是算出来的极限值，不是&quot;测量&quot;出来的。对不光滑的函数（比如有尖角的折线），尖角那一点导数可能不存在。<\/p>\n<p><strong>实例<\/strong>：求 <span class=\"katex-inline\">f(x)=3x^2+2x-1<\/span> 在 <span class=\"katex-inline\">x=2<\/span> 处的导数。<\/p>\n<p>逐项求导：<span class=\"katex-inline\">(3x^2)&#x27;=3\\cdot 2x=6x<\/span>，<span class=\"katex-inline\">(2x)&#x27;=2<\/span>，<span class=\"katex-inline\">(-1)&#x27;=0<\/span>。所以 <span class=\"katex-inline\">f&#x27;(x)=6x+2<\/span>。代入 <span class=\"katex-inline\">x=2<\/span>：<span class=\"katex-inline\">f&#x27;(2)=14<\/span>。<\/p>\n<p>用定义验一遍：<span class=\"katex-inline\">f(2)=12+4-1=15<\/span>，<span class=\"katex-inline\">f(2.001)=3(4.004001)+4.002-1\\approx 15.014003<\/span>，差约 <span class=\"katex-inline\">0.014003<\/span>，除以 <span class=\"katex-inline\">0.001<\/span> 得 <span class=\"katex-inline\">14.003<\/span>，逼近 14。对上了。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为导数是&quot;变化量&quot;<\/strong>——导数是变化量与输入变化量的<strong>比值<\/strong>，是&quot;每单位输入变化带来多少输出变化&quot;。<span class=\"katex-inline\">f&#x27;(3)=6<\/span> 的意思是&quot;在 <span class=\"katex-inline\">x=3<\/span> 附近，<span class=\"katex-inline\">x<\/span> 每增加一点点，<span class=\"katex-inline\">y<\/span> 大约增加 6 倍那么一点点&quot;，不是&quot;<span class=\"katex-inline\">y<\/span> 增加了 6&quot;。<\/p>\n<p><strong>别以为导数一定是正的<\/strong>——导数为负表示函数在下降。<span class=\"katex-inline\">f(x)=-x<\/span> 的导数是 <span class=\"katex-inline\">-1<\/span>，<span class=\"katex-inline\">x<\/span> 增大时 <span class=\"katex-inline\">y<\/span> 减小。<\/p>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n用定义推 <span class=\"katex-inline\">(x^3)&#x27;<\/span>。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">3x^2<\/span>。<\/p>\n<p><strong>解析<\/strong>：<span class=\"katex-inline\">(x+h)^3=x^3+3x^2h+3xh^2+h^3<\/span>，减去 <span class=\"katex-inline\">x^3<\/span> 后除以 <span class=\"katex-inline\">h<\/span> 得 <span class=\"katex-inline\">3x^2+3xh+h^2<\/span>，令 <span class=\"katex-inline\">h\\to 0<\/span> 得 <span class=\"katex-inline\">3x^2<\/span>。<\/p>\n<ol><li>\n求 <span class=\"katex-inline\">f(x)=x^2<\/span> 在 <span class=\"katex-inline\">x=5<\/span> 处的切线斜率，并说明 <span class=\"katex-inline\">x<\/span> 从 5 增加到 5.1 时 <span class=\"katex-inline\">y<\/span> 大约增加多少。\n<\/ol>\n<p><strong>答案<\/strong>：斜率 <span class=\"katex-inline\">f&#x27;(5)=10<\/span>；<span class=\"katex-inline\">y<\/span> 大约增加 <span class=\"katex-inline\">10\\times 0.1=1<\/span>。<\/p>\n<p><strong>解析<\/strong>：导数给出&quot;每单位输入变化对应的输出变化&quot;。实际增量用导数乘以输入增量近似，输入增量为 0.1 时约增加 1。精确值是 <span class=\"katex-inline\">5.1^2-25=1.01<\/span>，与近似值差 0.01。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n平均变化率是&quot;一段&quot;的，导数是&quot;一点&quot;的。\n<\/li><li>\n导数定义：<span class=\"katex-inline\">f&#x27;(x)=\\lim_{h\\to 0}\\frac{f(x+h)-f(x)}{h}<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">(x^2)&#x27;=2x<\/span> 可以自己推，不必背。\n<\/li><li>\n导数的符号告诉你&quot;往哪边调参数能让结果变小&quot;。\n<\/ul>", "ch04": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：变化率与导数<\/a><\/span> · <span class=\"prereq-soft\"><span class=\"prereq-tag\">荐<\/span> <a href=\"#/chapter/ch01\">第 1 章：函数是一台机器<\/a><\/span><\/div><h1>第 4 章：套娃函数怎么求导<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 1、3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n认出什么样的函数是复合函数，分清哪层在内、哪层在外；\n<\/li><li>\n用链式法则求导，写出完整的乘法链条；\n<\/li><li>\n解释链式法则为什么是&quot;乘&quot;而不是&quot;加&quot;。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>复合函数求导，就是外层导数乘内层导数，一层一层剥。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>复合函数长什么样<\/h3>\n<p>第 1 章见过这种结构：<span class=\"katex-inline\">F(x)=f(g(x))<\/span>。<span class=\"katex-inline\">g<\/span> 在里层先算，<span class=\"katex-inline\">f<\/span> 在外层后算。<\/p>\n<p>判断哪层是外层，看&quot;最后一步算什么&quot;。<\/p>\n<div class=\"katex-block\">y=(2x+1)^2<\/div>\n<p>这个函数最后一步是平方。平方运算作用在 <span class=\"katex-inline\">(2x+1)<\/span> 这个整体上。所以外层是&quot;平方&quot;，内层是&quot;<span class=\"katex-inline\">2x+1<\/span>&quot;。<\/p>\n<p>设 <span class=\"katex-inline\">u=2x+1<\/span>，则 <span class=\"katex-inline\">y=u^2<\/span>。写成复合形式：<span class=\"katex-inline\">y=f(g(x))<\/span>，其中 <span class=\"katex-inline\">g(x)=2x+1<\/span>，<span class=\"katex-inline\">f(u)=u^2<\/span>。<\/p>\n<h3>直接展开也能做，但撑不了多久<\/h3>\n<p><span class=\"katex-inline\">y=(2x+1)^2=4x^2+4x+1<\/span>，求导得 <span class=\"katex-inline\">y&#x27;=8x+4<\/span>。这道题展开确实能做。<\/p>\n<p>换成 <span class=\"katex-inline\">y=(2x+1)^{10}<\/span>，展开要写十一项。换成 <span class=\"katex-inline\">y=\\sin(3x^2+1)<\/span>，根本展不开。神经网络里的复合深度是几十层，靠展开不可行。<\/p>\n<p>需要一条通用规则。<\/p>\n<h3>链式法则<\/h3>\n<p>设 <span class=\"katex-inline\">y=f(u)<\/span>，<span class=\"katex-inline\">u=g(x)<\/span>，则：<\/p>\n<div class=\"katex-block\">\\frac{dy}{dx}=\\frac{dy}{du}\\cdot\\frac{du}{dx}<\/div>\n<p>用函数记号写：<\/p>\n<div class=\"katex-block\">\\big(f(g(x))\\big)'=f'(g(x))\\cdot g'(x)<\/div>\n<p>读法：<strong>外层函数在&quot;内层结果&quot;处的导数，乘以内层函数对 <span class=\"katex-inline\">x<\/span> 的导数。<\/strong><\/p>\n<p>用 <span class=\"katex-inline\">y=(2x+1)^2<\/span> 走一遍：<\/p>\n<ul><li>\n外层 <span class=\"katex-inline\">f(u)=u^2<\/span>，导数 <span class=\"katex-inline\">f&#x27;(u)=2u<\/span>；\n<\/li><li>\n内层 <span class=\"katex-inline\">u=g(x)=2x+1<\/span>，导数 <span class=\"katex-inline\">g&#x27;(x)=2<\/span>；\n<\/li><li>\n代回：<span class=\"katex-inline\">f&#x27;(g(x))\\cdot g&#x27;(x)=2(2x+1)\\cdot 2=8x+4<\/span>。\n<\/ul>\n<p>和展开的结果一致。<\/p>\n<p>注意 <span class=\"katex-inline\">f&#x27;(u)=2u<\/span> 里的 <span class=\"katex-inline\">u<\/span> 要保留成 <span class=\"katex-inline\">2x+1<\/span>，不能直接写 <span class=\"katex-inline\">2x<\/span>。<strong>外层导数要代回内层的表达式<\/strong>，这是最容易错的一步。<\/p>\n<h3>为什么是乘<\/h3>\n<p>把导数的定义拿出来。<span class=\"katex-inline\">y<\/span> 随 <span class=\"katex-inline\">u<\/span> 变，<span class=\"katex-inline\">u<\/span> 随 <span class=\"katex-inline\">x<\/span> 变。输入动一点点 <span class=\"katex-inline\">\\Delta x<\/span>，引起 <span class=\"katex-inline\">u<\/span> 动 <span class=\"katex-inline\">\\Delta u<\/span>，再引起 <span class=\"katex-inline\">y<\/span> 动 <span class=\"katex-inline\">\\Delta y<\/span>。<\/p>\n<p>把两个比值串起来：<\/p>\n<div class=\"katex-block\">\\frac{\\Delta y}{\\Delta x}=\\frac{\\Delta y}{\\Delta u}\\cdot\\frac{\\Delta u}{\\Delta x}<\/div>\n<p>右边第一个分式的分母和第二个分式的分子都是 <span class=\"katex-inline\">\\Delta u<\/span>，像普通分数一样约掉，剩下 <span class=\"katex-inline\">\\Delta y/\\Delta x<\/span>。这就是&quot;乘&quot;的来源：<strong>变化是通过中间变量传导的，传导率相乘。<\/strong><\/p>\n<p>严格来说，<span class=\"katex-inline\">\\Delta u<\/span> 可能为 0，不能直接除。严谨的处理要用极限的语言说明&quot;<span class=\"katex-inline\">u<\/span> 在一点附近的变化率&quot;与&quot;<span class=\"katex-inline\">y<\/span> 对 <span class=\"katex-inline\">u<\/span> 的变化率&quot;可以相乘。这里不展开证明，但逻辑链条是清楚的：变化率沿链条传递，每一段乘一次。<\/p>\n<div>\n<svg viewBox=\"0 0 460 130\" width=\"100%\" role=\"img\" aria-label=\"变化率沿链条传导\">\n<rect x=\"20\" y=\"40\" width=\"90\" height=\"50\" rx=\"8\" fill=\"none\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n<text x=\"46\" y=\"72\" font-size=\"15\" fill=\"#3b82f6\">x<\/text>\n<rect x=\"185\" y=\"40\" width=\"90\" height=\"50\" rx=\"8\" fill=\"none\" stroke=\"#6b7280\" stroke-width=\"2\"/>\n<text x=\"211\" y=\"72\" font-size=\"15\" fill=\"#6b7280\">u<\/text>\n<rect x=\"350\" y=\"40\" width=\"90\" height=\"50\" rx=\"8\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n<text x=\"376\" y=\"72\" font-size=\"15\" fill=\"#16a34a\">y<\/text>\n<line x1=\"110\" y1=\"65\" x2=\"175\" y2=\"65\" stroke=\"#6b7280\" stroke-width=\"2\"/>\n<line x1=\"275\" y1=\"65\" x2=\"340\" y2=\"65\" stroke=\"#6b7280\" stroke-width=\"2\"/>\n<text x=\"120\" y=\"55\" font-size=\"12\" fill=\"#6b7280\">du/dx<\/text>\n<text x=\"285\" y=\"55\" font-size=\"12\" fill=\"#6b7280\">dy/du<\/text>\n<text x=\"120\" y=\"105\" font-size=\"12\" fill=\"#9ca3af\">第一段传导率<\/text>\n<text x=\"285\" y=\"105\" font-size=\"12\" fill=\"#9ca3af\">第二段传导率<\/text>\n<\/svg>\n<\/div>\n<p>看图说明：<span class=\"katex-inline\">x<\/span> 的变化先传导到 <span class=\"katex-inline\">u<\/span>，再传导到 <span class=\"katex-inline\">y<\/span>。两段各有自己的变化率，总变化率是两段相乘。这个图也解释了为什么复合越深、链越长、连乘的因子越多。<\/p>\n<h3>多剥几层<\/h3>\n<p>三层复合：<span class=\"katex-inline\">y=f(g(h(x)))<\/span>。<\/p>\n<div class=\"katex-block\">\\frac{dy}{dx}=f'(g(h(x)))\\cdot g'(h(x))\\cdot h'(x)<\/div>\n<p>从外往里，每层乘一个导数，最内层用 <span class=\"katex-inline\">x<\/span>。<\/p>\n<p>例：<span class=\"katex-inline\">y=(x^2+1)^3<\/span>。<\/p>\n<ul><li>\n外层：<span class=\"katex-inline\">u^3<\/span> 的导数是 <span class=\"katex-inline\">3u^2<\/span>，代回 <span class=\"katex-inline\">u=x^2+1<\/span> 得 <span class=\"katex-inline\">3(x^2+1)^2<\/span>；\n<\/li><li>\n内层：<span class=\"katex-inline\">x^2+1<\/span> 的导数是 <span class=\"katex-inline\">2x<\/span>；\n<\/li><li>\n相乘：<span class=\"katex-inline\">y&#x27;=3(x^2+1)^2\\cdot 2x=6x(x^2+1)^2<\/span>。\n<\/ul>\n<p>验一下：<span class=\"katex-inline\">x=1<\/span> 时 <span class=\"katex-inline\">y=(1+1)^3=8<\/span>，<span class=\"katex-inline\">y&#x27;=6\\cdot 1\\cdot 4=24<\/span>。用数值法：<span class=\"katex-inline\">x=1.001<\/span> 时 <span class=\"katex-inline\">y=(1.002001)^3\\approx 8.024024<\/span>，差 <span class=\"katex-inline\">0.024024<\/span>，除以 <span class=\"katex-inline\">0.001<\/span> 得 <span class=\"katex-inline\">24.024<\/span>，逼近 24。对上了。<\/p>\n<h3>这就是神经网络求导的全部工具<\/h3>\n<p>一个网络是几十层复合函数：<\/p>\n<div class=\"katex-block\">L = \\ell\\big(f_3(f_2(f_1(x)))\\big)<\/div>\n<p>对任何一个参数求导，都要从最外层一路乘到那个参数所在的那一层。第 11 章的反向传播，做的就是这件事，只是它把中间结果存起来重复利用，避免重复计算。<\/p>\n<p>链式法则不是&quot;一个技巧&quot;，它是把深度网络拆开求导的唯一可行办法。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：齿轮组。三个齿轮咬合，第一个转 1 圈，第二个转 2 圈，第三个转 3 圈。第一个到第三个的总传动比是 <span class=\"katex-inline\">2\\times 3=6<\/span>——中间每一级的比例相乘，不是相加。<\/p>\n<p>类比失效的地方：齿轮的传动比是固定常数，函数的导数随位置变化。同一个复合函数，在 <span class=\"katex-inline\">x=1<\/span> 和 <span class=\"katex-inline\">x=5<\/span> 处的导数可以完全不同。<\/p>\n<p><strong>实例<\/strong>：<span class=\"katex-inline\">y=(3x-2)^4<\/span>，求 <span class=\"katex-inline\">y&#x27;<\/span>。<\/p>\n<p>外层 <span class=\"katex-inline\">u^4<\/span> 导数为 <span class=\"katex-inline\">4u^3<\/span>，代回 <span class=\"katex-inline\">u=3x-2<\/span> 得 <span class=\"katex-inline\">4(3x-2)^3<\/span>；内层 <span class=\"katex-inline\">3x-2<\/span> 导数为 3。相乘得：<\/p>\n<div class=\"katex-block\">y'=12(3x-2)^3<\/div>\n<p>在 <span class=\"katex-inline\">x=1<\/span> 处：<span class=\"katex-inline\">y&#x27;=12\\cdot 1^3=12<\/span>。用数值法验证：<span class=\"katex-inline\">y(1)=1<\/span>，<span class=\"katex-inline\">y(1.001)=(1.003)^4\\approx 1.012054<\/span>，差 <span class=\"katex-inline\">0.012054<\/span> 除以 <span class=\"katex-inline\">0.001<\/span> 约 <span class=\"katex-inline\">12.05<\/span>，逼近 12。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为链式法则是&quot;内层导数加外层导数&quot;<\/strong>——是乘。加法是 <span class=\"katex-inline\">(f+g)&#x27;=f&#x27;+g&#x27;<\/span>，那是两个函数相加的规则，不是复合。复合是嵌套，变化率沿链条传导，所以乘。<\/p>\n<p><strong>别以为外层导数可以直接对 <span class=\"katex-inline\">x<\/span> 求<\/strong>——外层导数必须先把内层表达式代回去，再乘内层导数。<span class=\"katex-inline\">y=(2x+1)^2<\/span> 的外层导数是 <span class=\"katex-inline\">2(2x+1)<\/span>，不是 <span class=\"katex-inline\">2x<\/span>。漏掉代回这一步会得到 <span class=\"katex-inline\">4x<\/span>，少了常数项。<\/p>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n求 <span class=\"katex-inline\">y=(5x+1)^3<\/span> 的导数。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">y&#x27;=15(5x+1)^2<\/span>。<\/p>\n<p><strong>解析<\/strong>：外层 <span class=\"katex-inline\">u^3\\to 3u^2<\/span>，代回 <span class=\"katex-inline\">u=5x+1<\/span> 得 <span class=\"katex-inline\">3(5x+1)^2<\/span>；内层导数为 5；相乘得 <span class=\"katex-inline\">15(5x+1)^2<\/span>。<\/p>\n<ol><li>\n求 <span class=\"katex-inline\">y=(x^3+2)^2<\/span> 在 <span class=\"katex-inline\">x=1<\/span> 处的导数。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">y&#x27;=6x^2(x^3+2)<\/span>，在 <span class=\"katex-inline\">x=1<\/span> 处等于 18。<\/p>\n<p><strong>解析<\/strong>：外层导数 <span class=\"katex-inline\">2(x^3+2)<\/span>，内层导数 <span class=\"katex-inline\">3x^2<\/span>，相乘得 <span class=\"katex-inline\">6x^2(x^3+2)<\/span>。代入 <span class=\"katex-inline\">x=1<\/span>：<span class=\"katex-inline\">6\\times 1\\times 3=18<\/span>。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n复合函数：先认内外层，看最后一步算什么。\n<\/li><li>\n链式法则：<span class=\"katex-inline\">\\dfrac{dy}{dx}=\\dfrac{dy}{du}\\cdot\\dfrac{du}{dx}<\/span>，外层导数代回内层表达式再乘内层导数。\n<\/li><li>\n为什么是乘：变化率沿链条一段段传导，总传导率是各段相乘。\n<\/li><li>\n深度网络求导全靠它，第 11 章会把它跑一遍完整流程。\n<\/ul>", "ch05": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：一条直线能干什么<\/a><\/span><\/div><h1>第 5 章：一堆数怎么算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1 小时 | <strong>前置<\/strong>：第 2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n算两个向量的点积，并解释它等于&quot;加权求和&quot;；\n<\/li><li>\n把一层神经元的计算写成一个矩阵乘向量再加偏置；\n<\/li><li>\n检查矩阵乘法的维度对不对。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>点积就是加权求和，矩阵乘法就是把很多个点积并排算。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>向量：把一组数打包<\/h3>\n<p>一个输入往往不是单个数。判断一封邮件，可能同时看&quot;广告词次数&quot;和&quot;感叹号个数&quot;；一张图片，有 784 个像素值。<\/p>\n<p>把这些数按顺序排成一列，用方括号括起来：<\/p>\n<div class=\"katex-block\">\\mathbf{x}=\\begin{bmatrix}x_1\\\\x_2\\\\x_3\\end{bmatrix}<\/div>\n<p>这就是一个<strong>向量<\/strong>。它没有新运算，只是把几个数捆在一起，方便整体书写。<span class=\"katex-inline\">\\mathbf{x}<\/span> 里第 <span class=\"katex-inline\">i<\/span> 个数记作 <span class=\"katex-inline\">x_i<\/span>。粗体表示这是向量，不是单个数。<\/p>\n<p>向量的长度叫<strong>维数<\/strong>。上面这个向量有 3 个数，是 3 维向量。<\/p>\n<h3>点积：对应相乘再相加<\/h3>\n<p>两个维数相同的向量可以做<strong>点积<\/strong>：<\/p>\n<div class=\"katex-block\">\\mathbf{w}\\cdot\\mathbf{x}=w_1x_1+w_2x_2+w_3x_3<\/div>\n<p>比如 <span class=\"katex-inline\">\\mathbf{w}=(2,-1,0.5)<\/span>，<span class=\"katex-inline\">\\mathbf{x}=(1,3,2)<\/span>：<\/p>\n<div class=\"katex-block\">\\mathbf{w}\\cdot\\mathbf{x}=2\\times 1+(-1)\\times 3+0.5\\times 2=2-3+1=0<\/div>\n<p>点积的结果是一个数，不是向量。<\/p>\n<p>回到第 2 章的分类规则 <span class=\"katex-inline\">z=w_1x_1+w_2x_2+b<\/span>。分子部分就是 <span class=\"katex-inline\">\\mathbf{w}\\cdot\\mathbf{x}<\/span>。所以点积正好是&quot;给每个输入配一个权重，乘完加起来&quot;这件事的紧凑写法。<\/p>\n<p><strong>点积还可以理解成相似度<\/strong>。两个向量方向越接近，点积越大；方向相反，点积为负。这个解释在后面的注意力机制里会再出现，现在知道有这层含义就行。<\/p>\n<h3>矩阵：把多个权重向量叠起来<\/h3>\n<p>一层如果有 3 个神经元，每个神经元都有自己的权重向量。把 3 个权重向量按行叠起来：<\/p>\n<div class=\"katex-block\">\\mathbf{W}=\\begin{bmatrix}w_{11}&w_{12}&w_{13}\\\\w_{21}&w_{22}&w_{23}\\\\w_{31}&w_{32}&w_{33}\\end{bmatrix}<\/div>\n<p><span class=\"katex-inline\">w_{ij}<\/span> 表示&quot;第 <span class=\"katex-inline\">i<\/span> 个神经元对第 <span class=\"katex-inline\">j<\/span> 个输入的权重&quot;。第一个下标是行（哪个神经元），第二个下标是列（哪个输入）。<\/p>\n<p><strong>矩阵乘向量<\/strong>的规则：结果的第 <span class=\"katex-inline\">i<\/span> 个数，等于矩阵第 <span class=\"katex-inline\">i<\/span> 行与向量的点积。<\/p>\n<div class=\"katex-block\">\\mathbf{W}\\mathbf{x}=\\begin{bmatrix}w_{11}x_1+w_{12}x_2+w_{13}x_3\\\\w_{21}x_1+w_{22}x_2+w_{23}x_3\\\\w_{31}x_1+w_{32}x_2+w_{33}x_3\\end{bmatrix}<\/div>\n<p>一个 3×3 矩阵乘 3 维向量，得到一个 3 维向量。三个神经元同时算完。<\/p>\n<h3>维度必须对上<\/h3>\n<p>矩阵乘法的维度规则：<span class=\"katex-inline\">\\mathbf{W}<\/span> 是 <span class=\"katex-inline\">m\\times n<\/span>，<span class=\"katex-inline\">\\mathbf{x}<\/span> 是 <span class=\"katex-inline\">n<\/span> 维，结果就是 <span class=\"katex-inline\">m<\/span> 维。<\/p>\n<p>可以记成&quot;中间的 <span class=\"katex-inline\">n<\/span> 抵消，剩下 <span class=\"katex-inline\">m<\/span>&quot;。<span class=\"katex-inline\">n<\/span> 对不上就不能乘。<\/p>\n<p>神经网络里，这一层的输入维数必须等于权重矩阵的列数。写错维度是最常见的低级错误，第 13 章动手时会专门检查这一步。<\/p>\n<h3>一层网络的完整写法<\/h3>\n<div class=\"katex-block\">\\mathbf{z}=\\mathbf{W}\\mathbf{x}+\\mathbf{b}<\/div>\n<p><span class=\"katex-inline\">\\mathbf{W}<\/span> 是权重矩阵，<span class=\"katex-inline\">\\mathbf{x}<\/span> 是输入向量，<span class=\"katex-inline\">\\mathbf{b}<\/span> 是偏置向量（每个神经元一个偏置），<span class=\"katex-inline\">\\mathbf{z}<\/span> 是这一层的&quot;打分&quot;结果。之后还要过激活函数（第 7 章）。<\/p>\n<p>这个写法比逐个神经元写循环清爽得多，计算机也能并行算——显卡擅长同时做大量乘加，矩阵运算正好合它的胃口。<\/p>\n<div>\n<svg viewBox=\"0 0 460 190\" width=\"100%\" role=\"img\" aria-label=\"矩阵乘向量\">\n<rect x=\"30\" y=\"40\" width=\"96\" height=\"110\" fill=\"none\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n<line x1=\"62\" y1=\"40\" x2=\"62\" y2=\"150\" stroke=\"#3b82f6\" stroke-width=\"1\"/>\n<line x1=\"94\" y1=\"40\" x2=\"94\" y2=\"150\" stroke=\"#3b82f6\" stroke-width=\"1\"/>\n<line x1=\"30\" y1=\"77\" x2=\"126\" y2=\"77\" stroke=\"#3b82f6\" stroke-width=\"1\"/>\n<line x1=\"30\" y1=\"113\" x2=\"126\" y2=\"113\" stroke=\"#3b82f6\" stroke-width=\"1\"/>\n<text x=\"40\" y=\"66\" font-size=\"12\" fill=\"#3b82f6\">w11<\/text>\n<text x=\"72\" y=\"66\" font-size=\"12\" fill=\"#3b82f6\">w12<\/text>\n<text x=\"100\" y=\"66\" font-size=\"12\" fill=\"#3b82f6\">w13<\/text>\n<text x=\"40\" y=\"102\" font-size=\"12\" fill=\"#3b82f6\">w21<\/text>\n<text x=\"72\" y=\"102\" font-size=\"12\" fill=\"#3b82f6\">w22<\/text>\n<text x=\"100\" y=\"102\" font-size=\"12\" fill=\"#3b82f6\">w23<\/text>\n<text x=\"40\" y=\"138\" font-size=\"12\" fill=\"#3b82f6\">w31<\/text>\n<text x=\"72\" y=\"138\" font-size=\"12\" fill=\"#3b82f6\">w32<\/text>\n<text x=\"100\" y=\"138\" font-size=\"12\" fill=\"#3b82f6\">w33<\/text>\n<text x=\"140\" y=\"105\" font-size=\"18\" fill=\"#6b7280\">×<\/text>\n<rect x=\"166\" y=\"60\" width=\"34\" height=\"70\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n<text x=\"175\" y=\"84\" font-size=\"12\" fill=\"#16a34a\">x1<\/text>\n<text x=\"175\" y=\"104\" font-size=\"12\" fill=\"#16a34a\">x2<\/text>\n<text x=\"175\" y=\"124\" font-size=\"12\" fill=\"#16a34a\">x3<\/text>\n<text x=\"214\" y=\"105\" font-size=\"18\" fill=\"#6b7280\">=<\/text>\n<rect x=\"240\" y=\"60\" width=\"34\" height=\"70\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\"/>\n<text x=\"248\" y=\"84\" font-size=\"12\" fill=\"#dc2626\">z1<\/text>\n<text x=\"248\" y=\"104\" font-size=\"12\" fill=\"#dc2626\">z2<\/text>\n<text x=\"248\" y=\"124\" font-size=\"12\" fill=\"#dc2626\">z3<\/text>\n<text x=\"292\" y=\"70\" font-size=\"12\" fill=\"#6b7280\">结果的每一行<\/text>\n<text x=\"292\" y=\"92\" font-size=\"12\" fill=\"#6b7280\">= 左边矩阵的<\/text>\n<text x=\"292\" y=\"114\" font-size=\"12\" fill=\"#6b7280\">一行 × 右边向量<\/text>\n<text x=\"292\" y=\"136\" font-size=\"12\" fill=\"#6b7280\">（做点积）<\/text>\n<\/svg>\n<\/div>\n<p>看图说明：左边矩阵的每一行与中间的向量做点积，得到右边结果向量的一个数。行数决定输出维数，列数必须等于输入维数。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：点积像餐厅结账。菜谱上每道菜有价格（权重），你点了若干份（输入），总价就是把&quot;价格×份数&quot;逐项加起来。价格向量和份数向量的点积就是账单金额。<\/p>\n<p>类比失效的地方：餐厅价格都是正数，权重可以是负数。负权重表示&quot;这个输入出现得越多，分数越低&quot;，比如垃圾邮件里的&quot;退订&quot;一词反而说明它可能是正经邮件。<\/p>\n<p><strong>实例<\/strong>：<span class=\"katex-inline\">\\mathbf{W}=\\begin{bmatrix}1&amp;2\\\\0&amp;-1\\end{bmatrix}<\/span>，<span class=\"katex-inline\">\\mathbf{x}=\\begin{bmatrix}3\\\\4\\end{bmatrix}<\/span>。<\/p>\n<p>第一行点积：<span class=\"katex-inline\">1\\times 3+2\\times 4=11<\/span>。第二行点积：<span class=\"katex-inline\">0\\times 3+(-1)\\times 4=-4<\/span>。<\/p>\n<div class=\"katex-block\">\\mathbf{W}\\mathbf{x}=\\begin{bmatrix}11\\\\-4\\end{bmatrix}<\/div>\n<p>再加上偏置 <span class=\"katex-inline\">\\mathbf{b}=\\begin{bmatrix}-5\\\\2\\end{bmatrix}<\/span>，得到 <span class=\"katex-inline\">\\mathbf{z}=\\begin{bmatrix}6\\\\-2\\end{bmatrix}<\/span>。<\/p>\n<p>维度检查：<span class=\"katex-inline\">\\mathbf{W}<\/span> 是 2×2，<span class=\"katex-inline\">\\mathbf{x}<\/span> 是 2 维，中间的 2 对上，输出 2 维。没问题。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为矩阵乘法是&quot;对应位置相乘&quot;<\/strong>——对应位置相乘叫逐元素乘法，记作 <span class=\"katex-inline\">\\mathbf{A}\\odot\\mathbf{B}<\/span>，结果是同样形状的矩阵。矩阵乘法是&quot;行与列做点积再求和&quot;，结果是不同的形状。这两个运算完全不同，写代码时也容易混。<\/p>\n<p><strong>别以为向量就是一列数字所以没区别<\/strong>——向量有维数，有方向含义。把 3 维向量塞进要求 4 维输入的层，程序会直接报错。维度是硬约束，不是建议。<\/p>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n算 <span class=\"katex-inline\">\\mathbf{w}=(1,-2,2)<\/span> 与 <span class=\"katex-inline\">\\mathbf{x}=(3,1,2)<\/span> 的点积。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">1\\times 3+(-2)\\times 1+2\\times 2=3-2+4=5<\/span>。<\/p>\n<p><strong>解析<\/strong>：逐项相乘再相加，负号跟着权重走。<\/p>\n<ol><li>\n矩阵 <span class=\"katex-inline\">\\begin{bmatrix}2&amp;1\\\\-1&amp;3\\end{bmatrix}<\/span> 乘向量 <span class=\"katex-inline\">\\begin{bmatrix}1\\\\2\\end{bmatrix}<\/span>，结果是什么？\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">\\begin{bmatrix}4\\\\5\\end{bmatrix}<\/span>。<\/p>\n<p><strong>解析<\/strong>：第一行 <span class=\"katex-inline\">2\\times 1+1\\times 2=4<\/span>；第二行 <span class=\"katex-inline\">-1\\times 1+3\\times 2=5<\/span>。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n向量 = 一组数打包；维数 = 数的个数。\n<\/li><li>\n点积 = 对应相乘再相加 = 加权求和。\n<\/li><li>\n矩阵乘向量：每一行做一个点积，行数决定输出维数。\n<\/li><li>\n一层网络写成 <span class=\"katex-inline\">\\mathbf{z}=\\mathbf{W}\\mathbf{x}+\\mathbf{b}<\/span>。\n<\/ul>", "ch06": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：一条直线能干什么<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch05\">第 5 章：一堆数怎么算<\/a><\/span><\/div><h1>第 6 章：一个神经元<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1 小时 | <strong>前置<\/strong>：第 2、5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出一个神经元的完整计算过程；\n<\/li><li>\n说明权重向量与分界线方向的关系；\n<\/li><li>\n用表格验证一个神经元能做&quot;与&quot;和&quot;或&quot;，但做不了&quot;异或&quot;。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>一个神经元就是&quot;加权打分 + 过门槛&quot;，几何上等价于一条分界线。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>从分类规则到神经元<\/h3>\n<p>第 2 章的规则：<span class=\"katex-inline\">z=w_1x_1+w_2x_2+b<\/span>，<span class=\"katex-inline\">z&gt;0<\/span> 判 1，否则判 0。<\/p>\n<p>把这套东西画成一个单元，就是<strong>神经元<\/strong>（也叫<strong>感知机<\/strong>，perceptron）：<\/p>\n<div>\n<svg viewBox=\"0 0 460 150\" width=\"100%\" role=\"img\" aria-label=\"一个神经元的计算流程\">\n<circle cx=\"70\" cy=\"45\" r=\"14\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n<text x=\"64\" y=\"50\" font-size=\"12\" fill=\"#16a34a\">x1<\/text>\n<circle cx=\"70\" cy=\"105\" r=\"14\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n<text x=\"64\" y=\"110\" font-size=\"12\" fill=\"#16a34a\">x2<\/text>\n<rect x=\"150\" y=\"40\" width=\"150\" height=\"70\" rx=\"10\" fill=\"none\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n<text x=\"168\" y=\"68\" font-size=\"13\" fill=\"#3b82f6\">加权求和<\/text>\n<text x=\"168\" y=\"92\" font-size=\"13\" fill=\"#3b82f6\">z = w·x + b<\/text>\n<rect x=\"350\" y=\"50\" width=\"80\" height=\"50\" rx=\"8\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\"/>\n<text x=\"362\" y=\"72\" font-size=\"12\" fill=\"#dc2626\">过门槛<\/text>\n<text x=\"368\" y=\"90\" font-size=\"12\" fill=\"#dc2626\">输出 0/1<\/text>\n<line x1=\"88\" y1=\"50\" x2=\"145\" y2=\"60\" stroke=\"#6b7280\"/>\n<line x1=\"88\" y1=\"100\" x2=\"145\" y2=\"90\" stroke=\"#6b7280\"/>\n<line x1=\"302\" y1=\"75\" x2=\"345\" y2=\"75\" stroke=\"#6b7280\"/>\n<text x=\"96\" y=\"42\" font-size=\"11\" fill=\"#9ca3af\">w1<\/text>\n<text x=\"96\" y=\"112\" font-size=\"11\" fill=\"#9ca3af\">w2<\/text>\n<\/svg>\n<\/div>\n<p>计算分两步：<\/p>\n<div class=\"katex-block\">z=\\mathbf{w}\\cdot\\mathbf{x}+b,\\qquad \\hat{y}=\\begin{cases}1,& z>0\\\\0,& z\\le 0\\end{cases}<\/div>\n<p>第二步那个&quot;大于 0 输出 1，否则输出 0&quot;的函数，叫<strong>阶跃函数<\/strong>。它在 0 处突然从 0 跳到 1，形状像一级台阶。<\/p>\n<p><span class=\"katex-inline\">\\hat{y}<\/span> 读作&quot;y hat&quot;，表示模型的预测值，区别于真实标签 <span class=\"katex-inline\">y<\/span>。<\/p>\n<h3>权重向量决定分界线的方向<\/h3>\n<p>分界线是 <span class=\"katex-inline\">z=0<\/span>，即 <span class=\"katex-inline\">\\mathbf{w}\\cdot\\mathbf{x}+b=0<\/span>。<\/p>\n<p>以二维为例，<span class=\"katex-inline\">\\mathbf{w}=(w_1,w_2)<\/span>。可以证明，<span class=\"katex-inline\">\\mathbf{w}<\/span> 垂直于这条分界线。验证一下：分界线上取两点 <span class=\"katex-inline\">\\mathbf{x}<\/span> 和 <span class=\"katex-inline\">\\mathbf{x}+\\mathbf{d}<\/span>，都满足 <span class=\"katex-inline\">\\mathbf{w}\\cdot\\mathbf{x}+b=0<\/span> 和 <span class=\"katex-inline\">\\mathbf{w}\\cdot(\\mathbf{x}+\\mathbf{d})+b=0<\/span>。两式相减得 <span class=\"katex-inline\">\\mathbf{w}\\cdot\\mathbf{d}=0<\/span>。点积为 0 表示 <span class=\"katex-inline\">\\mathbf{w}<\/span> 与方向 <span class=\"katex-inline\">\\mathbf{d}<\/span> 垂直，而 <span class=\"katex-inline\">\\mathbf{d}<\/span> 是沿着分界线走的。所以 <span class=\"katex-inline\">\\mathbf{w}<\/span> 垂直于分界线。<\/p>\n<p><span class=\"katex-inline\">\\mathbf{w}<\/span> 指向的一侧，<span class=\"katex-inline\">\\mathbf{w}\\cdot\\mathbf{x}<\/span> 更大，<span class=\"katex-inline\">z<\/span> 为正。所以权重向量的方向就是&quot;判 1 的那一侧&quot;的方向。<\/p>\n<p><span class=\"katex-inline\">b<\/span> 控制分界线离原点多远。<span class=\"katex-inline\">b<\/span> 增大，分界线朝 <span class=\"katex-inline\">\\mathbf{w}<\/span> 的反方向平移。<\/p>\n<h3>它能做什么：与、或<\/h3>\n<p>固定 <span class=\"katex-inline\">\\mathbf{w}=(1,1)<\/span>，只改偏置。<\/p>\n<p><strong>与（AND）<\/strong>，<span class=\"katex-inline\">b=-1.5<\/span>：<\/p>\n<table><thead><tr><th><span class=\"katex-inline\">x_1<\/span><\/th><th><span class=\"katex-inline\">x_2<\/span><\/th><th><span class=\"katex-inline\">z=x_1+x_2-1.5<\/span><\/th><th>输出<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td><span class=\"katex-inline\">-1.5<\/span><\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td><span class=\"katex-inline\">-0.5<\/span><\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td><span class=\"katex-inline\">-0.5<\/span><\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td><span class=\"katex-inline\">0.5<\/span><\/td><td>1<\/td><\/tr><\/tbody><\/table>\n<p><strong>或（OR）<\/strong>，<span class=\"katex-inline\">b=-0.5<\/span>：<\/p>\n<table><thead><tr><th><span class=\"katex-inline\">x_1<\/span><\/th><th><span class=\"katex-inline\">x_2<\/span><\/th><th><span class=\"katex-inline\">z=x_1+x_2-0.5<\/span><\/th><th>输出<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td><span class=\"katex-inline\">-0.5<\/span><\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td><span class=\"katex-inline\">0.5<\/span><\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td><span class=\"katex-inline\">0.5<\/span><\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td><span class=\"katex-inline\">1.5<\/span><\/td><td>1<\/td><\/tr><\/tbody><\/table>\n<p>同一个权重，偏置从 <span class=\"katex-inline\">-1.5<\/span> 改成 <span class=\"katex-inline\">-0.5<\/span>，直线平移，功能就从&quot;与&quot;变成&quot;或&quot;。<\/p>\n<h3>它做不到什么：异或<\/h3>\n<p><strong>异或（XOR）<\/strong>的规则是&quot;两个输入不同时输出 1，相同时输出 0&quot;：<\/p>\n<table><thead><tr><th><span class=\"katex-inline\">x_1<\/span><\/th><th><span class=\"katex-inline\">x_2<\/span><\/th><th>期望输出<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>0<\/td><\/tr><\/tbody><\/table>\n<p>把四个点画在平面上，<span class=\"katex-inline\">(0,0)<\/span> 和 <span class=\"katex-inline\">(1,1)<\/span> 是一类，<span class=\"katex-inline\">(0,1)<\/span> 和 <span class=\"katex-inline\">(1,0)<\/span> 是另一类。两类点交错排列，像国际象棋棋盘的两个颜色。<\/p>\n<p>一条直线最多把平面切成两半，切出来的每一半都是&quot;连成一片&quot;的凸区域。异或的两类点各自分散在对角，任何一条直线都会把其中一类切成两半。所以单个神经元做不到异或。<\/p>\n<div>\n<svg viewBox=\"0 0 340 300\" width=\"100%\" role=\"img\" aria-label=\"异或四个点无法被一条直线分开\">\n<rect x=\"50\" y=\"30\" width=\"240\" height=\"240\" fill=\"none\" stroke=\"#9ca3af\"/>\n<line x1=\"50\" y1=\"270\" x2=\"290\" y2=\"270\" stroke=\"#9ca3af\"/>\n<line x1=\"50\" y1=\"270\" x2=\"50\" y2=\"30\" stroke=\"#9ca3af\"/>\n<circle cx=\"60\" cy=\"260\" r=\"8\" fill=\"#dc2626\"/>\n<circle cx=\"60\" cy=\"40\" r=\"8\" fill=\"#16a34a\"/>\n<circle cx=\"280\" cy=\"260\" r=\"8\" fill=\"#16a34a\"/>\n<circle cx=\"280\" cy=\"40\" r=\"8\" fill=\"#dc2626\"/>\n<text x=\"70\" y=\"282\" font-size=\"12\" fill=\"#6b7280\">(0,0) 判 0<\/text>\n<text x=\"70\" y=\"30\" font-size=\"12\" fill=\"#6b7280\">(0,1) 判 1<\/text>\n<text x=\"222\" y=\"282\" font-size=\"12\" fill=\"#6b7280\">(1,0) 判 1<\/text>\n<text x=\"222\" y=\"30\" font-size=\"12\" fill=\"#6b7280\">(1,1) 判 0<\/text>\n<line x1=\"50\" y1=\"150\" x2=\"290\" y2=\"150\" stroke=\"#3b82f6\" stroke-dasharray=\"6 5\"/>\n<text x=\"100\" y=\"143\" font-size=\"12\" fill=\"#3b82f6\">任何一条线都会切错<\/text>\n<\/svg>\n<\/div>\n<p>看图说明：红色是判 0 的点，绿色是判 1 的点。它们在对角交错。蓝色虚线是一种尝试，无论怎么平移或旋转，一条直线都不可能把两红两绿完整分开。<\/p>\n<p>这个失败不是&quot;参数没调好&quot;，是几何上做不到。要解决它，必须把多个神经元组合起来，或者把输入做一次变换——这正是第 8 章多层网络要做的事。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：神经元像一个评委。每个评分项有分值（权重），加起来超过及格线（负偏置的绝对值）就通过。评委只给&quot;通过/不通过&quot;，不给具体分数。<\/p>\n<p>类比失效的地方：真人评委可以改评分标准，神经元的权重在训练时才会改；一次前向计算中它是固定不变的。<\/p>\n<p><strong>实例<\/strong>：<span class=\"katex-inline\">\\mathbf{w}=(2,-1)<\/span>，<span class=\"katex-inline\">b=-1<\/span>，判断点 <span class=\"katex-inline\">(1,1)<\/span>。<\/p>\n<p><span class=\"katex-inline\">z=2\\times 1+(-1)\\times 1-1=0<\/span>。<span class=\"katex-inline\">z=0<\/span> 正好在分界线上，按约定输出 0。<\/p>\n<p>换成 <span class=\"katex-inline\">(2,1)<\/span>：<span class=\"katex-inline\">z=4-1-1=2&gt;0<\/span>，输出 1。换成 <span class=\"katex-inline\">(0,2)<\/span>：<span class=\"katex-inline\">z=0-2-1=-3&lt;0<\/span>，输出 0。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为神经元模拟了生物神经元<\/strong>——名字是借来的，实际计算就是加权求和加一个阈值。生物神经元有化学信号、树突、轴突、放电频率，这些机制在模型里都没有。把它当成一个数学单元，比当成&quot;电子大脑&quot;更有用。<\/p>\n<p><strong>别以为一个神经元只能做很简单的判断所以没用<\/strong>——单个神经元只能切一刀，但它是积木。几百个这样的积木分层组合，能拼出很复杂的边界。限制不在单个单元，在组合方式。<\/p>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n神经元 <span class=\"katex-inline\">\\mathbf{w}=(1,2)<\/span>，<span class=\"katex-inline\">b=-3<\/span>，输入 <span class=\"katex-inline\">(1,1)<\/span> 输出是多少？\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">z=1+2-3=0<\/span>，按&quot;<span class=\"katex-inline\">z&gt;0<\/span> 才输出 1&quot;的规则，输出 0。<\/p>\n<p><strong>解析<\/strong>：先算加权和，再比门槛。<span class=\"katex-inline\">z=0<\/span> 属于&quot;不大于 0&quot;，输出 0。<\/p>\n<ol><li>\n要用手写权重实现&quot;非&quot;运算（输入 1 输出 0，输入 0 输出 1），<span class=\"katex-inline\">\\mathbf{w}<\/span> 和 <span class=\"katex-inline\">b<\/span> 可以怎么取？\n<\/ol>\n<p><strong>答案<\/strong>：例如 <span class=\"katex-inline\">w=-1<\/span>，<span class=\"katex-inline\">b=0.5<\/span>。输入 1 时 <span class=\"katex-inline\">z=-0.5&lt;0<\/span> 输出 0；输入 0 时 <span class=\"katex-inline\">z=0.5&gt;0<\/span> 输出 1。<\/p>\n<p><strong>解析<\/strong>：非运算就是把判断翻过来，权重取负即可，偏置取在 0 和 1 之间。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n神经元 = 加权求和 + 过门槛，<span class=\"katex-inline\">\\hat{y}=1<\/span> 当且仅当 <span class=\"katex-inline\">\\mathbf{w}\\cdot\\mathbf{x}+b&gt;0<\/span>。\n<\/li><li>\n权重向量垂直于分界线，指向判 1 的一侧；偏置控制分界线平移。\n<\/li><li>\n单层能做到与、或、非，做不到异或。\n<\/ul>", "ch07": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：套娃函数怎么求导<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch05\">第 5 章：一堆数怎么算<\/a><\/span><\/div><h1>第 7 章：为什么必须拐弯<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：1.2 小时 | <strong>前置<\/strong>：第 3、4、5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n证明&quot;两层纯线性叠在一起，等价于一层&quot;；\n<\/li><li>\n写出 sigmoid 的表达式，并推出它的导数 <span class=\"katex-inline\">\\sigma&#x27;(z)=\\sigma(z)(1-\\sigma(z))<\/span>；\n<\/li><li>\n说明 ReLU 是什么，以及它为什么在深网络里更常用。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>没有非线性，叠多少层都等于一层；激活函数的存在，是为了让&quot;深度&quot;真的有意义。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>先看一个坏消息：纯线性叠加会塌缩<\/h3>\n<p>假设第一层：<\/p>\n<div class=\"katex-block\">\\mathbf{z}_1=\\mathbf{W}_1\\mathbf{x}+\\mathbf{b}_1<\/div>\n<p>第二层：<\/p>\n<div class=\"katex-block\">\\mathbf{z}_2=\\mathbf{W}_2\\mathbf{z}_1+\\mathbf{b}_2<\/div>\n<p>把第一层代进第二层：<\/p>\n<div class=\"katex-block\">\\mathbf{z}_2=\\mathbf{W}_2(\\mathbf{W}_1\\mathbf{x}+\\mathbf{b}_1)+\\mathbf{b}_2\\\\=\\mathbf{W}_2\\mathbf{W}_1\\mathbf{x}+(\\mathbf{W}_2\\mathbf{b}_1+\\mathbf{b}_2)<\/div>\n<p>记 <span class=\"katex-inline\">\\mathbf{W}=\\mathbf{W}_2\\mathbf{W}_1<\/span>，<span class=\"katex-inline\">\\mathbf{B}=\\mathbf{W}_2\\mathbf{b}_1+\\mathbf{b}_2<\/span>，则：<\/p>\n<div class=\"katex-block\">\\mathbf{z}_2=\\mathbf{W}\\mathbf{x}+\\mathbf{B}<\/div>\n<p>这仍然是一层线性变换。再叠十层，还是同样的形式，只是 <span class=\"katex-inline\">\\mathbf{W}<\/span> 变成十个矩阵连乘。<\/p>\n<p><strong>结论：纯线性多层网络和单层线性网络能力完全相同。<\/strong> 堆层数没有带来任何新东西，只是把参数换了个方式组合。<\/p>\n<p>要突破这一点，每一层算完之后必须加一个非线性函数，把&quot;直线&quot;掰弯。<\/p>\n<h3>sigmoid：把任意实数压进 (0,1)<\/h3>\n<div class=\"katex-block\">\\sigma(z)=\\frac{1}{1+e^{-z}}<\/div>\n<p><span class=\"katex-inline\">e<\/span> 是自然常数，约等于 2.71828。<span class=\"katex-inline\">e^{-z}<\/span> 是一个指数函数。<\/p>\n<p>这个函数有几个关键性质：<\/p>\n<ul><li>\n输入 <span class=\"katex-inline\">z=0<\/span> 时，<span class=\"katex-inline\">\\sigma(0)=1/(1+1)=0.5<\/span>；\n<\/li><li>\n<span class=\"katex-inline\">z<\/span> 很大时 <span class=\"katex-inline\">e^{-z}<\/span> 接近 0，<span class=\"katex-inline\">\\sigma(z)<\/span> 接近 1；\n<\/li><li>\n<span class=\"katex-inline\">z<\/span> 很小时 <span class=\"katex-inline\">e^{-z}<\/span> 变得很大，<span class=\"katex-inline\">\\sigma(z)<\/span> 接近 0；\n<\/li><li>\n值域是 <span class=\"katex-inline\">(0,1)<\/span>，永远不会真正等于 0 或 1；\n<\/li><li>\n单调递增，输入越大输出越大。\n<\/ul>\n<p>它把任意范围的数压成&quot;概率&quot;的样子。输出 0.8 可以理解成&quot;模型认为有 80% 的把握&quot;。<\/p>\n<div>\n<svg viewBox=\"0 0 460 300\" width=\"100%\" role=\"img\" aria-label=\"sigmoid 曲线\">\n<line x1=\"50\" y1=\"250\" x2=\"430\" y2=\"250\" stroke=\"#9ca3af\"/>\n<line x1=\"240\" y1=\"250\" x2=\"240\" y2=\"35\" stroke=\"#9ca3af\"/>\n<line x1=\"50\" y1=\"142\" x2=\"430\" y2=\"142\" stroke=\"#9ca3af\" stroke-dasharray=\"5 5\"/>\n<path d=\"M 60 245 C 150 245, 190 215, 220 155 C 250 95, 300 45, 420 38\" fill=\"none\" stroke=\"#3b82f6\" stroke-width=\"2.5\"/>\n<circle cx=\"240\" cy=\"142\" r=\"4\" fill=\"#dc2626\"/>\n<text x=\"250\" y=\"160\" font-size=\"12\" fill=\"#dc2626\">z=0, σ=0.5<\/text>\n<text x=\"420\" y=\"30\" font-size=\"12\" fill=\"#6b7280\">趋近 1<\/text>\n<text x=\"60\" y=\"270\" font-size=\"12\" fill=\"#6b7280\">趋近 0<\/text>\n<text x=\"400\" y=\"140\" font-size=\"12\" fill=\"#9ca3af\">0.5 水平线<\/text>\n<\/svg>\n<\/div>\n<p>看图说明：横轴是输入 <span class=\"katex-inline\">z<\/span>，纵轴是输出 <span class=\"katex-inline\">\\sigma(z)<\/span>。曲线在中间近似线性，两端被压平。红色点是 <span class=\"katex-inline\">z=0<\/span> 的位置，输出正好 0.5。两端越往右或往左，越贴近 0 和 1，但永远不越过。<\/p>\n<h3>推 sigmoid 的导数<\/h3>\n<p>这一步要用第 4 章的链式法则。先把 <span class=\"katex-inline\">\\sigma(z)<\/span> 改写成分数指数：<\/p>\n<div class=\"katex-block\">\\sigma(z)=(1+e^{-z})^{-1}<\/div>\n<p>设内层 <span class=\"katex-inline\">u=1+e^{-z}<\/span>，外层 <span class=\"katex-inline\">u^{-1}<\/span>。外层导数：<\/p>\n<div class=\"katex-block\">\\frac{d}{du}u^{-1}=-u^{-2}<\/div>\n<p>内层导数：<span class=\"katex-inline\">e^{-z}<\/span> 对 <span class=\"katex-inline\">z<\/span> 求导，等于 <span class=\"katex-inline\">-e^{-z}<\/span>（指数函数求导还是自己，链式法则再乘 <span class=\"katex-inline\">-z<\/span> 的导数 <span class=\"katex-inline\">-1<\/span>）。<\/p>\n<p>乘起来：<\/p>\n<div class=\"katex-block\">\\sigma'(z)=-u^{-2}\\cdot(-e^{-z})=\\frac{e^{-z}}{(1+e^{-z})^2}<\/div>\n<p>现在把它和 <span class=\"katex-inline\">\\sigma(z)<\/span> 对上。记 <span class=\"katex-inline\">\\sigma=\\dfrac{1}{1+e^{-z}}<\/span>，则：<\/p>\n<div class=\"katex-block\">1-\\sigma=\\frac{1+e^{-z}-1}{1+e^{-z}}=\\frac{e^{-z}}{1+e^{-z}}<\/div>\n<p>于是：<\/p>\n<div class=\"katex-block\">\\sigma'=\\frac{e^{-z}}{(1+e^{-z})^2}\\\\=\\frac{1}{1+e^{-z}}\\cdot\\frac{e^{-z}}{1+e^{-z}}\\\\=\\sigma(1-\\sigma)<\/div>\n<p>结果很干净：<\/p>\n<div class=\"katex-block\">\\sigma'(z)=\\sigma(z)\\big(1-\\sigma(z)\\big)<\/div>\n<p>知道输出，就能算出导数，不用重新代公式。这个性质让反向传播省了很多计算。<\/p>\n<h3>数值感受<\/h3>\n<table><thead><tr><th><span class=\"katex-inline\">z<\/span><\/th><th><span class=\"katex-inline\">\\sigma(z)<\/span><\/th><th><span class=\"katex-inline\">\\sigma&#x27;(z)<\/span><\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">-4<\/span><\/td><td>0.017986<\/td><td>0.017663<\/td><\/tr><tr><td><span class=\"katex-inline\">-2<\/span><\/td><td>0.119203<\/td><td>0.104994<\/td><\/tr><tr><td><span class=\"katex-inline\">-1<\/span><\/td><td>0.268941<\/td><td>0.196612<\/td><\/tr><tr><td><span class=\"katex-inline\">0<\/span><\/td><td>0.500000<\/td><td>0.250000<\/td><\/tr><tr><td><span class=\"katex-inline\">1<\/span><\/td><td>0.731059<\/td><td>0.196612<\/td><\/tr><tr><td><span class=\"katex-inline\">2<\/span><\/td><td>0.880797<\/td><td>0.104994<\/td><\/tr><tr><td><span class=\"katex-inline\">4<\/span><\/td><td>0.982014<\/td><td>0.017663<\/td><\/tr><\/tbody><\/table>\n<p>导数的最大值在 <span class=\"katex-inline\">z=0<\/span> 处，等于 0.25。两端导数迅速接近 0。这意味着：当神经元已经&quot;很确定&quot;（输出接近 0 或 1）时，梯度几乎传不回去。这是<strong>梯度消失<\/strong>问题的根源，深层网络里会越积越严重。<\/p>\n<h3>ReLU：更简单，也更常用<\/h3>\n<div class=\"katex-block\">\\mathrm{ReLU}(z)=\\max(0,z)<\/div>\n<p>负数输出 0，正数原样输出。导数更简单：<\/p>\n<div class=\"katex-block\">\\mathrm{ReLU}'(z)=\\begin{cases}1,& z>0\\\\0,& z\\le 0\\end{cases}<\/div>\n<p>正区间的导数恒为 1，不会像 sigmoid 那样越传越小。计算也便宜，只要比较一次。所以现代深层网络（尤其是卷积网络）大量使用 ReLU 及其变体。<\/p>\n<p>缺点也有：负区间的导数为 0，一旦某个神经元长期落在负区，它的参数就收不到梯度，可能&quot;死掉&quot;。实际训练里用带小斜率的变体（Leaky ReLU）或调整初始化来缓解。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：sigmoid 像一个调光开关。拧到中间时亮度变化明显，拧到最亮或最暗时再拧也看不出差别。导数就是&quot;拧一格能变多少亮度&quot;，两端变小。<\/p>\n<p>类比失效的地方：调光开关是物理器件，sigmoid 是数学函数；开关两端仍然可以继续拧，sigmoid 的输出永远碰不到 0 和 1。<\/p>\n<p><strong>实例<\/strong>：<span class=\"katex-inline\">z=0.45<\/span> 时，<span class=\"katex-inline\">\\sigma(0.45)=0.610639<\/span>，<span class=\"katex-inline\">\\sigma&#x27;(0.45)=0.610639\\times 0.389361=0.237759<\/span>。<\/p>\n<p>如果 <span class=\"katex-inline\">z<\/span> 从 0.45 增加到 0.46，输出大约增加 <span class=\"katex-inline\">0.237759\\times 0.01\\approx 0.00238<\/span>，变成约 0.61302。实际算 <span class=\"katex-inline\">\\sigma(0.46)=0.612967<\/span>，差 0.00233，与近似值很接近。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为激活函数是为了模仿大脑<\/strong>——它的数学作用是打破线性。没有它，多层网络会塌缩成一层。生物灵感只是历史来源，不是设计理由。<\/p>\n<p><strong>别以为 sigmoid 的输出一定是概率<\/strong>——它落在 <span class=\"katex-inline\">(0,1)<\/span> 之间，看起来像概率，但只有经过特定损失函数（交叉熵）训练、并且做归一化之后，才有概率的解释。单看数值不能直接叫概率。<\/p>\n<p><strong>别以为层数越多一定越强<\/strong>——非线性让多层有表达力，但层数增加也带来梯度消失、过拟合、训练不稳定。深度是手段，不是目的。<\/p>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n证明 <span class=\"katex-inline\">\\sigma&#x27;(z)=\\sigma(z)(1-\\sigma(z))<\/span> 在 <span class=\"katex-inline\">z=0<\/span> 处等于 0.25。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">\\sigma(0)=0.5<\/span>，<span class=\"katex-inline\">\\sigma&#x27;(0)=0.5\\times(1-0.5)=0.25<\/span>。<\/p>\n<p><strong>解析<\/strong>：直接代入公式。0.25 也是 sigmoid 导数的最大值，说明中间区域梯度最强。<\/p>\n<ol><li>\n如果去掉所有激活函数，一个 10 层、每层 100 个神经元的网络等价于什么？\n<\/ol>\n<p><strong>答案<\/strong>：等价于一个单层线性变换 <span class=\"katex-inline\">\\mathbf{y}=\\mathbf{W}\\mathbf{x}+\\mathbf{B}<\/span>，其中 <span class=\"katex-inline\">\\mathbf{W}<\/span> 是十个权重矩阵的连乘。<\/p>\n<p><strong>解析<\/strong>：线性变换复合仍是线性变换。参数量看起来很多，但表达能力没有超过一层线性模型。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n纯线性叠加会塌缩：两层等于一层。\n<\/li><li>\n<span class=\"katex-inline\">\\sigma(z)=1/(1+e^{-z})<\/span>，导数 <span class=\"katex-inline\">\\sigma(1-\\sigma)<\/span>，最大值 0.25。\n<\/li><li>\nReLU <span class=\"katex-inline\">=\\max(0,z)<\/span>，正区间导数恒为 1，缓解梯度消失。\n<\/li><li>\n激活函数的作用是打破线性，不是模仿大脑。\n<\/ul>", "ch08": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch06\">第 6 章：一个神经元<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch07\">第 7 章：为什么必须拐弯<\/a><\/span><\/div><h1>第 8 章：把神经元摞起来<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1.2 小时 | <strong>前置<\/strong>：第 6、7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n画出 2-2-1 网络的结构，数清它的参数；\n<\/li><li>\n按层算出前向传播的每一个中间值；\n<\/li><li>\n解释隐藏层在做什么，以及为什么叫&quot;隐藏&quot;。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>前向传播就是按层做&quot;矩阵乘 + 加偏置 + 过激活&quot;，一层一层往前推，直到算出输出。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>网络结构<\/h3>\n<p>要算的网络长这样：2 个输入，2 个隐藏神经元，1 个输出。<\/p>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    x1[&quot;x1&quot;] --&gt; h1[&quot;h1&quot;]\n    x1 --&gt; h2[&quot;h2&quot;]\n    x2[&quot;x2&quot;] --&gt; h1\n    x2 --&gt; h2\n    h1 --&gt; o[&quot;输出 ŷ&quot;]\n    h2 --&gt; o<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边两个输入，中间两个隐藏神经元，右边一个输出。每根箭头代表一个权重。这个网络共有 <span class=\"katex-inline\">2\\times 2+2\\times 1=6<\/span> 个权重，加上 2 个隐藏偏置和 1 个输出偏置，一共 9 个参数。<\/p>\n<h3>规定好符号<\/h3>\n<p>输入：<\/p>\n<div class=\"katex-block\">x_1=1.0,\\qquad x_2=0.5<\/div>\n<p>隐藏层权重与偏置：<\/p>\n<div class=\"katex-block\">w_{11}=0.5,\\ w_{12}=-0.3,\\ b_1=0.1<\/div>\n<div class=\"katex-block\">w_{21}=0.2,\\ w_{22}=0.8,\\ b_2=-0.2<\/div>\n<p>输出层权重与偏置：<\/p>\n<div class=\"katex-block\">v_1=0.6,\\ v_2=-0.4,\\ b_o=0.2<\/div>\n<p><span class=\"katex-inline\">w_{ij}<\/span> 的第一个下标是隐藏神经元编号，第二个是输入编号。<span class=\"katex-inline\">v_i<\/span> 是输出神经元连到第 <span class=\"katex-inline\">i<\/span> 个隐藏神经元的权重。<\/p>\n<p>激活函数统一用 sigmoid。<\/p>\n<h3>第一层：算两个隐藏值<\/h3>\n<p>第一个隐藏神经元：<\/p>\n<div class=\"katex-block\">z_1=w_{11}x_1+w_{12}x_2+b_1=0.5\\times 1.0+(-0.3)\\times 0.5+0.1<\/div>\n<div class=\"katex-block\">z_1=0.5-0.15+0.1=0.45<\/div>\n<div class=\"katex-block\">h_1=\\sigma(0.45)=\\frac{1}{1+e^{-0.45}}=\\frac{1}{1+0.637628}=0.610639<\/div>\n<p>第二个隐藏神经元：<\/p>\n<div class=\"katex-block\">z_2=w_{21}x_1+w_{22}x_2+b_2=0.2\\times 1.0+0.8\\times 0.5-0.2<\/div>\n<div class=\"katex-block\">z_2=0.2+0.4-0.2=0.4<\/div>\n<div class=\"katex-block\">h_2=\\sigma(0.4)=\\frac{1}{1+e^{-0.4}}=\\frac{1}{1+0.670320}=0.598688<\/div>\n<p>两个隐藏值都算出来了：<span class=\"katex-inline\">h_1=0.610639<\/span>，<span class=\"katex-inline\">h_2=0.598688<\/span>。<\/p>\n<h3>第二层：算输出<\/h3>\n<div class=\"katex-block\">z_o=v_1h_1+v_2h_2+b_o=0.6\\times 0.610639+(-0.4)\\times 0.598688+0.2<\/div>\n<p>分项算：<\/p>\n<div class=\"katex-block\">0.6\\times 0.610639=0.366383<\/div>\n<div class=\"katex-block\">-0.4\\times 0.598688=-0.239475<\/div>\n<div class=\"katex-block\">z_o=0.366383-0.239475+0.2=0.326908<\/div>\n<p>再过一次 sigmoid：<\/p>\n<div class=\"katex-block\">\\hat{y}=\\sigma(0.326908)=\\frac{1}{1+e^{-0.326908}}=\\frac{1}{1+0.721112}=0.581007<\/div>\n<p>网络对输入 <span class=\"katex-inline\">(1.0,0.5)<\/span> 的预测是 0.581。如果真实标签是 1，这个预测偏低了一点；如果真实标签是 0，又偏高。第 9 章会用这个差距定义损失。<\/p>\n<h3>一张表看全过程<\/h3>\n<table><thead><tr><th>步骤<\/th><th>计算<\/th><th>结果<\/th><\/tr><\/thead><tbody><tr><td>隐藏层打分 1<\/td><td><span class=\"katex-inline\">0.5\\times 1.0-0.3\\times 0.5+0.1<\/span><\/td><td>0.4500<\/td><\/tr><tr><td>隐藏层激活 1<\/td><td><span class=\"katex-inline\">\\sigma(0.45)<\/span><\/td><td>0.610639<\/td><\/tr><tr><td>隐藏层打分 2<\/td><td><span class=\"katex-inline\">0.2\\times 1.0+0.8\\times 0.5-0.2<\/span><\/td><td>0.4000<\/td><\/tr><tr><td>隐藏层激活 2<\/td><td><span class=\"katex-inline\">\\sigma(0.4)<\/span><\/td><td>0.598688<\/td><\/tr><tr><td>输出层打分<\/td><td><span class=\"katex-inline\">0.6h_1-0.4h_2+0.2<\/span><\/td><td>0.326908<\/td><\/tr><tr><td>输出层激活<\/td><td><span class=\"katex-inline\">\\sigma(0.326908)<\/span><\/td><td>0.581007<\/td><\/tr><\/tbody><\/table>\n<h3>用矩阵写一遍<\/h3>\n<p>同样的计算，用第 5 章的写法：<\/p>\n<div class=\"katex-block\">\\mathbf{W}=\\begin{bmatrix}0.5&-0.3\\\\0.2&0.8\\end{bmatrix},\\quad\\\\\\mathbf{b}=\\begin{bmatrix}0.1\\\\-0.2\\end{bmatrix},\\quad\\\\\\mathbf{x}=\\begin{bmatrix}1.0\\\\0.5\\end{bmatrix}<\/div>\n<div class=\"katex-block\">\\mathbf{z}=\\mathbf{W}\\mathbf{x}+\\mathbf{b}=\\begin{bmatrix}0.45\\\\0.4\\end{bmatrix}<\/div>\n<div class=\"katex-block\">\\mathbf{h}=\\sigma(\\mathbf{z})=\\begin{bmatrix}0.610639\\\\0.598688\\end{bmatrix}<\/div>\n<p>输出层：<\/p>\n<div class=\"katex-block\">\\mathbf{v}=\\begin{bmatrix}0.6&-0.4\\end{bmatrix},\\qquad z_o=\\mathbf{v}\\mathbf{h}+0.2=0.326908<\/div>\n<p>矩阵写法把&quot;逐个神经元循环&quot;变成了&quot;一次乘加&quot;。层数多、神经元多时，这个差别决定了能不能在合理时间内算完。<\/p>\n<h3>隐藏层在做什么<\/h3>\n<p>&quot;隐藏&quot;这个名字来自历史：训练数据里能看到输入和输出，中间层的值没有标签告诉我们对不对，它们是网络自己算出来的中间表示，从外面看不见。<\/p>\n<p>它做的不是&quot;把输入抄一遍&quot;。每个隐藏神经元对输入做一次加权组合，再过非线性，得到一个新的数。两个隐藏神经元就得到两个新数，相当于把原来 2 维的输入换了一套坐标。输出层在这套新坐标上再做一次线性组合。<\/p>\n<p>可以把它理解成&quot;网络自己学出来的一组特征&quot;。手写数字识别里，靠前的隐藏层可能对边缘敏感，靠后的可能对笔画组合敏感。但这是训练后观察到的现象，不是设计时写死的规则。多数情况下，单个隐藏神经元的含义很难用一句话说清。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：一条流水线。第一组工人把原料按不同配方混合，产出两种半成品；第二组工人把半成品再按配方混合，产出成品。每个工人只做&quot;按配方称量混合&quot;这一件事，配方（权重）决定最终产品。<\/p>\n<p>类比失效的地方：流水线的配方是人定的，网络里的配方是训练出来的；流水线工人不会互相影响，隐藏层的输出会同时喂给下一层所有神经元。<\/p>\n<p><strong>实例<\/strong>：换一组输入 <span class=\"katex-inline\">x_1=0,\\ x_2=1<\/span>，同样用上面的参数。<\/p>\n<p><span class=\"katex-inline\">z_1=0+(-0.3)\\times 1+0.1=-0.2<\/span>，<span class=\"katex-inline\">h_1=\\sigma(-0.2)=0.450166<\/span>。 <span class=\"katex-inline\">z_2=0+0.8\\times 1-0.2=0.6<\/span>，<span class=\"katex-inline\">h_2=\\sigma(0.6)=0.645656<\/span>。 <span class=\"katex-inline\">z_o=0.6\\times 0.450166-0.4\\times 0.645656+0.2=0.270100-0.258262+0.2=0.211838<\/span>。 <span class=\"katex-inline\">\\hat{y}=\\sigma(0.211838)=0.552748<\/span>。<\/p>\n<p>同一个小网络，换个输入，输出从 0.581 变成 0.553。变化不大，因为权重还是随机的、没训练过的样子。训练就是要把这些权重调到&quot;该大就大、该小就小&quot;。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为隐藏层越多参数一定越多<\/strong>——参数由每层的宽度决定。一个很宽的单隐藏层可能比一个很窄的多层网络参数更多。深度和宽度是两条不同的路。<\/p>\n<p><strong>别以为隐藏层的每个神经元一定对应一个可解释的概念<\/strong>——有些网络确实能观察到&quot;边缘检测器&quot;&quot;眼睛检测器&quot;，但这是事后分析，不是保证。大多数隐藏单元是分布式表示，一个概念分散在多个神经元上，一个神经元也参与多个概念。<\/p>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n上面这个 2-2-1 网络一共有多少个可训练参数？\n<\/ol>\n<p><strong>答案<\/strong>：9 个。隐藏层 <span class=\"katex-inline\">2\\times 2=4<\/span> 个权重加 2 个偏置，输出层 2 个权重加 1 个偏置。<\/p>\n<p><strong>解析<\/strong>：参数 = 权重 + 偏置。输入和隐藏层之间的每条连线是一个权重，共 4 条；隐藏层到输出共 2 条；偏置每个神经元一个，共 3 个。<\/p>\n<ol><li>\n若把 <span class=\"katex-inline\">b_1<\/span> 从 0.1 改成 0.6，其他不变，<span class=\"katex-inline\">h_1<\/span> 变成多少？\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">z_1=0.5-0.15+0.6=0.95<\/span>，<span class=\"katex-inline\">h_1=\\sigma(0.95)=0.721115<\/span>。<\/p>\n<p><strong>解析<\/strong>：偏置只加在打分上。<span class=\"katex-inline\">e^{-0.95}=0.386741<\/span>，<span class=\"katex-inline\">1/(1+0.386741)=0.721115<\/span>。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n前向传播 = 逐层&quot;矩阵乘 + 偏置 + 激活&quot;。\n<\/li><li>\n2-2-1 网络 9 个参数，算完得到 <span class=\"katex-inline\">\\hat{y}=0.581007<\/span>。\n<\/li><li>\n隐藏层把输入换到一套新坐标，这套坐标是训练学出来的。\n<\/ul>", "ch09": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch08\">第 8 章：把神经元摞起来<\/a><\/span><\/div><h1>第 9 章：错得有多离谱<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：0.8 小时 | <strong>前置<\/strong>：第 8 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n算出单样本和一批样本的平方损失；\n<\/li><li>\n说出平方损失为什么用平方而不是绝对值；\n<\/li><li>\n区分损失和准确率。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>损失是一个数，它把&quot;预测错得多严重&quot;压缩成一个可以求导、可以比较大小的标量。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>为什么需要一个&quot;分数&quot;<\/h3>\n<p>第 8 章的网络输出 <span class=\"katex-inline\">\\hat{y}=0.581007<\/span>，真实标签 <span class=\"katex-inline\">y=1<\/span>。差了 0.419。<\/p>\n<p>差 0.419 算严重还是不严重？如果模型输出 0.9，差 0.1，我们觉得还行；输出 0.1，差 0.9，就很糟。需要一个函数，把差距变成一个有高低之分的数，而且这个数要能对参数求导——因为第 10 章要靠导数决定往哪调。<\/p>\n<p>这个函数叫<strong>损失函数<\/strong>，输出叫<strong>损失<\/strong>（loss）。<\/p>\n<h3>平方损失<\/h3>\n<p>最简单的选择：<\/p>\n<div class=\"katex-block\">L=(y-\\hat{y})^2<\/div>\n<p>预测和真实差多少，平方一下。<span class=\"katex-inline\">y=1<\/span>，<span class=\"katex-inline\">\\hat{y}=0.581007<\/span>：<\/p>\n<div class=\"katex-block\">L=(1-0.581007)^2=0.418993^2=0.175555<\/div>\n<p>多个样本时取平均：<\/p>\n<div class=\"katex-block\">L=\\frac{1}{n}\\sum_{i=1}^{n}(y_i-\\hat{y}_i)^2<\/div>\n<p><span class=\"katex-inline\">\\sum<\/span> 是求和符号，<span class=\"katex-inline\">\\sum_{i=1}^{n}<\/span> 表示&quot;把 <span class=\"katex-inline\">i<\/span> 从 1 到 <span class=\"katex-inline\">n<\/span> 的每一项都加起来&quot;。<span class=\"katex-inline\">\\frac{1}{n}<\/span> 是取平均，避免样本越多损失越大。<\/p>\n<p>这套叫<strong>均方误差<\/strong>（MSE，mean squared error）。<\/p>\n<h3>为什么用平方而不是绝对值<\/h3>\n<p>三个理由。<\/p>\n<p><strong>第一，正负不抵消。<\/strong> 如果用 <span class=\"katex-inline\">y-\\hat{y}<\/span> 直接相加，一个样本差 <span class=\"katex-inline\">+2<\/span>、另一个差 <span class=\"katex-inline\">-2<\/span>，加起来是 0，看起来完美，实际错了两处。平方之后两个都变成 <span class=\"katex-inline\">+4<\/span>，不会抵消。绝对值也能避免抵消，所以这不是平方独有的优点，但它是排除&quot;直接相减&quot;的理由。<\/p>\n<p><strong>第二，大错惩罚更重。<\/strong> 差 1 损失 1，差 2 损失 4，差 3 损失 9。平方让&quot;错得离谱&quot;的样本获得远大于线性的惩罚。多数时候我们希望模型优先修正那些错得最狠的样本。<\/p>\n<p><strong>第三，光滑可导。<\/strong> 绝对值 <span class=\"katex-inline\">|x|<\/span> 在 0 处有一个尖角，左右导数分别是 <span class=\"katex-inline\">-1<\/span> 和 <span class=\"katex-inline\">+1<\/span>，在 0 处不可导。平方函数处处可导，求梯度时不会卡在尖角上。这对梯度下降很重要。<\/p>\n<h3>曲线长什么样<\/h3>\n<p>单变量情况下，固定 <span class=\"katex-inline\">y=1<\/span>，把 <span class=\"katex-inline\">\\hat{y}<\/span> 看作变量，损失是：<\/p>\n<div class=\"katex-block\">L(\\hat{y})=(1-\\hat{y})^2<\/div>\n<p>这是一条开口向上的抛物线，最低点在 <span class=\"katex-inline\">\\hat{y}=1<\/span>，损失为 0。预测离 1 越远，损失越大，而且两边对称。<\/p>\n<div>\n<svg viewBox=\"0 0 460 260\" width=\"100%\" role=\"img\" aria-label=\"平方损失曲线\">\n<line x1=\"50\" y1=\"220\" x2=\"430\" y2=\"220\" stroke=\"#9ca3af\"/>\n<line x1=\"240\" y1=\"220\" x2=\"240\" y2=\"30\" stroke=\"#9ca3af\"/>\n<path d=\"M 80 50 Q 240 250 400 50\" fill=\"none\" stroke=\"#3b82f6\" stroke-width=\"2.5\"/>\n<circle cx=\"240\" cy=\"220\" r=\"5\" fill=\"#dc2626\"/>\n<text x=\"250\" y=\"240\" font-size=\"12\" fill=\"#dc2626\">ŷ = 1, L = 0<\/text>\n<text x=\"330\" y=\"70\" font-size=\"12\" fill=\"#6b7280\">错得越远，损失涨得越快<\/text>\n<text x=\"60\" y=\"240\" font-size=\"12\" fill=\"#9ca3af\">ŷ 偏小<\/text>\n<text x=\"380\" y=\"240\" font-size=\"12\" fill=\"#9ca3af\">ŷ 偏大<\/text>\n<\/svg>\n<\/div>\n<p>看图说明：横轴是预测值 <span class=\"katex-inline\">\\hat{y}<\/span>，纵轴是损失。最低点在预测完全正确的位置。抛物线两边上升，且越往外越陡——这就是&quot;平方放大错误&quot;的几何表现。<\/p>\n<h3>分类任务常用交叉熵<\/h3>\n<p>平方损失适合回归（预测一个连续数值）。分类任务更常用<strong>交叉熵<\/strong>：<\/p>\n<div class=\"katex-block\">L=-\\big[y\\log\\hat{y}+(1-y)\\log(1-\\hat{y})\\big]<\/div>\n<p>这里 <span class=\"katex-inline\">\\log<\/span> 是自然对数。不用记公式细节，只需要知道它的行为：<span class=\"katex-inline\">y=1<\/span> 时，若 <span class=\"katex-inline\">\\hat{y}<\/span> 接近 1，损失接近 0；若 <span class=\"katex-inline\">\\hat{y}<\/span> 接近 0，损失趋向无穷大。它对&quot;自信地答错&quot;惩罚极重。<\/p>\n<p>本教程继续用平方损失，因为它的导数简单，手推反向传播时每一步都能验算。换成交叉熵，反向传播的框架完全一样，只是输出层的导数形式变了。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：损失像考试扣分。错一道选择题扣 2 分，错一道大题扣 10 分。平方损失相当于&quot;错得越基础、扣得越狠&quot;，让复习时优先补最大的漏洞。<\/p>\n<p>类比失效的地方：考试扣分有上限，平方损失没有上限；扣分规则是人定的，损失函数要能对参数求导。<\/p>\n<p><strong>实例<\/strong>：三个样本，真实标签分别是 <span class=\"katex-inline\">1,0,1<\/span>，预测分别是 <span class=\"katex-inline\">0.9,0.2,0.6<\/span>。<\/p>\n<p>逐个算平方误差：<\/p>\n<div class=\"katex-block\">(1-0.9)^2=0.01,\\quad (0-0.2)^2=0.04,\\quad (1-0.6)^2=0.16<\/div>\n<p>平均：<\/p>\n<div class=\"katex-block\">L=\\frac{0.01+0.04+0.16}{3}=\\frac{0.21}{3}=0.07<\/div>\n<p>第三个样本贡献了 0.16，占总损失的绝大部分。模型会优先被它推动。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为损失就是准确率<\/strong>——准确率是&quot;猜对的比例&quot;，只看对错不看差距；损失看的是预测值和真实值的距离。一个模型可以准确率 90% 但损失很大（那 10% 错得极离谱），也可以准确率 80% 但损失较小（错得都不远）。训练时优化损失，评估时看准确率，两者不能互换。<\/p>\n<p><strong>别以为损失越小模型越好<\/strong>——在训练集上把损失压到接近 0，可能只是把训练样本背下来了，换一批数据就崩。第 12 章会讲这个问题。<\/p>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<span class=\"katex-inline\">y=0<\/span>，<span class=\"katex-inline\">\\hat{y}=0.3<\/span>，平方损失是多少？\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">(0-0.3)^2=0.09<\/span>。<\/p>\n<p><strong>解析<\/strong>：先算差，再平方。差是负数，平方后变正。<\/p>\n<ol><li>\n两个模型：A 的预测是 <span class=\"katex-inline\">0.9,0.9<\/span>（真实 <span class=\"katex-inline\">1,0<\/span>），B 的预测是 <span class=\"katex-inline\">0.6,0.4<\/span>（真实 <span class=\"katex-inline\">1,0<\/span>）。分别算平方损失，哪个更小？\n<\/ol>\n<p><strong>答案<\/strong>：A 的损失 <span class=\"katex-inline\">(0.1^2+0.9^2)/2=(0.01+0.81)/2=0.41<\/span>；B 的损失 <span class=\"katex-inline\">(0.4^2+0.4^2)/2=0.16<\/span>。B 更小。<\/p>\n<p><strong>解析<\/strong>：A 在第二个样本上&quot;自信地答错&quot;，被平方放大得很厉害。B 两个样本都不算准，但错得平均，总损失反而低。这说明损失关心的是整体差距，不只是对错个数。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n损失把&quot;错多少&quot;变成一个可求导的数。\n<\/li><li>\n平方损失 <span class=\"katex-inline\">L=(y-\\hat{y})^2<\/span>，多样本取平均。\n<\/li><li>\n用平方的三个理由：不抵消、放大错误、处处可导。\n<\/li><li>\n损失不等于准确率。\n<\/ul>", "ch10": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：变化率与导数<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch09\">第 9 章：错得有多离谱<\/a><\/span><\/div><h1>第 10 章：下山<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1 小时 | <strong>前置<\/strong>：第 3、9 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用 <span class=\"katex-inline\">w\\leftarrow w-\\eta\\frac{dL}{dw}<\/span> 手算几步梯度下降；\n<\/li><li>\n说明学习率过小和过大分别会发生什么；\n<\/li><li>\n解释&quot;梯度&quot;在多参数时是什么。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>梯度告诉你要往哪边调、调多少；梯度下降就是沿着反方向一小步一小步走。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>一个参数的例子<\/h3>\n<p>先只看一个参数 <span class=\"katex-inline\">w<\/span>。设损失是：<\/p>\n<div class=\"katex-block\">L(w)=(w-1)^2<\/div>\n<p>最低点在 <span class=\"katex-inline\">w=1<\/span>，损失为 0。现在从 <span class=\"katex-inline\">w=3<\/span> 出发，怎么走到 1？<\/p>\n<p>求导：<\/p>\n<div class=\"katex-block\">\\frac{dL}{dw}=2(w-1)<\/div>\n<p><span class=\"katex-inline\">w=3<\/span> 时导数是 <span class=\"katex-inline\">4<\/span>，正数，说明&quot;<span class=\"katex-inline\">w<\/span> 增大损失也增大&quot;，所以应该把 <span class=\"katex-inline\">w<\/span> 调小。调多少？按导数大小按比例调：<\/p>\n<div class=\"katex-block\">w_{\\text{new}}=w-\\eta\\frac{dL}{dw}<\/div>\n<p><span class=\"katex-inline\">\\eta<\/span>（读作 eta）叫<strong>学习率<\/strong>，控制每一步走多大。取 <span class=\"katex-inline\">\\eta=0.1<\/span>：<\/p>\n<div class=\"katex-block\">w_{\\text{new}}=3-0.1\\times 4=2.6<\/div>\n<p>再算一步：<span class=\"katex-inline\">w=2.6<\/span>，导数 <span class=\"katex-inline\">2(2.6-1)=3.2<\/span>，新值 <span class=\"katex-inline\">2.6-0.1\\times 3.2=2.28<\/span>。<\/p>\n<p>继续：<\/p>\n<table><thead><tr><th>步数<\/th><th><span class=\"katex-inline\">w<\/span><\/th><th>梯度 <span class=\"katex-inline\">2(w-1)<\/span><\/th><th>损失 <span class=\"katex-inline\">(w-1)^2<\/span><\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>3.000<\/td><td>4.000<\/td><td>4.000000<\/td><\/tr><tr><td>1<\/td><td>2.600<\/td><td>3.200<\/td><td>2.560000<\/td><\/tr><tr><td>2<\/td><td>2.280<\/td><td>2.560<\/td><td>1.638400<\/td><\/tr><tr><td>3<\/td><td>2.024<\/td><td>2.048<\/td><td>1.048576<\/td><\/tr><tr><td>4<\/td><td>1.819<\/td><td>1.638<\/td><td>0.671089<\/td><\/tr><tr><td>5<\/td><td>1.655<\/td><td>1.311<\/td><td>0.429497<\/td><\/tr><tr><td>6<\/td><td>1.524<\/td><td>1.048<\/td><td>0.274878<\/td><\/tr><\/tbody><\/table>\n<p><span class=\"katex-inline\">w<\/span> 越来越靠近 1，损失越来越小。每一步的步长也在变小，因为越靠近谷底，导数越小。<\/p>\n<h3>学习率的作用<\/h3>\n<p><span class=\"katex-inline\">\\eta<\/span> 是一个需要人来定的数，叫<strong>超参数<\/strong>——它不被训练过程更新，是人设定的。<\/p>\n<p><span class=\"katex-inline\">\\eta<\/span> 太小：每步挪一点点，要走很多步才到谷底，训练慢。<\/p>\n<p><span class=\"katex-inline\">\\eta<\/span> 太大：一步跨过谷底，甚至越走越远。<\/p>\n<p>拿同一个例子，<span class=\"katex-inline\">\\eta=1<\/span> 试试：<span class=\"katex-inline\">w=3<\/span>，梯度 4，新值 <span class=\"katex-inline\">3-1\\times 4=-1<\/span>。下一步梯度 <span class=\"katex-inline\">2(-1-1)=-4<\/span>，新值 <span class=\"katex-inline\">-1-1\\times(-4)=3<\/span>。又回到 3。再下一步又到 <span class=\"katex-inline\">-1<\/span>。<\/p>\n<p><span class=\"katex-inline\">w<\/span> 在 <span class=\"katex-inline\">3<\/span> 和 <span class=\"katex-inline\">-1<\/span> 之间来回跳，永远不收敛。损失一直是 4，一点没降。<\/p>\n<p>这个现象叫<strong>震荡<\/strong>。学习率再大一点，跳的幅度会越来越大，直接发散到无穷。<\/p>\n<p>实用做法：从一个小值开始试（比如 0.001、0.01），观察损失曲线。损失平稳下降就继续，上下乱跳就调小，下降太慢就调大。也可以让学习率随训练逐步衰减。<\/p>\n<h3>多个参数：梯度<\/h3>\n<p>真实网络有成千上万个参数。把每个参数看成一个方向，损失对所有参数分别求偏导，拼成一个向量：<\/p>\n<div class=\"katex-block\">\\nabla L=\\begin{bmatrix}\\dfrac{\\partial L}{\\partial w_1}\\\\[4pt]\\dfrac{\\partial L}{\\partial w_2}\\\\\\vdots\\\\[4pt]\\dfrac{\\partial L}{\\partial w_n}\\end{bmatrix}<\/div>\n<p>这个向量叫<strong>梯度<\/strong>。<span class=\"katex-inline\">\\nabla<\/span> 读作 nabla，是一个把&quot;对所有变量求偏导&quot;打包起来的记号。<span class=\"katex-inline\">\\partial<\/span> 读作&quot;偏导&quot;，意思是对某一个变量求导、其余变量当常数。<\/p>\n<p>梯度的每个分量告诉你&quot;这个参数单独动一下，损失会怎么变&quot;。更新规则对每个分量分别执行：<\/p>\n<div class=\"katex-block\">w_i\\leftarrow w_i-\\eta\\frac{\\partial L}{\\partial w_i}<\/div>\n<p>几何上，梯度指向损失上升最快的方向，取负号就是下降最快的方向。这就是&quot;梯度下降&quot;这个名字的来源。<\/p>\n<div>\n<svg viewBox=\"0 0 460 250\" width=\"100%\" role=\"img\" aria-label=\"沿抛物线下降\">\n<line x1=\"50\" y1=\"215\" x2=\"430\" y2=\"215\" stroke=\"#9ca3af\"/>\n<line x1=\"240\" y1=\"215\" x2=\"240\" y2=\"30\" stroke=\"#9ca3af\"/>\n<path d=\"M 70 60 Q 240 260 410 60\" fill=\"none\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n<circle cx=\"120\" cy=\"103\" r=\"5\" fill=\"#dc2626\"/>\n<circle cx=\"170\" cy=\"160\" r=\"5\" fill=\"#dc2626\"/>\n<circle cx=\"205\" cy=\"196\" r=\"5\" fill=\"#dc2626\"/>\n<circle cx=\"240\" cy=\"215\" r=\"5\" fill=\"#16a34a\"/>\n<text x=\"80\" y=\"92\" font-size=\"12\" fill=\"#6b7280\">w=3<\/text>\n<text x=\"150\" y=\"180\" font-size=\"12\" fill=\"#6b7280\">w=2.28<\/text>\n<text x=\"250\" y=\"232\" font-size=\"12\" fill=\"#16a34a\">w=1，谷底<\/text>\n<\/svg>\n<\/div>\n<p>看图说明：红点是迭代过程中 <span class=\"katex-inline\">w<\/span> 的位置，越靠近谷底步子越小。绿点是目标。曲线是损失随 <span class=\"katex-inline\">w<\/span> 变化的形状。<\/p>\n<h3>梯度下降不保证找到全局最优<\/h3>\n<p>上面那条抛物线只有一个谷底，怎么走都能到。真实的损失函数不是这样，它可能有多个局部低点、平坦区域、鞍点。<\/p>\n<p>梯度下降只保证&quot;每一步让损失变小一点&quot;（在学习率合适的前提下），不保证走到全局最低点。它停在某个低点，可能只是局部最优。<\/p>\n<p>实践中的应对：多组随机初始化、调整学习率、用带动量的优化器（Momentum、Adam）。这些方法改变的是&quot;怎么走&quot;，不改&quot;只看脚下&quot;的本质。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：蒙着眼睛下山。你感觉脚下的坡度，往最陡的下坡方向迈一步，再感觉一次，再迈一步。你看不到整座山，只能看到脚边。<\/p>\n<p>类比失效的地方：下山的人有重力帮忙，梯度下降完全靠计算；山是三维的，损失函数可能在几百万维空间里，&quot;方向&quot;没法直观想象。<\/p>\n<p><strong>实例<\/strong>：<span class=\"katex-inline\">L(w)=(w-1)^2<\/span>，<span class=\"katex-inline\">\\eta=0.01<\/span>，从 <span class=\"katex-inline\">w=0<\/span> 出发。<\/p>\n<p><span class=\"katex-inline\">w=0<\/span>：梯度 <span class=\"katex-inline\">2(0-1)=-2<\/span>，新值 <span class=\"katex-inline\">0-0.01\\times(-2)=0.02<\/span>。 <span class=\"katex-inline\">w=0.02<\/span>：梯度 <span class=\"katex-inline\">2(0.02-1)=-1.96<\/span>，新值 <span class=\"katex-inline\">0.02-0.01\\times(-1.96)=0.0396<\/span>。<\/p>\n<p>学习率小，每次只挪 0.02 左右。要走大约 100 步才能接近 1。这就是&quot;太小则慢&quot;的具体表现。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为梯度下降一定找到最优解<\/strong>——它只沿当前点的坡度走，遇到局部低点就停。非凸损失函数上，&quot;找到的这个低点&quot;不保证是全局最低。<\/p>\n<p><strong>别以为学习率是训练出来的<\/strong>——学习率是人设定的超参数，不会通过梯度更新。有些调度策略会让它随训练轮次变化，但那是人事先写好的规则，不是模型学出来的。<\/p>\n<p><strong>别以为梯度为 0 就是最优<\/strong>——梯度为 0 可能是谷底，也可能是山顶或鞍点。二阶信息才能区分，梯度下降本身分不出来。<\/p>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<span class=\"katex-inline\">L(w)=(w-2)^2<\/span>，从 <span class=\"katex-inline\">w=5<\/span> 出发，<span class=\"katex-inline\">\\eta=0.1<\/span>，走一步后 <span class=\"katex-inline\">w<\/span> 是多少？\n<\/ol>\n<p><strong>答案<\/strong>：梯度 <span class=\"katex-inline\">2(5-2)=6<\/span>，<span class=\"katex-inline\">w=5-0.1\\times 6=4.4<\/span>。<\/p>\n<p><strong>解析<\/strong>：先求导再更新。<span class=\"katex-inline\">w<\/span> 从 5 往 2 的方向挪了 0.6。<\/p>\n<ol><li>\n学习率设成 2，在 <span class=\"katex-inline\">L(w)=(w-1)^2<\/span> 上从 <span class=\"katex-inline\">w=3<\/span> 出发，会怎样？\n<\/ol>\n<p><strong>答案<\/strong>：梯度为 4，新值 <span class=\"katex-inline\">3-2\\times 4=-5<\/span>；下一步梯度 <span class=\"katex-inline\">2(-5-1)=-12<\/span>，新值 <span class=\"katex-inline\">-5-2\\times(-12)=19<\/span>。数值越跳越大，发散。<\/p>\n<p><strong>解析<\/strong>：学习率乘以梯度后超过了&quot;跨过谷底并对称跳过去&quot;的临界值，每步幅度翻倍增长。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n更新公式：<span class=\"katex-inline\">w\\leftarrow w-\\eta\\frac{dL}{dw}<\/span>，减号表示往导数反方向走。\n<\/li><li>\n学习率太大震荡或发散，太小则慢。\n<\/li><li>\n多参数时梯度是一个向量，每个分量是一个偏导。\n<\/li><li>\n梯度下降只保证局部下降，不保证全局最优。\n<\/ul>", "ch11": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：套娃函数怎么求导<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch07\">第 7 章：为什么必须拐弯<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch09\">第 9 章：错得有多离谱<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch10\">第 10 章：下山<\/a><\/span><\/div><h1>第 11 章：误差怎么传回去<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 4、7、8、9、10 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清反向传播要解决什么问题，以及为什么不能逐个参数试；\n<\/li><li>\n用链式法则推出输出层和隐藏层的误差项 <span class=\"katex-inline\">\\delta<\/span>；\n<\/li><li>\n手算 2-2-1 网络一次完整的反向传播，得到全部 9 个梯度。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>反向传播就是链式法则在网络上跑一遍，从损失出发，把误差一层层往回乘。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>问题：9 个参数，怎么求 9 个导数<\/h3>\n<p>第 8 章的网络有 9 个参数。要训练它，需要知道损失对每个参数的偏导。<\/p>\n<p>最笨的办法：把 <span class=\"katex-inline\">w_{11}<\/span> 改一点点，重新算一遍损失，看变化多少；再改 <span class=\"katex-inline\">w_{12}<\/span>，再算一遍……9 个参数要算 9 次前向。真实网络有几百万个参数，这个办法要算几百万次前向，完全不可行。<\/p>\n<p>反向传播的做法：<strong>一次前向算出损失，再一次反向算出全部 9 个梯度。<\/strong><\/p>\n<h3>先看计算图<\/h3>\n<p>把前向传播拆成一个个小步骤，每一步只做一件事：<\/p>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    x[&quot;x1, x2&quot;] --&gt; z1[&quot;z1 = w11x1 + w12x2 + b1&quot;]\n    z1 --&gt; h1[&quot;h1 = σ(z1)&quot;]\n    h1 --&gt; zo[&quot;zo = v1h1 + v2h2 + bo&quot;]\n    x --&gt; z2[&quot;z2 = w21x1 + w22x2 + b2&quot;]\n    z2 --&gt; h2[&quot;h2 = σ(z2)&quot;]\n    h2 --&gt; zo\n    zo --&gt; y[&quot;ŷ = σ(zo)&quot;]\n    y --&gt; L[&quot;L = (ŷ - y)²&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：数据从左往右流，每一步的输出是下一步的输入。反向传播时，从最右边的 <span class=\"katex-inline\">L<\/span> 出发，沿着箭头反方向走，每遇到一个节点就用链式法则乘上这个节点自己的导数。<\/p>\n<h3>定义误差项 δ<\/h3>\n<p>记 <span class=\"katex-inline\">\\delta_j=\\dfrac{\\partial L}{\\partial z_j}<\/span>，意思是&quot;第 <span class=\"katex-inline\">j<\/span> 个神经元在激活之前的打分 <span class=\"katex-inline\">z_j<\/span> 变化一点点，损失跟着变多少&quot;。<\/p>\n<p>为什么盯住 <span class=\"katex-inline\">z<\/span> 而不是盯住输出 <span class=\"katex-inline\">h<\/span>？因为每个参数的梯度都能写成&quot;<span class=\"katex-inline\">\\delta<\/span> 乘以这个参数的输入&quot;。盯住 <span class=\"katex-inline\">z<\/span>，参数的梯度就只差一个乘数。<\/p>\n<h3>输出层：先算 δ_o<\/h3>\n<p>输出层的计算链是：<\/p>\n<div class=\"katex-block\">z_o \\xrightarrow{\\sigma} \\hat{y}\\xrightarrow{\\text{平方误差}} L<\/div>\n<p>按链式法则：<\/p>\n<div class=\"katex-block\">\\delta_o=\\frac{\\partial L}{\\partial z_o}\\\\=\\frac{\\partial L}{\\partial \\hat{y}}\\cdot\\frac{\\partial \\hat{y}}{\\partial z_o}<\/div>\n<p>第一项，<span class=\"katex-inline\">L=(\\hat{y}-y)^2<\/span> 对 <span class=\"katex-inline\">\\hat{y}<\/span> 求导：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial \\hat{y}}=2(\\hat{y}-y)<\/div>\n<p>第二项，<span class=\"katex-inline\">\\hat{y}=\\sigma(z_o)<\/span> 对 <span class=\"katex-inline\">z_o<\/span> 求导，就是第 7 章推过的 <span class=\"katex-inline\">\\sigma(1-\\sigma)<\/span>：<\/p>\n<div class=\"katex-block\">\\frac{\\partial \\hat{y}}{\\partial z_o}=\\hat{y}(1-\\hat{y})<\/div>\n<p>代进去：<\/p>\n<div class=\"katex-block\">\\delta_o=2(\\hat{y}-y)\\cdot\\hat{y}(1-\\hat{y})<\/div>\n<p>代入数值：<span class=\"katex-inline\">\\hat{y}=0.581007<\/span>，<span class=\"katex-inline\">y=1<\/span>。<\/p>\n<div class=\"katex-block\">2(0.581007-1)=2\\times(-0.418993)=-0.837986<\/div>\n<div class=\"katex-block\">\\hat{y}(1-\\hat{y})=0.581007\\times 0.418993=0.243438<\/div>\n<div class=\"katex-block\">\\delta_o=-0.837986\\times 0.243438=-0.203998<\/div>\n<h3>输出层参数的梯度<\/h3>\n<p><span class=\"katex-inline\">z_o=v_1h_1+v_2h_2+b_o<\/span>。对 <span class=\"katex-inline\">v_1<\/span> 求偏导，<span class=\"katex-inline\">v_1<\/span> 只出现在 <span class=\"katex-inline\">v_1h_1<\/span> 这一项，导数是 <span class=\"katex-inline\">h_1<\/span>：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial v_1}=\\frac{\\partial L}{\\partial z_o}\\cdot\\frac{\\partial z_o}{\\partial v_1}=\\delta_o\\cdot h_1<\/div>\n<div class=\"katex-block\">\\delta_o h_1=-0.203998\\times 0.610639=-0.124569<\/div>\n<p>同理：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial v_2}=\\delta_o h_2=-0.203998\\times 0.598688=-0.122131<\/div>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial b_o}=\\delta_o\\cdot 1=-0.203998<\/div>\n<h3>隐藏层：误差往回传<\/h3>\n<p>隐藏层的 <span class=\"katex-inline\">h_1<\/span> 同时影响 <span class=\"katex-inline\">z_o<\/span>，进而影响 <span class=\"katex-inline\">L<\/span>。还是链式：<\/p>\n<div class=\"katex-block\">\\delta_1=\\frac{\\partial L}{\\partial z_1}\\\\=\\frac{\\partial L}{\\partial h_1}\\cdot\\frac{\\partial h_1}{\\partial z_1}<\/div>\n<p>先算第一项。<span class=\"katex-inline\">z_o=v_1h_1+v_2h_2+b_o<\/span>，<span class=\"katex-inline\">h_1<\/span> 的系数是 <span class=\"katex-inline\">v_1<\/span>，所以：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial h_1}=\\delta_o\\cdot v_1<\/div>\n<p>第二项是 sigmoid 的导数：<\/p>\n<div class=\"katex-block\">\\frac{\\partial h_1}{\\partial z_1}=h_1(1-h_1)<\/div>\n<p>合起来：<\/p>\n<div class=\"katex-block\">\\delta_1=\\delta_o\\cdot v_1\\cdot h_1(1-h_1)<\/div>\n<p>代入：<\/p>\n<div class=\"katex-block\">\\delta_1=-0.203998\\times 0.6\\times 0.610639\\times 0.389361<\/div>\n<div class=\"katex-block\">0.610639\\times 0.389361=0.237759<\/div>\n<div class=\"katex-block\">\\delta_1=-0.203998\\times 0.6\\times 0.237759=-0.029101<\/div>\n<p>同理第二个隐藏神经元：<\/p>\n<div class=\"katex-block\">\\delta_2=\\delta_o\\cdot v_2\\cdot h_2(1-h_2)<\/div>\n<div class=\"katex-block\">\\delta_2=-0.203998\\times(-0.4)\\times 0.598688\\times 0.401312<\/div>\n<div class=\"katex-block\">0.598688\\times 0.401312=0.240261<\/div>\n<div class=\"katex-block\">\\delta_2=0.081599\\times 0.240261=0.019605<\/div>\n<p>注意 <span class=\"katex-inline\">v_2=-0.4<\/span> 带负号，两个负数相乘得正，所以 <span class=\"katex-inline\">\\delta_2<\/span> 是正的。符号不能丢。<\/p>\n<h3>隐藏层参数的梯度<\/h3>\n<p><span class=\"katex-inline\">z_1=w_{11}x_1+w_{12}x_2+b_1<\/span>。对 <span class=\"katex-inline\">w_{11}<\/span> 求偏导得 <span class=\"katex-inline\">x_1<\/span>：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w_{11}}=\\delta_1 x_1=-0.029101\\times 1.0=-0.029101<\/div>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w_{12}}=\\delta_1 x_2=-0.029101\\times 0.5=-0.014551<\/div>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial b_1}=\\delta_1=-0.029101<\/div>\n<p>同样：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w_{21}}=\\delta_2 x_1=0.019605\\times 1.0=0.019605<\/div>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial w_{22}}=\\delta_2 x_2=0.019605\\times 0.5=0.009803<\/div>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial b_2}=\\delta_2=0.019605<\/div>\n<h3>九个梯度汇总<\/h3>\n<table><thead><tr><th>参数<\/th><th>梯度<\/th><th>参数<\/th><th>梯度<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">v_1<\/span><\/td><td><span class=\"katex-inline\">-0.124569<\/span><\/td><td><span class=\"katex-inline\">w_{11}<\/span><\/td><td><span class=\"katex-inline\">-0.029101<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">v_2<\/span><\/td><td><span class=\"katex-inline\">-0.122131<\/span><\/td><td><span class=\"katex-inline\">w_{12}<\/span><\/td><td><span class=\"katex-inline\">-0.014551<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">b_o<\/span><\/td><td><span class=\"katex-inline\">-0.203998<\/span><\/td><td><span class=\"katex-inline\">b_1<\/span><\/td><td><span class=\"katex-inline\">-0.029101<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">w_{21}<\/span><\/td><td><span class=\"katex-inline\">0.019605<\/span><\/td><td><span class=\"katex-inline\">w_{22}<\/span><\/td><td><span class=\"katex-inline\">0.009803<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">b_2<\/span><\/td><td><span class=\"katex-inline\">0.019605<\/span><\/td><td><\/td><td><\/td><\/tr><\/tbody><\/table>\n<p>一次前向、一次反向，全部拿到。<\/p>\n<h3>更新参数<\/h3>\n<p>用第 10 章的规则，学习率 <span class=\"katex-inline\">\\eta=0.5<\/span>：<\/p>\n<div class=\"katex-block\">\\theta_{\\text{new}}=\\theta_{\\text{old}}-\\eta\\frac{\\partial L}{\\partial \\theta}<\/div>\n<table><thead><tr><th>参数<\/th><th>旧值<\/th><th>梯度<\/th><th>新值<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">v_1<\/span><\/td><td>0.600<\/td><td><span class=\"katex-inline\">-0.124569<\/span><\/td><td>0.662284<\/td><\/tr><tr><td><span class=\"katex-inline\">v_2<\/span><\/td><td><span class=\"katex-inline\">-0.400<\/span><\/td><td><span class=\"katex-inline\">-0.122131<\/span><\/td><td><span class=\"katex-inline\">-0.338935<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">b_o<\/span><\/td><td>0.200<\/td><td><span class=\"katex-inline\">-0.203998<\/span><\/td><td>0.301999<\/td><\/tr><tr><td><span class=\"katex-inline\">w_{11}<\/span><\/td><td>0.500<\/td><td><span class=\"katex-inline\">-0.029101<\/span><\/td><td>0.514551<\/td><\/tr><tr><td><span class=\"katex-inline\">w_{12}<\/span><\/td><td><span class=\"katex-inline\">-0.300<\/span><\/td><td><span class=\"katex-inline\">-0.014551<\/span><\/td><td><span class=\"katex-inline\">-0.292725<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">b_1<\/span><\/td><td>0.100<\/td><td><span class=\"katex-inline\">-0.029101<\/span><\/td><td>0.114551<\/td><\/tr><tr><td><span class=\"katex-inline\">w_{21}<\/span><\/td><td>0.200<\/td><td><span class=\"katex-inline\">0.019605<\/span><\/td><td>0.190197<\/td><\/tr><tr><td><span class=\"katex-inline\">w_{22}<\/span><\/td><td>0.800<\/td><td><span class=\"katex-inline\">0.009803<\/span><\/td><td>0.795099<\/td><\/tr><tr><td><span class=\"katex-inline\">b_2<\/span><\/td><td><span class=\"katex-inline\">-0.200<\/span><\/td><td><span class=\"katex-inline\">0.019605<\/span><\/td><td><span class=\"katex-inline\">-0.209803<\/span><\/td><\/tr><\/tbody><\/table>\n<p>注意更新方向：梯度为负的参数，新值比旧值<strong>大<\/strong>（减负数等于加）；梯度为正的参数，新值比旧值<strong>小<\/strong>。<\/p>\n<h3>验证：损失真的降了吗<\/h3>\n<p>用新参数重新前向一次：<\/p>\n<div class=\"katex-block\">z_1=0.514551\\times 1.0+(-0.292725)\\times 0.5+0.114551=0.514551-0.146363+0.114551=0.482739<\/div>\n<div class=\"katex-block\">h_1=\\sigma(0.482739)=0.618394<\/div>\n<div class=\"katex-block\">z_2=0.190197\\times 1.0+0.795099\\times 0.5-0.209803=0.190197+0.397550-0.209803=0.377944<\/div>\n<div class=\"katex-block\">h_2=\\sigma(0.377944)=0.593377<\/div>\n<div class=\"katex-block\">z_o=0.662284\\times 0.618394+(-0.338935)\\times 0.593377+0.301999<\/div>\n<div class=\"katex-block\">z_o=0.409560-0.201137+0.301999=0.510422<\/div>\n<div class=\"katex-block\">\\hat{y}=\\sigma(0.510422)=0.624909<\/div>\n<div class=\"katex-block\">L=(1-0.624909)^2=0.375091^2=0.140693<\/div>\n<p>从 <span class=\"katex-inline\">0.175555<\/span> 降到 <span class=\"katex-inline\">0.140693<\/span>。一次更新，损失降了约 20%。方向和步长都对了。<\/p>\n<p>这就是训练的全部循环：前向算损失，反向算梯度，更新参数，重复。<\/p>\n<div>\n<svg viewBox=\"0 0 460 200\" width=\"100%\" role=\"img\" aria-label=\"前向与反向两条路径\">\n<rect x=\"20\" y=\"70\" width=\"70\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n<text x=\"40\" y=\"100\" font-size=\"13\" fill=\"#16a34a\">输入<\/text>\n<rect x=\"130\" y=\"70\" width=\"70\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n<text x=\"146\" y=\"100\" font-size=\"13\" fill=\"#3b82f6\">隐藏<\/text>\n<rect x=\"240\" y=\"70\" width=\"70\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n<text x=\"256\" y=\"100\" font-size=\"13\" fill=\"#3b82f6\">输出<\/text>\n<rect x=\"350\" y=\"70\" width=\"80\" height=\"50\" rx=\"6\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\"/>\n<text x=\"368\" y=\"100\" font-size=\"13\" fill=\"#dc2626\">损失<\/text>\n<line x1=\"90\" y1=\"85\" x2=\"125\" y2=\"85\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n<line x1=\"200\" y1=\"85\" x2=\"235\" y2=\"85\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n<line x1=\"310\" y1=\"85\" x2=\"345\" y2=\"85\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n<text x=\"100\" y=\"60\" font-size=\"11\" fill=\"#16a34a\">前向<\/text>\n<line x1=\"350\" y1=\"112\" x2=\"315\" y2=\"112\" stroke=\"#dc2626\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/>\n<line x1=\"240\" y1=\"112\" x2=\"205\" y2=\"112\" stroke=\"#dc2626\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/>\n<line x1=\"130\" y1=\"112\" x2=\"95\" y2=\"112\" stroke=\"#dc2626\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/>\n<text x=\"210\" y=\"140\" font-size=\"11\" fill=\"#dc2626\">反向（传梯度）<\/text>\n<\/svg>\n<\/div>\n<p>看图说明：实线是从左到右的前向，虚线是从右到左的反向。反向不重新算前向的量，而是复用已经存下来的 <span class=\"katex-inline\">h<\/span>、<span class=\"katex-inline\">\\hat{y}<\/span>、<span class=\"katex-inline\">z<\/span>，只做乘法和加法。<\/p>\n<h3>它为什么快<\/h3>\n<p>前向一次计算，把每个中间值存下来。反向时每个 <span class=\"katex-inline\">\\delta<\/span> 只需要几个乘法：<span class=\"katex-inline\">\\delta_o<\/span> 用了 <span class=\"katex-inline\">\\hat{y}<\/span>，<span class=\"katex-inline\">\\delta_1<\/span> 用了 <span class=\"katex-inline\">\\delta_o<\/span>、<span class=\"katex-inline\">v_1<\/span>、<span class=\"katex-inline\">h_1<\/span>。整条链上没有任何一步需要重新跑前向。<\/p>\n<p>计算量大约是一次前向的两倍，和&quot;每个参数试一次&quot;的几百万次前向相比，差距是数量级的。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：工厂追责。成品出问题，先查最后一道工序（输出层）责任多大，再把责任按&quot;这道工序受前一道影响多少&quot;分摊回上一道工序，一路分摊到原料。每道工序只需要知道&quot;我下游那道占我多少&quot;和&quot;我自己的敏感度&quot;。<\/p>\n<p>类比失效的地方：追责是人为判定，反向传播是精确的数学求导；分摊比例在这里就是权重和激活函数的导数，不是估算。<\/p>\n<p><strong>实例<\/strong>：单独验证 <span class=\"katex-inline\">w_{12}<\/span> 的梯度。<span class=\"katex-inline\">w_{12}<\/span> 只通过 <span class=\"katex-inline\">z_1\\to h_1\\to z_o\\to \\hat{y}\\to L<\/span> 影响损失。把它增加 <span class=\"katex-inline\">0.001<\/span>，<span class=\"katex-inline\">z_1<\/span> 增加 <span class=\"katex-inline\">0.0005<\/span>，<span class=\"katex-inline\">h_1<\/span> 增加约 <span class=\"katex-inline\">0.0005\\times 0.237759=0.0001189<\/span>，<span class=\"katex-inline\">z_o<\/span> 增加 <span class=\"katex-inline\">0.6\\times 0.0001189=0.0000713<\/span>，<span class=\"katex-inline\">\\hat{y}<\/span> 增加约 <span class=\"katex-inline\">0.0000713\\times 0.243438=0.00001736<\/span>，<span class=\"katex-inline\">L<\/span> 变化约 <span class=\"katex-inline\">2(0.581007-1)\\times 0.00001736=-0.00001455<\/span>。除以 <span class=\"katex-inline\">0.001<\/span> 得 <span class=\"katex-inline\">-0.01455<\/span>，与解析梯度 <span class=\"katex-inline\">-0.014551<\/span> 一致。数值验证通过。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为反向传播是一个新的学习算法<\/strong>——它是求梯度的算法，本身不更新参数。真正更新参数的是梯度下降（或 Adam 等优化器）。反向传播负责&quot;算出往哪调&quot;，优化器负责&quot;调多少&quot;。<\/p>\n<p><strong>别以为反向传播需要把前向重算一遍<\/strong>——它复用前向存下的中间值。这也是为什么训练比推理更吃显存：训练要保存每一层的中间结果用于反向，推理只要保存当前层的输入输出。<\/p>\n<p><strong>别以为梯度可以随便约等于<\/strong>——链式法则的每一步都是精确的偏导，不是近似。数值验证只是检查有没有算错，不是反向传播本身用了近似。<\/p>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n若 <span class=\"katex-inline\">\\hat{y}=0.8<\/span>，<span class=\"katex-inline\">y=0<\/span>，用平方损失，输出层激活是 sigmoid，<span class=\"katex-inline\">\\delta_o<\/span> 是多少？\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">2(0.8-0)\\times 0.8(1-0.8)=1.6\\times 0.16=0.256<\/span>。<\/p>\n<p><strong>解析<\/strong>：先算损失对输出的导数，再乘 sigmoid 导数。<\/p>\n<ol><li>\n隐藏层 <span class=\"katex-inline\">\\delta_1<\/span> 的公式里为什么要乘 <span class=\"katex-inline\">v_1<\/span>？\n<\/ol>\n<p><strong>答案<\/strong>：因为 <span class=\"katex-inline\">h_1<\/span> 通过 <span class=\"katex-inline\">z_o=v_1h_1+v_2h_2+b_o<\/span> 影响输出，<span class=\"katex-inline\">h_1<\/span> 变一点，<span class=\"katex-inline\">z_o<\/span> 变 <span class=\"katex-inline\">v_1<\/span> 倍。链式法则要把这个倍数乘进去。<\/p>\n<p><strong>解析<\/strong>：<span class=\"katex-inline\">\\delta_1=\\frac{\\partial L}{\\partial h_1}\\cdot\\frac{\\partial h_1}{\\partial z_1}<\/span>，而 <span class=\"katex-inline\">\\frac{\\partial L}{\\partial h_1}=\\delta_o v_1<\/span>。<\/p>\n<ol><li>\n参数梯度为正，更新时应该把参数调大还是调小？\n<\/ol>\n<p><strong>答案<\/strong>：调小。<span class=\"katex-inline\">w\\leftarrow w-\\eta\\cdot(\\text{正数})<\/span>，新值比旧值小。<\/p>\n<p><strong>解析<\/strong>：梯度为正表示&quot;增大 <span class=\"katex-inline\">w<\/span> 会让损失增大&quot;，所以要减小 <span class=\"katex-inline\">w<\/span>。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n反向传播 = 链式法则 + 复用前向中间值，一次得到全部梯度。\n<\/li><li>\n<span class=\"katex-inline\">\\delta_o=2(\\hat{y}-y)\\cdot\\hat{y}(1-\\hat{y})<\/span>；<span class=\"katex-inline\">\\delta_1=\\delta_o v_1 h_1(1-h_1)<\/span>。\n<\/li><li>\n参数梯度 = 该层 <span class=\"katex-inline\">\\delta<\/span> × 该参数的输入。\n<\/li><li>\n一次更新后损失从 0.175555 降到 0.140693。\n<\/ul>", "ch12": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-soft\"><span class=\"prereq-tag\">荐<\/span> <a href=\"#/chapter/ch11\">第 11 章：误差怎么传回去<\/a><\/span> · <span class=\"prereq-soft\"><span class=\"prereq-tag\">荐<\/span> <a href=\"#/chapter/ch09\">第 9 章：错得有多离谱<\/a><\/span><\/div><h1>第 12 章：训练完之后<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：0.8 小时 | <strong>前置<\/strong>：第 9、10、11 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清 epoch、batch、学习率各自控制什么；\n<\/li><li>\n判断一条训练曲线是不是过拟合；\n<\/li><li>\n说出 CNN、RNN、Transformer 各自解决什么问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>训练是把训练集上的损失压下去，泛化是让没见过的数据也表现好，这两件事不是一回事。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>训练的循环<\/h3>\n<p>第 11 章走了一遍&quot;前向—反向—更新&quot;。真实训练要把这个循环跑很多次。<\/p>\n<p><strong>epoch<\/strong>：把整个训练集完整看一遍叫一个 epoch。10 个 epoch 就是把所有样本过了 10 遍。<\/p>\n<p><strong>batch<\/strong>：一次更新用多少样本。取 1 个样本更新一次叫随机梯度下降（SGD）；取全部样本算完再更新叫批量梯度下降；取一小批（比如 32、64）叫 mini-batch，最常用。<\/p>\n<p><strong>学习率<\/strong>：每步走多大，第 10 章讲过。<\/p>\n<p>为什么不用全部样本算梯度？因为全部算一遍太慢，而且全量梯度容易停在比较&quot;平&quot;的方向。小批量既有噪声带来的随机性，又能利用显卡并行，速度和质量折中得比较好。<\/p>\n<h3>过拟合：背答案<\/h3>\n<p>训练集损失一路下降，验证集损失先降后升，这是过拟合的典型形状。<\/p>\n<p>模型在训练集上把细节甚至噪声都记住了，换一批数据就不行。就像学生把练习册答案背下来，考试换个数字就懵。<\/p>\n<p>判断方法：切一份验证集（不参与训练），每个 epoch 结束后在验证集上算损失。如果训练损失还在降、验证损失开始升，就是过拟合开始了。<\/p>\n<div>\n<svg viewBox=\"0 0 460 250\" width=\"100%\" role=\"img\" aria-label=\"训练损失与验证损失的分离\">\n<line x1=\"50\" y1=\"210\" x2=\"430\" y2=\"210\" stroke=\"#9ca3af\"/>\n<line x1=\"50\" y1=\"210\" x2=\"50\" y2=\"30\" stroke=\"#9ca3af\"/>\n<path d=\"M 60 60 C 160 150, 300 185, 420 190\" fill=\"none\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n<path d=\"M 60 60 C 140 140, 200 175, 250 150 C 300 125, 350 105, 420 85\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/>\n<text x=\"300\" y=\"200\" font-size=\"12\" fill=\"#3b82f6\">训练损失<\/text>\n<text x=\"340\" y=\"80\" font-size=\"12\" fill=\"#dc2626\">验证损失<\/text>\n<text x=\"200\" y=\"235\" font-size=\"12\" fill=\"#6b7280\">训练轮次 →<\/text>\n<\/svg>\n<\/div>\n<p>看图说明：蓝线持续下降，红线先降后升。两条线分开的位置就是过拟合开始的位置。实际训练会在红线最低点附近停下来，或者用正则化压住它继续上升的趋势。<\/p>\n<h3>常见的对抗手段<\/h3>\n<p><strong>正则化<\/strong>：在损失里加一项惩罚大权重的项，比如 <span class=\"katex-inline\">\\lambda\\sum w_i^2<\/span>。权重被压小，模型输出对输入的细微变化不那么敏感。<\/p>\n<p><strong>Dropout<\/strong>：训练时随机把一部分神经元的输出置 0，逼网络不要依赖某几个特定神经元。推理时全部打开，按比例缩放。<\/p>\n<p><strong>早停<\/strong>：验证损失开始上升就停止训练，取验证损失最低的那个 checkpoint。<\/p>\n<p><strong>数据增强<\/strong>：图片翻转、裁剪、加噪声，让模型见不到&quot;完全一样&quot;的样本，逼它学更稳的特征。<\/p>\n<p>这些手段都在做同一件事：限制模型&quot;死记硬背&quot;的能力，让它偏向更平滑、更通用的解。<\/p>\n<h3>网络家族地图<\/h3>\n<p>第 6 到 11 章讲的是<strong>全连接网络<\/strong>（也叫多层感知机 MLP）：每个神经元和上一层所有神经元相连。<\/p>\n<p>它的问题：图片有 784 个像素，如果第一层 100 个神经元，就是 78400 个权重。参数多，而且丢掉了像素之间的空间关系。<\/p>\n<p><strong>CNN（卷积神经网络）<\/strong>：用卷积核在图上滑动，同一组权重扫过所有位置。参数共享大幅减少参数量，还保留了&quot;邻近像素相关&quot;的结构。适合图像。<\/p>\n<p><strong>RNN（循环神经网络）<\/strong>：按时间步处理序列，把上一步的隐藏状态传给下一步。适合文本、语音这类有顺序的数据。它的长距离依赖问题后来被 LSTM、GRU 缓解。<\/p>\n<p><strong>Transformer<\/strong>：用注意力机制让每个位置直接看到所有其他位置，不靠一步步传递。并行性好，长距离依赖强。现在的大语言模型基本都是这个结构。<\/p>\n<p>它们的内核仍然是&quot;线性变换 + 非线性激活 + 损失 + 反向传播&quot;。变的只是&quot;怎么组织连接&quot;和&quot;怎么算得更省&quot;。<\/p>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    MLP[&quot;全连接网络 MLP&quot;] --&gt; CNN[&quot;CNN 卷积网络&quot;]\n    MLP --&gt; RNN[&quot;RNN 循环网络&quot;]\n    RNN --&gt; LSTM[&quot;LSTM / GRU&quot;]\n    MLP --&gt; TF[&quot;Transformer&quot;]\n    TF --&gt; LLM[&quot;大语言模型&quot;]\n    CNN --&gt; CV[&quot;图像识别 / 检测&quot;]\n    LSTM --&gt; SEQ[&quot;语音 / 时序&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：所有分支都从 MLP 出发。CNN 改的是连接方式和参数共享，RNN 改的是时间维度的连接，Transformer 改的是信息交互方式。底层训练机制（损失、梯度、反向传播）没有变。<\/
