<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 7、8、11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>激活函数是加在加权求和之后的非线性函数，把线性结果掰弯。<\/p>\n<h2>为什么重要<\/h2>\n<p>没有它，多层网络会塌缩成一层线性变换，深度毫无意义。它是&quot;深度&quot;能成立的前提。<\/p>\n<h2>详解<\/h2>\n<p>常见两种：<\/p>\n<p><strong>sigmoid<\/strong>：<\/p>\n<div class=\"katex-block\">\\sigma(z)=\\frac{1}{1+e^{-z}}<\/div>\n<p>值域 <span class=\"katex-inline\">(0,1)<\/span>，<span class=\"katex-inline\">z=0<\/span> 时输出 0.5。导数：<\/p>\n<div class=\"katex-block\">\\sigma'(z)=\\sigma(z)(1-\\sigma(z))<\/div>\n<p>最大值 0.25，两端趋近 0，深层连乘会导致梯度消失。<\/p>\n<p><strong>ReLU<\/strong>：<\/p>\n<div class=\"katex-block\">\\mathrm{ReLU}(z)=\\max(0,z)<\/div>\n<p>正区间导数恒为 1，负区间为 0。计算便宜，缓解梯度消失，但可能出现&quot;神经元死亡&quot;。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为激活函数是为了模仿大脑<\/strong>——它的数学作用是引入非线性。<\/p>\n<p><strong>别以为输出在 <span class=\"katex-inline\">(0,1)<\/span> 就一定是概率<\/strong>——只有配合交叉熵训练和归一化，才有概率解释。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 7 章<\/td><td>引入与推导<\/td><td>两层线性等于一层；<span class=\"katex-inline\">\\sigma&#x27;=\\sigma(1-\\sigma)<\/span><\/td><\/tr><tr><td>第 8 章<\/td><td>前向传播<\/td><td>每层打分后过激活<\/td><\/tr><tr><td>第 11 章<\/td><td>反向传播<\/td><td><span class=\"katex-inline\">\\delta<\/span> 里要乘 <span class=\"katex-inline\">\\sigma&#x27;<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">链式法则<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">前向传播<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">反向传播<\/a>\n<\/ul>", "kind": "concept", "title": "激活函数"}, "c08": {"html": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">神经元（感知机）<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">激活函数<\/a><\/span><\/div><h1>前向传播<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 8、11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>前向传播是把输入送进网络，逐层做&quot;矩阵乘 + 加偏置 + 激活&quot;，一直算到输出。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是训练和推理共用的第一步。没有前向，就没有损失；没有损失，就没有梯度。<\/p>\n<h2>详解<\/h2>\n<p>第 <span class=\"katex-inline\">l<\/span> 层：<\/p>\n<div class=\"katex-block\">\\mathbf{z}_l=\\mathbf{W}_l\\mathbf{h}_{l-1}+\\mathbf{b}_l,\\qquad \\mathbf{h}_l=\\sigma(\\mathbf{z}_l)<\/div>\n<p><span class=\"katex-inline\">\\mathbf{h}_0=\\mathbf{x}<\/span> 是输入。<\/p>\n<p>2-2-1 网络的具体计算：<\/p>\n<div class=\"katex-block\">\\mathbf{z}_1=\\begin{bmatrix}0.45\\\\0.4\\end{bmatrix},\\quad\\\\\\mathbf{h}_1=\\begin{bmatrix}0.610639\\\\0.598688\\end{bmatrix}<\/div>\n<div class=\"katex-block\">z_2=0.326908,\\quad \\hat{y}=0.581007<\/div>\n<p>每一层的中间值都要保存，反向传播要用。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为前向只是&quot;算个结果&quot;<\/strong>——训练时它还要保存中间值供反向使用，这决定了显存占用。<\/p>\n<p><strong>别以为隐藏层每个神经元都有明确语义<\/strong>——多数是分布式表示，难以逐个解释。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 8 章<\/td><td>完整计算<\/td><td>9 个参数，输出 0.581007<\/td><\/tr><tr><td>第 11 章<\/td><td>反向的起点<\/td><td>复用前向中间值<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">神经元<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">激活函数<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">损失函数<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">反向传播<\/a>\n<\/ul>", "kind": "concept", "title": "前向传播"}, "c09": {"html": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">前向传播<\/a><\/span><\/div><h1>损失函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 9、10、11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>损失函数把&quot;预测错得多严重&quot;压缩成一个可以求导的标量，越小越好。<\/p>\n<h2>为什么重要<\/h2>\n<p>训练的目标就是让损失变小。它定义了&quot;什么叫好&quot;，也决定了梯度往哪指。<\/p>\n<h2>详解<\/h2>\n<p>平方损失：<\/p>\n<div class=\"katex-block\">L=(y-\\hat{y})^2<\/div>\n<p>多样本取平均：<\/p>\n<div class=\"katex-block\">L=\\frac{1}{n}\\sum_{i=1}^n(y_i-\\hat{y}_i)^2<\/div>\n<p>用平方的三个理由：正负不抵消、对大错惩罚更重、处处可导。<\/p>\n<p>分类常用交叉熵：<\/p>\n<div class=\"katex-block\">L=-[y\\ln\\hat{y}+(1-y)\\ln(1-\\hat{y})]<\/div>\n<p>它和 sigmoid 搭配时，输出层 <span class=\"katex-inline\">\\delta=\\hat{y}-y<\/span>，形式极简。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为损失就是准确率<\/strong>——损失看距离，准确率只看对错。两者可以一个很好一个很差。<\/p>\n<p><strong>别以为训练损失越低越好<\/strong>——训练损失接近 0 可能是过拟合。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 9 章<\/td><td>定义<\/td><td>本例 <span class=\"katex-inline\">L=0.175555<\/span><\/td><\/tr><tr><td>第 11 章<\/td><td>反向起点<\/td><td><span class=\"katex-inline\">\\partial L/\\partial\\hat{y}=2(\\hat{y}-y)<\/span><\/td><\/tr><tr><td>第 12 章<\/td><td>训练与泛化<\/td><td>训练损失与验证损失要分开看<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">前向传播<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">梯度下降<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">反向传播<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">过拟合<\/a>\n<\/ul>", "kind": "concept", "title": "损失函数"}, "c10": {"html": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">导数<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c09\">损失函数<\/a><\/span><\/div><h1>梯度下降<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 10、11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>沿着梯度的反方向，按学习率给的一小步，反复更新参数，让损失变小。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是最基础的优化算法。反向传播负责算梯度，梯度下降负责用梯度。<\/p>\n<h2>详解<\/h2>\n<p>单参数：<\/p>\n<div class=\"katex-block\">w\\leftarrow w-\\eta\\frac{dL}{dw}<\/div>\n<p>多参数：<\/p>\n<div class=\"katex-block\">w_i\\leftarrow w_i-\\eta\\frac{\\partial L}{\\partial w_i}<\/div>\n<p><span class=\"katex-inline\">L(w)=(w-1)^2<\/span> 从 <span class=\"katex-inline\">w=3<\/span> 出发，<span class=\"katex-inline\">\\eta=0.1<\/span>：<span class=\"katex-inline\">3\\to 2.6\\to 2.28\\to 2.024\\to 1.819\\to 1.655\\to 1.524<\/span>。<\/p>\n<p>学习率过大：<span class=\"katex-inline\">\\eta=1<\/span> 时 <span class=\"katex-inline\">3\\to-1\\to3\\to-1<\/span>，震荡不收敛。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为一定找到全局最优<\/strong>——它只保证局部下降，可能停在局部低点或鞍点。<\/p>\n<p><strong>别以为梯度为 0 就是最优<\/strong>——山顶和鞍点的梯度也是 0。<\/p>\n<p><strong>别以为学习率是训练出来的<\/strong>——它是人设定的超参数。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 10 章<\/td><td>一维例子<\/td><td>六步从 3 走到 1.524<\/td><\/tr><tr><td>第 11 章<\/td><td>与反向结合<\/td><td>一次更新损失降 20%<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">导数<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">损失函数<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">反向传播<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">过拟合<\/a>\n<\/ul>", "kind": "concept", "title": "梯度下降"}, "c11": {"html": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">链式法则<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c07\">激活函数<\/a><\/span> · <span class=\"prereq-soft\"><span class=\"prereq-tag\">荐<\/span> <a href=\"#/concept/c09\">损失函数<\/a><\/span><\/div><h1>反向传播<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>反向传播是从损失出发，沿网络倒着走，用链式法则一次算出所有参数梯度的算法。<\/p>\n<h2>为什么重要<\/h2>\n<p>没有它，几百万个参数要逐个试，训练在算力上不可能完成。它是深度学习能落地的前提。<\/p>\n<h2>详解<\/h2>\n<p>定义误差项：<\/p>\n<div class=\"katex-block\">\\boldsymbol{\\delta}_l=\\frac{\\partial L}{\\partial \\mathbf{z}_l}<\/div>\n<p>输出层（平方损失 + sigmoid）：<\/p>\n<div class=\"katex-block\">\\delta_o=2(\\hat{y}-y)\\hat{y}(1-\\hat{y})<\/div>\n<p>隐藏层递推：<\/p>\n<div class=\"katex-block\">\\boldsymbol{\\delta}_l=(\\mathbf{W}_{l+1}^{\\mathsf{T}}\\boldsymbol{\\delta}_{l+1})\\odot\\sigma'(\\mathbf{z}_l)<\/div>\n<p>参数梯度：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial\\mathbf{W}_l}=\\boldsymbol{\\delta}_l\\mathbf{h}_{l-1}^{\\mathsf{T}},\\qquad\\\\\\frac{\\partial L}{\\partial\\mathbf{b}_l}=\\boldsymbol{\\delta}_l<\/div>\n<p>计算量与前向同阶，约 2 到 3 倍，与参数数量的平方无关。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为反向传播是学习算法<\/strong>——它只算梯度，更新参数的是优化器。<\/p>\n<p><strong>别以为要重算前向<\/strong>——它复用前向保存的中间值。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 11 章<\/td><td>完整手算<\/td><td>9 个梯度全部算出，损失 0.175555 → 0.140693<\/td><\/tr><tr><td>第 13 章<\/td><td>结构视角<\/td><td>多层网络靠它训练<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">链式法则<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">激活函数<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">损失函数<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">过拟合<\/a>\n<\/li><li>\n深度推导：见页面底部折叠区\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（反向传播）<\/summary><div class=\"depth-body\"><h1>深度推导：反向传播的每一步<\/h1>\n<p>第 11 章给了流程和数值。这一节把每一步的&quot;为什么&quot;补齐，并把标量公式推广到任意多层。读完你应该能对任何一个分层网络，写出它的反向传播公式。<\/p>\n<h2>一、问题摆清楚<\/h2>\n<p>网络有 <span class=\"katex-inline\">P<\/span> 个参数。训练需要每个参数的偏导 <span class=\"katex-inline\">\\partial L/\\partial \\theta_i<\/span>，一共 <span class=\"katex-inline\">P<\/span> 个数。<\/p>\n<p><strong>数值微分<\/strong>的做法：固定其他参数，把 <span class=\"katex-inline\">\\theta_i<\/span> 加一个很小的 <span class=\"katex-inline\">h<\/span>，算两次损失，相除。每个参数要两次前向，总计算量约 <span class=\"katex-inline\">2P<\/span> 次前向。<span class=\"katex-inline\">P=10^6<\/span> 时就是两百万次前向，一次训练迭代都跑不完。<\/p>\n<p><strong>反向传播<\/strong>：一次前向 + 一次反向，计算量约是前向的 2 到 3 倍，与 <span class=\"katex-inline\">P<\/span> 无关（只与网络的规模线性相关）。这是它能用的唯一理由。<\/p>\n<h2>二、把网络拆成计算图<\/h2>\n<p>任何网络都能拆成一串基本运算：乘、加、激活、损失。每个运算有两个方向：<\/p>\n<ul><li>\n前向：输入 <span class=\"katex-inline\">\\to<\/span> 输出，算出数值；\n<\/li><li>\n反向：已知&quot;输出处的梯度&quot;，算出&quot;输入处的梯度&quot;。\n<\/ul>\n<p>反向传播就是沿计算图倒着走，每经过一个运算，把传进来的梯度乘上这个运算的局部导数。<\/p>\n<p>设某一层的计算是：<\/p>\n<div class=\"katex-block\">\\mathbf{z}=\\mathbf{W}\\mathbf{h}_{\\text{prev}}+\\mathbf{b},\\qquad \\mathbf{h}=\\sigma(\\mathbf{z})<\/div>\n<p><span class=\"katex-inline\">\\sigma<\/span> 对向量逐元素作用。<span class=\"katex-inline\">\\mathbf{h}_{\\text{prev}}<\/span> 是上一层的输出，<span class=\"katex-inline\">\\mathbf{h}<\/span> 是这一层的输出。<\/p>\n<h2>三、δ 是什么<\/h2>\n<p>定义：<\/p>\n<div class=\"katex-block\">\\boldsymbol{\\delta}=\\frac{\\partial L}{\\partial \\mathbf{z}}<\/div>\n<p>它是一个向量，第 <span class=\"katex-inline\">j<\/span> 个分量是 <span class=\"katex-inline\">\\partial L/\\partial z_j<\/span>。含义：这一层第 <span class=\"katex-inline\">j<\/span> 个神经元在激活之前的打分变动一点点，损失变多少。<\/p>\n<p>为什么盯住 <span class=\"katex-inline\">\\mathbf{z}<\/span> 而不是 <span class=\"katex-inline\">\\mathbf{h}<\/span>？因为参数只出现在 <span class=\"katex-inline\">\\mathbf{z}=\\mathbf{W}\\mathbf{h}_{\\text{prev}}+\\mathbf{b}<\/span> 里，<span class=\"katex-inline\">\\mathbf{h}<\/span> 只是 <span class=\"katex-inline\">\\mathbf{z}<\/span> 经过激活的结果。把 <span class=\"katex-inline\">\\mathbf{z}<\/span> 的梯度算出来，参数的梯度就是一次乘法的事。<\/p>\n<h2>四、输出层<\/h2>\n<p>输出层的计算取决于损失函数。分两种。<\/p>\n<h3>平方损失 + sigmoid<\/h3>\n<div class=\"katex-block\">L=\\frac{1}{2}(\\hat{y}-y)^2,\\qquad \\hat{y}=\\sigma(z_o)<\/div>\n<p>（这里加 <span class=\"katex-inline\">\\frac{1}{2}<\/span> 是为了让导数变成 <span class=\"katex-inline\">\\hat{y}-y<\/span>，少一个常数因子，不影响最优位置。）<\/p>\n<div class=\"katex-block\">\\delta_o=\\frac{\\partial L}{\\partial z_o}\\\\=\\frac{\\partial L}{\\partial \\hat{y}}\\cdot\\frac{\\partial \\hat{y}}{\\partial z_o}\\\\=(\\hat{y}-y)\\cdot\\hat{y}(1-\\hat{y})<\/div>\n<p>第 11 章用的是不加 <span class=\"katex-inline\">\\frac{1}{2}<\/span> 的版本，所以前面多一个 2。两种写法等价，只差常数。<\/p>\n<h3>交叉熵 + sigmoid<\/h3>\n<div class=\"katex-block\">L=-\\big[y\\ln\\hat{y}+(1-y)\\ln(1-\\hat{y})\\big]<\/div>\n<p>对 <span class=\"katex-inline\">\\hat{y}<\/span> 求导：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial \\hat{y}}=-\\frac{y}{\\hat{y}}+\\frac{1-y}{1-\\hat{y}}\\\\=\\frac{\\hat{y}-y}{\\hat{y}(1-\\hat{y})}<\/div>\n<p>乘以 <span class=\"katex-inline\">\\hat{y}(1-\\hat{y})<\/span>，两项约掉：<\/p>\n<div class=\"katex-block\">\\delta_o=\\hat{y}-y<\/div>\n<p>这就是为什么分类任务喜欢&quot;交叉熵 + sigmoid&quot;：输出层的 <span class=\"katex-inline\">\\delta<\/span> 直接等于&quot;预测减真实&quot;，干净得不像话。平方损失配 sigmoid 会多出一个 <span class=\"katex-inline\">\\hat{y}(1-\\hat{y})<\/span> 因子，当预测接近 0 或 1 时这个因子很小，梯度被压扁，学得慢。<\/p>\n<h2>五、隐藏层：δ 的递推<\/h2>\n<p>设第 <span class=\"katex-inline\">l<\/span> 层的输出 <span class=\"katex-inline\">\\mathbf{h}_l<\/span> 喂给第 <span class=\"katex-inline\">l+1<\/span> 层。第 <span class=\"katex-inline\">l+1<\/span> 层的打分：<\/p>\n<div class=\"katex-block\">\\mathbf{z}_{l+1}=\\mathbf{W}_{l+1}\\mathbf{h}_l+\\mathbf{b}_{l+1}<\/div>\n<p><span class=\"katex-inline\">L<\/span> 通过 <span class=\"katex-inline\">\\mathbf{z}_{l+1}<\/span> 依赖 <span class=\"katex-inline\">\\mathbf{h}_l<\/span>。由链式法则：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial \\mathbf{h}_l}=\\mathbf{W}_{l+1}^{\\mathsf{T}}\\boldsymbol{\\delta}_{l+1}<\/div>\n<p>为什么是转置？<span class=\"katex-inline\">\\mathbf{z}_{l+1}<\/span> 是 <span class=\"katex-inline\">n_{l+1}<\/span> 维，<span class=\"katex-inline\">\\mathbf{h}_l<\/span> 是 <span class=\"katex-inline\">n_l<\/span> 维。<span class=\"katex-inline\">\\partial \\mathbf{z}_{l+1}/\\partial \\mathbf{h}_l<\/span> 是一个 <span class=\"katex-inline\">n_{l+1}\\times n_l<\/span> 的矩阵，正好等于 <span class=\"katex-inline\">\\mathbf{W}_{l+1}<\/span>（因为 <span class=\"katex-inline\">z_i=\\sum_j W_{ij}h_j+b_i<\/span>，对 <span class=\"katex-inline\">h_j<\/span> 的偏导就是 <span class=\"katex-inline\">W_{ij}<\/span>）。把梯度从 <span class=\"katex-inline\">n_{l+1}<\/span> 维映回 <span class=\"katex-inline\">n_l<\/span> 维，需要乘这个矩阵的转置。<\/p>\n<p>再乘激活函数的导数：<\/p>\n<div class=\"katex-block\">\\boldsymbol{\\delta}_l=\\frac{\\partial L}{\\partial \\mathbf{z}_l}\\\\=\\frac{\\partial L}{\\partial \\mathbf{h}_l}\\odot\\sigma'(\\mathbf{z}_l)\\\\=\\big(\\mathbf{W}_{l+1}^{\\mathsf{T}}\\boldsymbol{\\delta}_{l+1}\\big)\\odot\\sigma'(\\mathbf{z}_l)<\/div>\n<p><span class=\"katex-inline\">\\odot<\/span> 是逐元素相乘。<span class=\"katex-inline\">\\sigma&#x27;(\\mathbf{z}_l)<\/span> 是一个同样维数的向量，每个分量是 <span class=\"katex-inline\">\\sigma&#x27;(z_j)<\/span>。<\/p>\n<p>标量情况（一个神经元）就退化成第 11 章的公式：<\/p>\n<div class=\"katex-block\">\\delta_l=\\delta_{l+1}\\cdot w_{l+1}\\cdot\\sigma'(z_l)<\/div>\n<h2>六、参数梯度<\/h2>\n<p>有了 <span class=\"katex-inline\">\\boldsymbol{\\delta}_l<\/span>，第 <span class=\"katex-inline\">l<\/span> 层的参数梯度：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial \\mathbf{W}_l}=\\boldsymbol{\\delta}_l\\mathbf{h}_{l-1}^{\\mathsf{T}}<\/div>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial \\mathbf{b}_l}=\\boldsymbol{\\delta}_l<\/div>\n<p>形状检查：<span class=\"katex-inline\">\\boldsymbol{\\delta}_l<\/span> 是 <span class=\"katex-inline\">n_l<\/span> 维列向量，<span class=\"katex-inline\">\\mathbf{h}_{l-1}^{\\mathsf{T}}<\/span> 是 <span class=\"katex-inline\">1\\times n_{l-1}<\/span> 行向量，乘出来是 <span class=\"katex-inline\">n_l\\times n_{l-1}<\/span>，正好和 <span class=\"katex-inline\">\\mathbf{W}_l<\/span> 同形。<\/p>\n<p>标量情况：<span class=\"katex-inline\">\\partial L/\\partial w=\\delta\\cdot h_{\\text{prev}}<\/span>，<span class=\"katex-inline\">\\partial L/\\partial b=\\delta<\/span>。和上一节一致。<\/p>\n<h2>七、数值算例（和正文同一组参数）<\/h2>\n<div class=\"katex-block\">x_1=1.0,\\ x_2=0.5,\\quad y=1<\/div>\n<div class=\"katex-block\">\\mathbf{W}_1=\\begin{bmatrix}0.5&-0.3\\\\0.2&0.8\\end{bmatrix},\\quad\\\\\\mathbf{b}_1=\\begin{bmatrix}0.1\\\\-0.2\\end{bmatrix}<\/div>\n<div class=\"katex-block\">\\mathbf{W}_2=\\begin{bmatrix}0.6&-0.4\\end{bmatrix},\\quad b_2=0.2<\/div>\n<p><strong>前向<\/strong>：<\/p>\n<div class=\"katex-block\">\\mathbf{z}_1=\\begin{bmatrix}0.45\\\\0.4\\end{bmatrix},\\quad\\\\\\mathbf{h}_1=\\begin{bmatrix}0.610639\\\\0.598688\\end{bmatrix}<\/div>\n<div class=\"katex-block\">z_2=0.326908,\\quad \\hat{y}=0.581007<\/div>\n<div class=\"katex-block\">L=(1-0.581007)^2=0.175555<\/div>\n<p><strong>输出层 δ<\/strong>：<\/p>\n<div class=\"katex-block\">\\delta_2=2(\\hat{y}-y)\\hat{y}(1-\\hat{y})=2(-0.418993)(0.243438)=-0.203998<\/div>\n<p><strong>输出层参数梯度<\/strong>：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial \\mathbf{W}_2}=\\delta_2\\mathbf{h}_1^{\\mathsf{T}}\\\\=\\begin{bmatrix}-0.124569&-0.122131\\end{bmatrix}<\/div>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial b_2}=-0.203998<\/div>\n<p><strong>隐藏层 δ<\/strong>：<\/p>\n<div class=\"katex-block\">\\boldsymbol{\\delta}_1=\\big(\\mathbf{W}_2^{\\mathsf{T}}\\delta_2\\big)\\odot\\sigma'(\\mathbf{z}_1)<\/div>\n<div class=\"katex-block\">\\mathbf{W}_2^{\\mathsf{T}}\\delta_2=\\begin{bmatrix}0.6\\\\-0.4\\end{bmatrix}(-0.203998)\\\\=\\begin{bmatrix}-0.122399\\\\0.081599\\end{bmatrix}<\/div>\n<div class=\"katex-block\">\\sigma'(\\mathbf{z}_1)=\\begin{bmatrix}0.237759\\\\0.240261\\end{bmatrix}<\/div>\n<div class=\"katex-block\">\\boldsymbol{\\delta}_1=\\begin{bmatrix}-0.122399\\times 0.237759\\\\0.081599\\times 0.240261\\end{bmatrix}\\\\=\\begin{bmatrix}-0.029101\\\\0.019605\\end{bmatrix}<\/div>\n<p><strong>隐藏层参数梯度<\/strong>：<\/p>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial \\mathbf{W}_1}=\\boldsymbol{\\delta}_1\\mathbf{x}^{\\mathsf{T}}\\\\=\\begin{bmatrix}-0.029101\\\\0.019605\\end{bmatrix}\\begin{bmatrix}1.0&0.5\\end{bmatrix}\\\\=\\begin{bmatrix}-0.029101&-0.014551\\\\0.019605&0.009803\\end{bmatrix}<\/div>\n<div class=\"katex-block\">\\frac{\\partial L}{\\partial \\mathbf{b}_1}=\\begin{bmatrix}-0.029101\\\\0.019605\\end{bmatrix}<\/div>\n<p>和正文逐项对得上。矩阵写法一次算完一层，不用逐个神经元循环。<\/p>\n<h2>八、为什么反向传播这么快<\/h2>\n<p>前向时每个运算的输入输出都要存下来（激活值、打分值）。反向时每个 <span class=\"katex-inline\">\\delta<\/span> 只做一次矩阵乘和一次逐元素乘。总计算量：<\/p>\n<div class=\"katex-block\">\\text{前向}\\approx \\sum_l n_l n_{l-1},\\qquad \\text{反向}\\approx 2\\sum_l n_l n_{l-1}<\/div>\n<p>和参数数量同阶，不是平方。这就是它能扩展到几十层、上亿参数的原因。<\/p>\n<p>代价是显存：训练时要保存每一层的中间值，batch 越大、层数越多，占用越高。梯度检查点（gradient checkpointing）就是拿计算换显存——不存全部中间值，反向时重算一部分。<\/p>\n<h2>九、四个常见错误<\/h2>\n<p><strong>错误一：忘记转置。<\/strong> 隐藏层 <span class=\"katex-inline\">\\delta<\/span> 用 <span class=\"katex-inline\">\\mathbf{W}^{\\mathsf{T}}<\/span>，不是 <span class=\"katex-inline\">\\mathbf{W}<\/span>。维度对不上会直接报错，但如果两层恰好同宽，错误会被掩盖，训练照跑但学不对。<\/p>\n<p><strong>错误二：把激活函数的导数用错位置。<\/strong> <span class=\"katex-inline\">\\sigma&#x27;(\\mathbf{z}_l)<\/span> 用的是激活<strong>之前<\/strong>的打分 <span class=\"katex-inline\">\\mathbf{z}_l<\/span>，不是输出 <span class=\"katex-inline\">\\mathbf{h}_l<\/span>。sigmoid 恰好有 <span class=\"katex-inline\">\\sigma&#x27;(z)=\\sigma(z)(1-\\sigma(z))=h(1-h)<\/span>，用 <span class=\"katex-inline\">h<\/span> 算也行；换成 tanh 或别的函数，这个巧合就不成立。<\/p>\n<p><strong>错误三：batch 的平均漏掉。<\/strong> 一个 batch 有 <span class=\"katex-inline\">B<\/span> 个样本，损失取平均，梯度也要按 <span class=\"katex-inline\">B<\/span> 平均。漏了会让有效学习率变成原来的 <span class=\"katex-inline\">B<\/span> 倍。<\/p>\n<p><strong>错误四：更新时用了旧梯度。<\/strong> 一个 batch 内，所有梯度要用同一组参数算出来，再统一更新。边算边更新会让后面的样本用上已变的参数，梯度不再对应同一个损失。<\/p>\n<h2>十、把整条链再走一遍<\/h2>\n<p>对任意层 <span class=\"katex-inline\">l<\/span>：<\/p>\n<ol><li>\n前向：<span class=\"katex-inline\">\\mathbf{z}_l=\\mathbf{W}_l\\mathbf{h}_{l-1}+\\mathbf{b}_l<\/span>，<span class=\"katex-inline\">\\mathbf{h}_l=\\sigma(\\mathbf{z}_l)<\/span>，一路到 <span class=\"katex-inline\">\\hat{y}<\/span> 和 <span class=\"katex-inline\">L<\/span>。\n<\/li><li>\n输出层：<span class=\"katex-inline\">\\boldsymbol{\\delta}_{\\text{out}}=\\partial L/\\partial \\mathbf{z}_{\\text{out}}<\/span>，按损失函数和激活函数的具体形式算。\n<\/li><li>\n往回递推：<span class=\"katex-inline\">\\boldsymbol{\\delta}_l=\\big(\\mathbf{W}_{l+1}^{\\mathsf{T}}\\boldsymbol{\\delta}_{l+1}\\big)\\odot\\sigma&#x27;(\\mathbf{z}_l)<\/span>。\n<\/li><li>\n参数梯度：<span class=\"katex-inline\">\\partial L/\\partial \\mathbf{W}_l=\\boldsymbol{\\delta}_l\\mathbf{h}_{l-1}^{\\mathsf{T}}<\/span>，<span class=\"katex-inline\">\\partial L/\\partial \\mathbf{b}_l=\\boldsymbol{\\delta}_l<\/span>。\n<\/li><li>\n更新：<span class=\"katex-inline\">\\mathbf{W}_l\\leftarrow\\mathbf{W}_l-\\eta\\,\\partial L/\\partial \\mathbf{W}_l<\/span>，<span class=\"katex-inline\">\\mathbf{b}_l<\/span> 同理。\n<\/ol>\n<p>这五步对全连接网络成立。换成卷积层，<span class=\"katex-inline\">\\mathbf{W}<\/span> 换成卷积核，&quot;矩阵乘&quot;换成卷积运算，链式法则的结构不变；换成注意力层，<span class=\"katex-inline\">\\mathbf{W}<\/span> 变成查询、键、值的投影矩阵，同样是一串局部导数相乘。<\/p>\n<h2>差生通读检查<\/h2>\n<ul><li>\n用到的矩阵转置、逐元素乘、链式法则，前面都讲过。转置第一次作为&quot;把梯度映回原维度&quot;的工具出现，已经解释。\n<\/li><li>\n每一步都能自己补下一行：<span class=\"katex-inline\">\\mathbf{W}_1<\/span> 的梯度展开成了 <span class=\"katex-inline\">2\\times 2<\/span> 的四个数，没有跳步。\n<\/li><li>\n符号有白话：<span class=\"katex-inline\">\\boldsymbol{\\delta}<\/span> 是&quot;打分的梯度&quot;，<span class=\"katex-inline\">\\odot<\/span> 是&quot;对应位置相乘&quot;，<span class=\"katex-inline\">\\mathsf{T}<\/span> 是&quot;行列互换&quot;。\n<\/li><li>\n给了&quot;为什么&quot;：为什么用转置（维度必须对上）、为什么反向快（计算量和参数同阶，不是平方）、为什么交叉熵配 sigmoid 干净（<span class=\"katex-inline\">\\hat{y}-y<\/span> 直接出来）。\n<\/ul><\/div><\/details>", "kind": "concept", "title": "反向传播"}, "c12": {"html": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-soft\"><span class=\"prereq-tag\">荐<\/span> <a href=\"#/concept/c09\">损失函数<\/a><\/span> · <span class=\"prereq-soft\"><span class=\"prereq-tag\">荐<\/span> <a href=\"#/concept/c10\">梯度下降<\/a><\/span><\/div><h1>过拟合<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 12 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>模型把训练集的细节和噪声也记下来了，训练表现很好，换新数据就变差。<\/p>\n<h2>为什么重要<\/h2>\n<p>训练的目标不是&quot;在训练集上完美&quot;，而是&quot;在新数据上表现好&quot;。分不清这两件事，调参就会往错的方向走。<\/p>\n<h2>详解<\/h2>\n<p>典型信号：训练损失持续下降，验证损失先降后升。<\/p>\n<div>\n<svg viewBox=\"0 0 420 200\" width=\"100%\" role=\"img\" aria-label=\"过拟合曲线\">\n<line x1=\"40\" y1=\"170\" x2=\"400\" y2=\"170\" stroke=\"#9ca3af\"/>\n<line x1=\"40\" y1=\"170\" x2=\"40\" y2=\"20\" stroke=\"#9ca3af\"/>\n<path d=\"M 50 40 C 130 110, 260 140, 390 145\" fill=\"none\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n<path d=\"M 50 40 C 110 100, 170 125, 210 110 C 260 92, 310 80, 390 65\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/>\n<text x=\"300\" y=\"160\" font-size=\"11\" fill=\"#3b82f6\">训练损失<\/text>\n<text x=\"310\" y=\"60\" font-size=\"11\" fill=\"#dc2626\">验证损失<\/text>\n<\/svg>\n<\/div>\n<p>看图说明：蓝线一直降，红线先降后升。红线最低点之后就是过拟合区间。<\/p>\n<p>对抗手段：<\/p>\n<ul><li>\n正则化：惩罚大权重，如 <span class=\"katex-inline\">\\lambda\\sum w_i^2<\/span>\n<\/li><li>\nDropout：训练时随机丢弃一部分神经元\n<\/li><li>\n早停：验证损失开始升就停\n<\/li><li>\n数据增强：翻转、裁剪、加噪声\n<\/ul>\n<h2>常见误解<\/h2>\n<p><strong>别以为训练准确率 100% 值得高兴<\/strong>——那可能意味着背下了训练集。<\/p>\n<p><strong>别以为过拟合只跟模型大小有关<\/strong>——数据量、噪声、训练轮次、正则化强度都会影响。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 12 章<\/td><td>定义与对策<\/td><td>训练损失 0.01 / 验证 0.45 是过拟合<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">损失函数<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">梯度下降<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">反向传播<\/a>\n<\/ul>", "kind": "concept", "title": "过拟合"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：函数与复合<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：函数是一台机器<\/a><br>检查点：能算复合函数的值，说清先后顺序<\/li><li class='path-step' id='path-02'><strong>步骤 02：直线与分类<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：一条直线能干什么<\/a><br>检查点：能写出一个线性分类规则并判断点的类别<\/li><li class='path-step' id='path-03'><strong>步骤 03：变化率与导数<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：变化率与导数<\/a><br>检查点：能自己推出 (x²)&#x27;=2x<\/li><li class='path-step' id='path-04'><strong>步骤 04：链式法则<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：套娃函数怎么求导<\/a><br>检查点：能对三层复合函数求导，不漏乘内层<\/li><li class='path-step' id='path-05'><strong>步骤 05：向量与矩阵<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：一堆数怎么算<\/a><br>检查点：能算点积与矩阵乘向量，会检查维度<\/li><li class='path-step' id='path-06'><strong>步骤 06：一个神经元<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：一个神经元<\/a><br>检查点：能说明为什么单层做不了异或<\/li><li class='path-step' id='path-07'><strong>步骤 07：激活函数<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：为什么必须拐弯<\/a><br>检查点：能证明两层线性等于一层，会推 sigmoid 导数<\/li><li class='path-step' id='path-08'><strong>步骤 08：前向传播<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：把神经元摞起来<\/a><br>检查点：能手算 2-2-1 网络输出 0.581007<\/li><li class='path-step' id='path-09'><strong>步骤 09：损失函数<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：错得有多离谱<\/a><br>检查点：能算平方损失，说清损失与准确率的区别<\/li><li class='path-step' id='path-10'><strong>步骤 10：梯度下降<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：下山<\/a><br>检查点：能手算三步更新，说出学习率过大的后果<\/li><li class='path-step' id='path-11'><strong>步骤 11：反向传播<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章：误差怎么传回去<\/a><br>检查点：能手算 9 个梯度并完成一次更新<\/li><li class='path-step' id='path-12'><strong>步骤 12：泛化与网络家族<\/strong><br>阅读：<a href=\"#/chapter/ch12\">第 12 章：训练完之后<\/a><br>检查点：能判断过拟合，说出 CNN/RNN/Transformer 的分工<\/li><li class='path-step' id='path-13'><strong>步骤 13：综合检验<\/strong><br>阅读：<a href=\"#/chapter/ch13\">第 13 章：综合检验：手搭一个异或网络<\/a><br>检查点：能独立设计并验证一个异或网络<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q30' data-type='single' data-concept='c11' data-chapter='__all__'><p class='quiz-q'><b>Q30.<\/b> 一次正确的反向传播加参数更新之后，损失通常会怎样？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q30' value='0'> 下降<\/label><label class='quiz-opt'><input type='radio' name='q30' value='1'> 上升<\/label><label class='quiz-opt'><input type='radio' name='q30' value='2'> 不变<\/label><label class='quiz-opt'><input type='radio' name='q30' value='3'> 立刻变成 0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q31' data-type='single' data-concept='c09' data-chapter='__all__'><p class='quiz-q'><b>Q31.<\/b> 下面哪个不能直接当作训练目标？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q31' value='0'> 平方损失<\/label><label class='quiz-opt'><input type='radio' name='q31' value='1'> 交叉熵<\/label><label class='quiz-opt'><input type='radio' name='q31' value='2'> 准确率<\/label><label class='quiz-opt'><input type='radio' name='q31' value='3'> 均方误差<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q32' data-type='multi' data-concept='c12' data-chapter='__all__'><p class='quiz-q'><b>Q32.<\/b> 下面哪些手段可以缓解过拟合？（多选）<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q32' value='0'> L2 正则化<\/label><label class='quiz-opt'><input type='checkbox' name='q32' value='1'> Dropout<\/label><label class='quiz-opt'><input type='checkbox' name='q32' value='2'> 早停<\/label><label class='quiz-opt'><input type='checkbox' name='q32' value='3'> 增大学习率<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：函数是一台机器<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> f(x)=2x+3，f(4) 等于多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 11<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 8<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 14<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 10<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 计算 f(g(2)) 时，应该先算谁？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 先算外层 f<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 先算内层 g<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 两个同时算<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 顺序无所谓<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：一条直线能干什么<\/h1><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 直线 y=-2x+5 的斜率是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> -2<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 5<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> -5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 规则 z=2x1+x2-3，点 (1,1) 在哪里？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> z&gt;0 一侧<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> z&lt;0 一侧<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 正好在 z=0 上<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 无法计算<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：变化率与导数<\/h1><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c03' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> f(x)=x² 在 x=4 处的导数是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 4<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 8<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 16<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c03' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> f(x)=x² 在区间 [2, 2.1] 上的平均变化率是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 4.1<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 4<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 4.2<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 8.1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：套娃函数怎么求导<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c04' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> y=(3x+1)² 的导数是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 6(3x+1)<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 2(3x+1)<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 18x+1<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 3(3x+1)²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c04' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 链式法则为什么是相乘而不是相加？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 因为导数可以相加<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 因为变化率沿链条传导，中间变化量被约掉<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 因为外层函数更大<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 因为乘法计算更快<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch05__": {"html": "<h1>测验：第 5 章：一堆数怎么算<\/h1><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c05' data-chapter='ch05'><p class='quiz-q'><b>Q1.<\/b> 向量 (1,2) 与 (3,-1) 的点积是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 5<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> -1<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='blank' data-concept='c05' data-chapter='ch05'><p class='quiz-q'><b>Q2.<\/b> 矩阵 [[2,1],[0,3]] 乘向量 [1,2]，结果的第一个分量是多少？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch06__": {"html": "<h1>测验：第 6 章：一个神经元<\/h1><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c06' data-chapter='ch06'><p class='quiz-q'><b>Q1.<\/b> 单个神经元可以完成下面哪个运算？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 异或<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 与运算<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 同或<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 任意分类<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c06' data-chapter='ch06'><p class='quiz-q'><b>Q2.<\/b> w=(1,1)、b=-0.5，阶跃判断 z&gt;0 输出 1，实现的是哪个运算？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 与<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 或<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 非<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 异或<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch07__": {"html": "<h1>测验：第 7 章：为什么必须拐弯<\/h1><div class='quiz-item' data-qid='q13' data-type='single' data-concept='c07' data-chapter='ch07'><p class='quiz-q'><b>Q1.<\/b> 两层不带激活函数的线性网络，等价于什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> 两层非线性网络<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> 一层线性变换<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> 无穷层网络<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 无法计算<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><  data-type='blank' data-concept='c08' data-chapter='ch08'><p class='quiz-q'><b>Q2.<\/b> z1=0.5×1.0+(-0.3)×0.5+0.1，z1 等于多少？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch09__": {"html": "<h1>测验：第 9 章：错得有多离谱<\/h1><div class='quiz-item' data-qid='q18' data-type='single' data-concept='c09' data-chapter='ch09'><p class='quiz-q'><b>Q1.<\/b> 真实标签 y=0，预测 ŷ=0.5，平方损失是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> 0.25<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> 0.5<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> 0.05<\/label><label class='quiz-opt'><input type='radio' name='q18' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q19' data-type='single' data-concept='c09' data-chapter='ch09'><p class='quiz-q'><b>Q2.<\/b> 为什么平方损失不用绝对值？下面哪个理由成立？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> 绝对值计算更慢<\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> 绝对值在 0 处不可导<\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> 绝对值不能避免正负抵消<\/label><label class='quiz-opt'><input type='radio' name='q19' value='3'> 绝对值会放大错误<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch10__": {"html": "<h1>测验：第 10 章：下山<\/h1><div class='quiz-item' data-qid='q20' data-type='single' data-concept='c10' data-chapter='ch10'><p class='quiz-q'><b>Q1.<\/b> L(w)=(w-2)²，从 w=4 出发，学习率 0.1，走一步后 w 是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q20' value='0'> 3.6<\/label><label class='quiz-opt'><input type='radio' name='q20' value='1'> 3.8<\/label><label class='quiz-opt'><input type='radio' name='q20' value='2'> 3.2<\/label><label class='quiz-opt'><input type='radio' name='q20' value='3'> 2.0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q21' data-type='single' data-concept='c10' data-chapter='ch10'><p class='quiz-q'><b>Q2.<\/b> 学习率过大会发生什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q21' value='0'> 收敛更快<\/label><label class='quiz-opt'><input type='radio' name='q21' value='1'> 震荡或发散<\/label><label class='quiz-opt'><input type='radio' name='q21' value='2'> 梯度消失<\/label><label class='quiz-opt'><input type='radio' name='q21' value='3'> 参数变成 0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch11__": {"html": "<h1>测验：第 11 章：误差怎么传回去<\/h1><div class='quiz-item' data-qid='q22' data-type='single' data-concept='c11' data-chapter='ch11'><p class='quiz-q'><b>Q1.<\/b> 平方损失配 sigmoid 输出层，δo 的公式是哪个？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q22' value='0'> 2(ŷ-y)ŷ(1-ŷ)<\/label><label class='quiz-opt'><input type='radio' name='q22' value='1'> (ŷ-y)<\/label><label class='quiz-opt'><input type='radio' name='q22' value='2'> 2(ŷ-y)<\/label><label class='quiz-opt'><input type='radio' name='q22' value='3'> ŷ(1-ŷ)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q23' data-type='single' data-concept='c11' data-chapter='ch11'><p class='quiz-q'><b>Q2.<\/b> 隐藏层 δ1 的公式里乘了 v1，v1 是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q23' value='0'> 激活函数的值<\/label><label class='quiz-opt'><input type='radio' name='q23' value='1'> 输出层连到 h1 的权重<\/label><label class='quiz-opt'><input type='radio' name='q23' value='2'> 输入 x1<\/label><label class='quiz-opt'><input type='radio' name='q23' value='3'> 学习率<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q24' data-type='single' data-concept='c11' data-chapter='ch11'><p class='quiz-q'><b>Q3.<\/b> 某个参数的梯度为正，更新时应该怎么调？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q24' value='0'> 调大<\/label><label class='quiz-opt'><input type='radio' name='q24' value='1'> 调小<\/label><label class='quiz-opt'><input type='radio' name='q24' value='2'> 不变<\/label><label class='quiz-opt'><input type='radio' name='q24' value='3'> 随机<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q25' data-type='single' data-concept='c11' data-chapter='ch11'><p class='quiz-q'><b>Q4.<\/b> 某个权重的梯度等于该层的 δ 乘以什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q25' value='0'> 这个权重的输入<\/label><label class='quiz-opt'><input type='radio' name='q25' value='1'> 学习率<\/label><label class='quiz-opt'><input type='radio' name='q25' value='2'> 损失值<\/label><label class='quiz-opt'><input type='radio' name='q25' value='3'> 激活函数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch12__": {"html": "<h1>测验：第 12 章：训练完之后<\/h1><div class='quiz-item' data-qid='q26' data-type='single' data-concept='c12' data-chapter='ch12'><p class='quiz-q'><b>Q1.<\/b> 下面哪个是过拟合的典型信号？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q26' value='0'> 训练损失下降，验证损失上升<\/label><label class='quiz-opt'><input type='radio' name='q26' value='1'> 训练损失上升，验证损失下降<\/label><label class='quiz-opt'><input type='radio' name='q26' value='2'> 两者都上升<\/label><label class='quiz-opt'><input type='radio' name='q26' value='3'> 两者都下降<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q27' data-type='single' data-concept='c12' data-chapter='ch12'><p class='quiz-q'><b>Q2.<\/b> Dropout 的作用是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q27' value='0'> 训练时随机丢弃部分神经元，减少相互依赖<\/label><label class='quiz-opt'><input type='radio' name='q27' value='1'> 永久删除神经元<\/label><label class='quiz-opt'><input type='radio' name='q27' value='2'> 增加网络层数<\/label><label class='quiz-opt'><input type='radio' name='q27' value='3'> 提高学习率<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch13__": {"html": "<h1>测验：第 13 章：综合检验：手搭一个异或网络<\/h1><div class='quiz-item' data-qid='q28' data-type='single' data-concept='c06' data-chapter='ch13'><p class='quiz-q'><b>Q1.<\/b> 本教程的异或网络里，两个隐藏神经元分别负责什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q28' value='0'> 都算与<\/label><label class='quiz-opt'><input type='radio' name='q28' value='1'> 一个算或，一个算与<\/label><label class='quiz-opt'><input type='radio' name='q28' value='2'> 都算或<\/label><label class='quiz-opt'><input type='radio' name='q28' value='3'> 都不参与<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q29' data-type='single' data-concept='c08' data-chapter='ch13'><p class='quiz-q'><b>Q2.<\/b> 隐藏层在异或问题里起的关键作用是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q29' value='0'> 再切一刀<\/label><label class='quiz-opt'><input type='radio' name='q29' value='1'> 把数据换到新坐标，使两类点可分<\/label><label class='quiz-opt'><input type='radio' name='q29' value='2'> 减少参数<\/label><label class='quiz-opt'><input type='radio' name='q29' value='3'> 增大损失<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='函数'>函数 — 输入定输出的对应规则，每个输入对应唯一输出。 <span class=glossary-ref>（第 1 章：函数是一台机器）<\/span><\/li><li data-term='自变量'>自变量 — 函数里可以自由取值的输入。 <span class=glossary-ref>（第 1 章：函数是一台机器）<\/span><\/li><li data-term='因变量'>因变量 — 随自变量变化而变化的输出。 <span class=glossary-ref>（第 1 章：函数是一台机器）<\/span><\/li><li data-term='复合函数'>复合函数 — 把一个函数的输出当作另一个函数的输入，机器套机器。 <span class=glossary-ref>（第 1 章：函数是一台机器）<\/span><\/li><li data-term='斜率'>斜率 — 横着走一格，竖着变多少，衡量倾斜程度。 <span class=glossary-ref>（第 2 章：一条直线能干什么）<\/span><\/li><li data-term='截距'>截距 — 直线与纵轴交点的纵坐标，即 x=0 时的 y 值。 <span class=glossary-ref>（第 2 章：一条直线能干什么）<\/span><\/li><li data-term='权重'>权重 — 给某个输入分配的乘数，表示这个输入在打分中的比重。 <span class=glossary-ref>（第 2 章：一条直线能干什么）<\/span><\/li><li data-term='偏置'>偏置 — 加权和之外额外加的一个数，控制判断门槛的高低。 <span class=glossary-ref>（第 2 章：一条直线能干什么）<\/span><\/li><li data-term='平均变化率'>平均变化率 — 一段区间内输出变化量除以输入变化量。 <span class=glossary-ref>（第 3 章：变化率与导数）<\/span><\/li><li data-term='极限'>极限 — 让某个量无限靠近一个值时，表达式稳定到的那个数。 <span class=glossary-ref>（第 3 章：变化率与导数）<\/span><\/li><li data-term='导数'>导数 — 函数在某一点的瞬时变化率，等于该点切线斜率。 <span class=glossary-ref>（第 3 章：变化率与导数）<\/span><\/li><li data-term='切线'>切线 — 曲线上某点附近与曲线最贴近的直线。 <span class=glossary-ref>（第 3 章：变化率与导数）<\/span><\/li><li data-term='幂法则'>幂法则 — (x^n)&#x27; = n x^(n-1)，幂函数的求导规则。 <span class=glossary-ref>（第 3 章：变化率与导数）<\/span><\/li><li data-term='链式法则'>链式法则 — 复合函数求导等于外层导数乘内层导数。 <span class=glossary-ref>（第 4 章：套娃函数怎么求导）<\/span><\/li><li data-term='向量'>向量 — 按顺序排好的一组数，作为一个整体参与运算。 <span class=glossary-ref>（第 5 章：一堆数怎么算）<\/span><\/li><li data-term='维数'>维数 — 向量里包含的数的个数。 <span class=glossary-ref>（第 5 章：一堆数怎么算）<\/span><\/li><li data-term='点积'>点积 — 两个向量对应相乘再相加，结果是一个数。 <span class=glossary-ref>（第 5 章：一堆数怎么算）<\/span><\/li><li data-term='矩阵'>矩阵 — 按行列排布的一堆数，可看作多个向量叠起来。 <span class=glossary-ref>（第 5 章：一堆数怎么算）<\/span><\/li><li data-term='矩阵乘法'>矩阵乘法 — 左边矩阵的每一行与右边向量或列做点积。 <span class=glossary-ref>（第 5 章：一堆数怎么算）<\/span><\/li><li data-term='神经元'>神经元 — 加权求和后过激活函数的计算单元。 <span class=glossary-ref>（第 6 章：一个神经元）<\/span><\/li><li data-term='感知机'>感知机 — 使用阶跃函数的最早期神经元模型。 <span class=glossary-ref>（第 6 章：一个神经元）<\/span><\/li><li data-term='阶跃函数'>阶跃函数 — 输入大于 0 输出 1，否则输出 0 的开关式函数。 <span class=glossary-ref>（第 6 章：一个神经元）<\/span><\/li><li data-term='分界线'>分界线 — 把平面分成两部分的直线，对应 z=0 的位置。 <span class=glossary-ref>（第 6 章：一个神经元）<\/span><\/li><li data-term='法向量'>法向量 — 垂直于某条直线或平面的向量。 <span class=glossary-ref>（第 6 章：一个神经元）<\/span><\/li><li data-term='异或'>异或 — 两个输入不同时输出 1，相同时输出 0 的运算。 <span class=glossary-ref>（第 6 章：一个神经元）<\/span><\/li><li data-term='激活函数'>激活函数 — 加权求和之后加的非线性函数。 <span class=glossary-ref>（第 7 章：为什么必须拐弯）<\/span><\/li><li data-term='sigmoid'>sigmoid — 把任意实数压到 (0,1) 区间的 S 形函数。 <span class=glossary-ref>（第 7 章：为什么必须拐弯）<\/span><\/li><li data-term='relu'>ReLU — max(0,z)，负数输出 0，正数原样输出。 <span class=glossary-ref>（第 7 章：为什么必须拐弯）<\/span><\/li><li data-term='梯度消失'>梯度消失 — 反向传播连乘小导数，导致浅层梯度趋近 0。 <span class=glossary-ref>（第 7 章：为什么必须拐弯）<\/span><\/li><li data-term='前向传播'>前向传播 — 输入逐层经过矩阵乘、偏置、激活，算到输出。 <span class=glossary-ref>（第 8 章：把神经元摞起来）<\/span><\/li><li data-term='隐藏层'>隐藏层 — 输入和输出之间的层，其值没有直接标签。 <span class=glossary-ref>（第 8 章：把神经元摞起来）<\/span><\/li><li data-term='参数'>参数 — 网络里可以被训练调整的数，包括权重和偏置。 <span class=glossary-ref>（第 8 章：把神经元摞起来）<\/span><\/li><li data-term='损失函数'>损失函数 — 衡量预测与真实差距的函数，越小越好。 <span class=glossary-ref>（第 9 章：错得有多离谱）<\/span><\/li><li data-term='平方损失'>平方损失 — 预测与真实之差的平方。 <span class=glossary-ref>（第 9 章：错得有多离谱）<\/span><\/li><li data-term='均方误差'>均方误差 — 所有样本平方损失的平均值。 <span class=glossary-ref>（第 9 章：错得有多离谱）<\/span><\/li><li data-term='交叉熵'>交叉熵 — 分类任务常用的损失，对自信地答错惩罚极重。 <span class=glossary-ref>（第 9 章：错得有多离谱）<\/span><\/li><li data-term='梯度'>梯度 — 损失对所有参数偏导组成的向量，指向上升最快方向。 <span class=glossary-ref>（第 10 章：下山）<\/span><\/li><li data-term='梯度下降'>梯度下降 — 沿梯度反方向按学习率更新参数。 <span class=glossary-ref>（第 10 章：下山）<\/span><\/li><li data-term='学习率'>学习率 — 每次更新沿梯度方向走多远，记作 eta。 <span class=glossary-ref>（第 10 章：下山）<\/span><\/li><li data-term='超参数'>超参数 — 人设定的、不被梯度更新的参数，如学习率、批大小。 <span class=glossary-ref>（第 10 章：下山）<\/span><\/li><li data-term='反向传播'>反向传播 — 从损失出发，用链式法则一次算出全部参数梯度。 <span class=glossary-ref>（第 11 章：误差怎么传回去）<\/span><\/li><li data-term='误差项 delta'>误差项 delta — 损失对某一层激活前打分的偏导。 <span class=glossary-ref>（第 11 章：误差怎么传回去）<\/span><\/li><li data-term='epoch'>epoch — 把整个训练集完整过一遍。 <span class=glossary-ref>（第 12 章：训练完之后）<\/span><\/li><li data-term='batch'>batch — 一次参数更新所使用的样本数量。 <span class=glossary-ref>（第 12 章：训练完之后）<\/span><\/li><li data-term='mini-batch'>mini-batch — 取一小批样本估计梯度并更新，介于 SGD 与全量之间。 <span class=glossary-ref>（第 12 章：训练完之后）<\/span><\/li><li data-term='过拟合'>过拟合 — 训练集表现好、新数据表现差，模型记住了噪声。 <span class=glossary-ref>（第 12 章：训练完之后）<\/span><\/li><li data-term='正则化'>正则化 — 在损失里加大权重惩罚，限制模型过度拟合。 <span class=glossary-ref>（第 12 章：训练完之后）<\/span><\/li><li data-term='dropout'>Dropout — 训练时随机丢弃部分神经元输出，减少相互依赖。 <span class=glossary-ref>（第 12 章：训练完之后）<\/span><\/li><li data-term='早停'>早停 — 验证损失开始上升时停止训练。 <span class=glossary-ref>（第 12 章：训练完之后）<\/span><\/li><li data-term='数据增强'>数据增强 — 对训练样本做翻转、裁剪、加噪等变换，扩充数据。 <span class=glossary-ref>（第 12 章：训练完之后）<\/span><\/li><li data-term='cnn'>CNN — 卷积神经网络，用滑动卷积核共享权重，适合图像。 <span class=glossary-ref>（第 12 章：训练完之后）<\/span><\/li><li data-term='rnn'>RNN — 循环神经网络，按时间步传递隐藏状态，适合序列。 <span class=glossary-ref>（第 12 章：训练完之后）<\/span><\/li><li data-term='transformer'>Transformer — 以注意力机制为核心的网络结构，适合长距离依赖。 <span class=glossary-ref>（第 12 章：训练完之后）<\/span><\/li><li data-term='注意力机制'>注意力机制 — 让每个位置直接按相关性聚合其他位置的信息。 <span class=glossary-ref>（第 12 章：训练完之后）<\/span><\/li><li data-term='雅可比矩阵'>雅可比矩阵 — 一个向量函数对所有输入分量的偏导排成的矩阵。 <span class=glossary-ref>（第 11 章：误差怎么传回去）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：从函数到网络的五层拆解<\/h2>\n<p>拿到一个神经网络问题，按这五层往下问：<\/p>\n<ol><li>\n<strong>它是什么函数<\/strong>：输入什么、输出什么、中间经过几层。\n<\/li><li>\n<strong>每层怎么算<\/strong>：<span class=\"katex-inline\">\\mathbf{z}=\\mathbf{W}\\mathbf{h}+\\mathbf{b}<\/span>，再过什么激活。\n<\/li><li>\n<strong>损失怎么定义<\/strong>：预测和真实差多少，用什么公式量。\n<\/li><li>\n<strong>梯度怎么来<\/strong>：链式法则从损失往回乘，每层乘一个局部导数。\n<\/li><li>\n<strong>参数怎么更新<\/strong>：学习率乘以梯度，往反方向走一步。\n<\/ol>\n<p>这个顺序对应第 1、8、9、11、10 章。卡住时先定位自己断在哪一层，不要跳步。<\/p>\n<h2>决策规则：什么时候需要非线性<\/h2>\n<ul><li>\n如果所有层都是线性的：立刻停手，整个网络等于一层，加层没意义。\n<\/li><li>\n如果任务需要&quot;弯曲的边界&quot;（异或、图像、语言）：每一层后面必须加非线性激活。\n<\/li><li>\n如果网络很深（十几层以上）：优先 ReLU 系，sigmoid 容易梯度消失。\n<\/li><li>\n如果输出要当概率用：最后一层用 sigmoid（二分类）或 softmax（多分类）。\n<\/ul>\n<h2>决策规则：梯度算得对不对，怎么查<\/h2>\n<ol><li>\n<strong>维度检查<\/strong>：<span class=\"katex-inline\">\\partial L/\\partial \\mathbf{W}_l<\/span> 必须和 <span class=\"katex-inline\">\\mathbf{W}_l<\/span> 同形。\n<\/li><li>\n<strong>数值检查<\/strong>：把某个参数加 <span class=\"katex-inline\">10^{-4}<\/span>，重算损失，和解析梯度比。相对误差在 <span class=\"katex-inline\">10^{-6}<\/span> 量级算对。\n<\/li><li>\n<strong>符号检查<\/strong>：损失下降的方向是梯度的反方向。更新后损失应该变小，变大就是符号反了。\n<\/li><li>\n<strong>量级检查<\/strong>：梯度爆炸（数值 grows 到 <span class=\"katex-inline\">10^{10}<\/span>）说明连乘因子太大；梯度消失（降到 <span class=\"katex-inline\">10^{-10}<\/span>）说明因子太小。\n<\/ol>\n<h2>反模式<\/h2>\n<p><strong>反模式一：跳过前向直接调参。<\/strong> 不知道每层输出是什么就改学习率，等于闭眼修车。先把一层的 <span class=\"katex-inline\">\\mathbf{z}<\/span>、<span class=\"katex-inline\">\\mathbf{h}<\/span> 打出来看。<\/p>\n<p><strong>反模式二：用准确率当训练目标。<\/strong> 准确率不可导，没法直接做梯度下降。训练看损失，评估看准确率。<\/p>\n<p><strong>反模式三：层数堆上去再说。<\/strong> 表达力够用就停。两层能解决异或，加第三层只会增加训练难度。<\/p>\n<p><strong>反模式四：只看训练损失。<\/strong> 训练损失降到 0 可能只是背答案。必须留验证集。<\/p>\n<p><strong>反模式五：学习率一次定死。<\/strong> 先用小值试，看损失曲线再调。震荡就减半，太慢就加倍。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>核心公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>一次函数<\/td><td><span class=\"katex-inline\">y=kx+b<\/span><\/td><\/tr><tr><td>导数定义<\/td><td><span class=\"katex-inline\">f&#x27;(x)=\\lim_{h\\to0}\\frac{f(x+h)-f(x)}{h}<\/span><\/td><\/tr><tr><td>幂函数导数<\/td><td><span class=\"katex-inline\">(x^n)&#x27;=nx^{n-1}<\/span><\/td><\/tr><tr><td>链式法则<\/td><td><span class=\"katex-inline\">\\frac{dy}{dx}=\\frac{dy}{du}\\cdot\\frac{du}{dx}<\/span><\/td><\/tr><tr><td>点积<\/td><td><span class=\"katex-inline\">\\mathbf{w}\\cdot\\mathbf{x}=\\sum_i w_ix_i<\/span><\/td><\/tr><tr><td>一层前向<\/td><td><span class=\"katex-inline\">\\mathbf{z}=\\mathbf{W}\\mathbf{h}+\\mathbf{b}<\/span>，<span class=\"katex-inline\">\\mathbf{h}=\\sigma(\\mathbf{z})<\/span><\/td><\/tr><tr><td>sigmoid<\/td><td><span class=\"katex-inline\">\\sigma(z)=\\frac{1}{1+e^{-z}}<\/span><\/td><\/tr><tr><td>sigmoid 导数<\/td><td><span class=\"katex-inline\">\\sigma&#x27;(z)=\\sigma(z)(1-\\sigma(z))<\/span><\/td><\/tr><tr><td>ReLU<\/td><td><span class=\"katex-inline\">\\max(0,z)<\/span><\/td><\/tr><tr><td>平方损失<\/td><td><span class=\"katex-inline\">L=(y-\\hat{y})^2<\/span><\/td><\/tr><tr><td>交叉熵<\/td><td><span class=\"katex-inline\">L=-[y\\ln\\hat{y}+(1-y)\\ln(1-\\hat{y})]<\/span><\/td><\/tr><tr><td>梯度下降<\/td><td><span class=\"katex-inline\">\\theta\\leftarrow\\theta-\\eta\\frac{\\partial L}{\\partial\\theta}<\/span><\/td><\/tr><tr><td>输出层 δ（平方）<\/td><td><span class=\"katex-inline\">\\delta_o=2(\\hat{y}-y)\\hat{y}(1-\\hat{y})<\/span><\/td><\/tr><tr><td>输出层 δ（交叉熵）<\/td><td><span class=\"katex-inline\">\\delta_o=\\hat{y}-y<\/span><\/td><\/tr><tr><td>隐藏层 δ<\/td><td><span class=\"katex-inline\">\\boldsymbol{\\delta}_l=(\\mathbf{W}_{l+1}^{\\mathsf{T}}\\boldsymbol{\\delta}_{l+1})\\odot\\sigma&#x27;(\\mathbf{z}_l)<\/span><\/td><\/tr><tr><td>权重梯度<\/td><td><span class=\"katex-inline\">\\frac{\\partial L}{\\partial\\mathbf{W}_l}=\\boldsymbol{\\delta}_l\\mathbf{h}_{l-1}^{\\mathsf{T}}<\/span><\/td><\/tr><tr><td>偏置梯度<\/td><td><span class=\"katex-inline\">\\frac{\\partial L}{\\partial\\mathbf{b}_l}=\\boldsymbol{\\delta}_l<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>本教程网络的数值<\/h2>\n<table><thead><tr><th>量<\/th><th>值<\/th><\/tr><\/thead><tbody><tr><td>输入<\/td><td><span class=\"katex-inline\">x_1=1.0<\/span>，<span class=\"katex-inline\">x_2=0.5<\/span><\/td><\/tr><tr><td>隐藏打分<\/td><td><span class=\"katex-inline\">z_1=0.45<\/span>，<span class=\"katex-inline\">z_2=0.4<\/span><\/td><\/tr><tr><td>隐藏输出<\/td><td><span class=\"katex-inline\">h_1=0.610639<\/span>，<span class=\"katex-inline\">h_2=0.598688<\/span><\/td><\/tr><tr><td>输出打分<\/td><td><span class=\"katex-inline\">z_o=0.326908<\/span><\/td><\/tr><tr><td>预测<\/td><td><span class=\"katex-inline\">\\hat{y}=0.581007<\/span><\/td><\/tr><tr><td>损失（<span class=\"katex-inline\">y=1<\/span>）<\/td><td><span class=\"katex-inline\">0.175555<\/span><\/td><\/tr><tr><td>输出层 <span class=\"katex-inline\">\\delta_o<\/span><\/td><td><span class=\"katex-inline\">-0.203998<\/span><\/td><\/tr><tr><td>隐藏层 <span class=\"katex-inline\">\\delta_1,\\delta_2<\/span><\/td><td><span class=\"katex-inline\">-0.029101<\/span>，<span class=\"katex-inline\">0.019605<\/span><\/td><\/tr><tr><td>更新后损失<\/td><td><span class=\"katex-inline\">0.140693<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>检查清单<\/h2>\n<p><strong>写代码前<\/strong><\/p>\n<ul><li>\n维度：<span class=\"katex-inline\">\\mathbf{W}_l<\/span> 是 <span class=\"katex-inline\">n_l\\times n_{l-1}<\/span>，<span class=\"katex-inline\">\\mathbf{b}_l<\/span> 是 <span class=\"katex-inline\">n_l<\/span> 维。\n<\/li><li>\n激活：隐藏层用什么、输出层用什么，先定。\n<\/li><li>\n损失：回归用平方，分类用交叉熵。\n<\/ul>\n<p><strong>训练中<\/strong><\/p>\n<ul><li>\n前向输出有没有 NaN：有就是数值溢出，检查 <span class=\"katex-inline\">\\exp<\/span> 的参数范围。\n<\/li><li>\n损失是否稳定下降：震荡查学习率，不降查梯度符号。\n<\/li><li>\n验证损失：每若干轮看一次，开始升就早停。\n<\/ul>\n<p><strong>反向传播手算<\/strong><\/p>\n<ul><li>\n<span class=\"katex-inline\">\\delta_o<\/span> 先算，再往回递推。\n<\/li><li>\n每个 <span class=\"katex-inline\">\\delta<\/span> 都乘了 <span class=\"katex-inline\">\\sigma&#x27;(z)<\/span>。\n<\/li><li>\n每个权重梯度都是&quot;<span class=\"katex-inline\">\\delta<\/span> × 该权重的输入&quot;。\n<\/li><li>\n更新方向：梯度为正，参数减小。\n<\/ul>\n<h2>符号对照<\/h2>\n<table><thead><tr><th>符号<\/th><th>读法<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">\\sigma<\/span><\/td><td>sigma<\/td><td>sigmoid 函数，也常指数求和符号，按上下文区分<\/td><\/tr><tr><td><span class=\"katex-inline\">\\sum<\/span><\/td><td>求和<\/td><td>把下标范围内的项全加起来<\/td><\/tr><tr><td><span class=\"katex-inline\">\\prod<\/span><\/td><td>连乘<\/td><td>把下标范围内的项全乘起来<\/td><\/tr><tr><td><span class=\"katex-inline\">\\partial<\/span><\/td><td>偏导<\/td><td>只对一个变量求导，其余当常数<\/td><\/tr><tr><td><span class=\"katex-inline\">\\nabla<\/span><\/td><td>nabla<\/td><td>把所有偏导打包成向量<\/td><\/tr><tr><td><span class=\"katex-inline\">\\odot<\/span><\/td><td>逐元素乘<\/td><td>两个同形矩阵对应位置相乘<\/td><\/tr><tr><td><span class=\"katex-inline\">\\mathsf{T}<\/span><\/td><td>转置<\/td><td>行列互换<\/td><\/tr><tr><td><span class=\"katex-inline\">\\delta<\/span><\/td><td>delta<\/td><td>误差项，损失对打分的导数<\/td><\/tr><tr><td><span class=\"katex-inline\">\\eta<\/span><\/td><td>eta<\/td><td>学习率<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38454048209513730/神经网络-从零推透", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：函数是一台机器", "href": "#/chapter/ch01"}, {"label": "第 2 章：一条直线能干什么", "href": "#/chapter/ch02"}, {"label": "第 3 章：变化率与导数", "href": "#/chapter/ch03"}, {"label": "第 4 章：套娃函数怎么求导", "href": "#/chapter/ch04"}, {"label": "第 5 章：一堆数怎么算", "href": "#/chapter/ch05"}, {"label": "第 6 章：一个神经元", "href": "#/chapter/ch06"}, {"label": "第 7 章：为什么必须拐弯", "href": "#/chapter/ch07"}, {"label": "第 8 章：把神经元摞起来", "href": "#/chapter/ch08"}, {"label": "第 9 章：错得有多离谱", "href": "#/chapter/ch09"}, {"label": "第 10 章：下山", "href": "#/chapter/ch10"}, {"label": "第 11 章：误差怎么传回去", "href": "#/chapter/ch11"}, {"label": "第 12 章：训练完之后", "href": "#/chapter/ch12"}, {"label": "第 13 章：综合检验：手搭一个异或网络", "href": "#/chapter/ch13"}]}, {"label": "概念", "children": [{"label": "函数", "href": "#/concept/c01"}, {"label": "斜率", "href": "#/concept/c02"}, {"label": "导数", "href": "#/concept/c03"}, {"label": "链式法则", "href": "#/concept/c04"}, {"label": "点积", "href": "#/concept/c05"}, {"label": "神经元（感知机）", "href": "#/concept/c06"}, {"label": "激活函数", "href": "#/concept/c07"}, {"label": "前向传播", "href": "#/concept/c08"}, {"label": "损失函数", "href": "#/concept/c09"}, {"label": "梯度下降", "href": "#/concept/c10"}, {"label": "反向传播", "href": "#/concept/c11"}, {"label": "过拟合", "href": "#/concept/c12"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：函数是一台机器", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：一条直线能干什么", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：变化率与导数", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：套娃函数怎么求导", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：一堆数怎么算", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：一个神经元", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章：为什么必须拐弯", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章：把神经元摞起来", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章：错得有多离谱", "href": "#/quiz/ch09"}, {"label": "测验：第 10 章：下山", "href": "#/quiz/ch10"}, {"label": "测验：第 11 章：误差怎么传回去", "href": "#/quiz/ch11"}, {"label": "测验：第 12 章：训练完之后", "href": "#/quiz/ch12"}, {"label": "测验：第 13 章：综合检验：手搭一个异或网络", "href": "#/quiz/ch13"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：函数是一台机器<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：0.5 小时 | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出函数、自变量、因变量分别指什么；\n<\/li><li>\n给定一个函数，算出任意输入对应的输出；\n<\/li><li>\n把两个函数串起来，算出&quot;先过第一台机器、再过第二台&quot;的结果。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>神经网络不是一堆神秘的零件，它是一个函数：塞进去一组数，吐出来一组数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>函数就是&quot;输入定输出&quot;<\/h3>\n<p>初中课本里的函数定义是：在一个变化过程中有两个变量 <span class=\"katex-inline\">x<\/span> 和 <span class=\"katex-inline\">y<\/span>，如果给定一个 <span class=\"katex-inline\">x<\/span>，<span class=\"katex-inline\">y<\/span> 都有唯一确定的值和它对应，就说 <span class=\"katex-inline\">y<\/span> 是 <span class=\"katex-inline\">x<\/span> 的函数。<\/p>\n<p>这句话翻译成人话：<strong>你递进去一个数，它按固定规矩还你一个数，而且同一个输入不会还你两个不同的输出。<\/strong><\/p>\n<p>比如这台机器：<\/p>\n<div class=\"katex-block\">f(x) = 2x + 1<\/div>\n<p>递进去 <span class=\"katex-inline\">x=3<\/span>，它还你 <span class=\"katex-inline\">f(3)=2\\times 3+1=7<\/span>。递进去 <span class=\"katex-inline\">x=0<\/span>，还你 <span class=\"katex-inline\">1<\/span>。递进去 <span class=\"katex-inline\">x=-2<\/span>，还你 <span class=\"katex-inline\">-3<\/span>。<\/p>\n<p>这里 <span class=\"katex-inline\">x<\/span> 叫<strong>自变量<\/strong>，是你能控制的输入；<span class=\"katex-inline\">f(x)<\/span> 叫<strong>因变量<\/strong>，是机器的输出，它跟着 <span class=\"katex-inline\">x<\/span> 变。<span class=\"katex-inline\">f<\/span> 是这个机器的名字，括号里的 <span class=\"katex-inline\">x<\/span> 是&quot;往哪个口子塞&quot;。<\/p>\n<h3>机器的内部可以很简单，也可以很复杂<\/h3>\n<p><span class=\"katex-inline\">f(x)=2x+1<\/span> 的内部只干两件事：先把输入乘 2，再加 1。<\/p>\n<p>神经网络内部干的事多得多：几百个乘法、几百个加法、几次非线性弯折。但它的身份没变——仍然是一台&quot;输入定输出&quot;的机器。<\/p>\n<p>一张 28×28 的手写数字图片，有 784 个像素点。你可以把这 784 个数打包塞进网络，它吐出 10 个数，分别表示&quot;这张图是 0、1、2……9 的可能性&quot;。这就是一个函数，只不过输入是 784 个数，输出是 10 个数。<\/p>\n<h3>复合：把机器串起来<\/h3>\n<p>假设有两台机器：<\/p>\n<div class=\"katex-block\">g(x) = x^2,\\qquad f(u) = 2u + 1<\/div>\n<p>先把 <span class=\"katex-inline\">x<\/span> 塞进 <span class=\"katex-inline\">g<\/span>，得到 <span class=\"katex-inline\">u=x^2<\/span>；再把 <span class=\"katex-inline\">u<\/span> 塞进 <span class=\"katex-inline\">f<\/span>，得到 <span class=\"katex-inline\">f(u)=2u+1<\/span>。整个过程写成：<\/p>\n<div class=\"katex-block\">F(x) = f(g(x)) = 2x^2 + 1<\/div>\n<p>取 <span class=\"katex-inline\">x=3<\/span>：<span class=\"katex-inline\">g(3)=9<\/span>，<span class=\"katex-inline\">f(9)=19<\/span>，所以 <span class=\"katex-inline\">F(3)=19<\/span>。<\/p>\n<p>这种&quot;机器套机器&quot;的结构叫<strong>复合函数<\/strong>。它是第 4 章的主角，也是神经网络的基本构造方式：一层算完，结果喂给下一层，再喂给下一层。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[&quot;输入 x&quot;] --&gt; B[&quot;第一层：乘 2 加 1&quot;]\n    B --&gt; C[&quot;中间结果 u&quot;]\n    C --&gt; D[&quot;第二层：平方&quot;]\n    D --&gt; E[&quot;输出 y&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是入口，右边是出口，方框是加工步骤，箭头是数据的流向。神经网络就是把这条链拉长到几十层，每层里塞进很多个并排的加工单元。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：函数像自动售货机。投一个币（输入），按固定的内部机制，掉一罐饮料（输出）。同一个币不会有时掉可乐、有时掉矿泉水。<\/p>\n<p>这个类比在&quot;一个输入只能有一个输出&quot;这一点上成立。它失效的地方是：售货机可以卡住不出货，函数不允许——每个合法输入都必须有输出。另外，神经网络的一个输入是一整组数（比如 784 个像素），不是一枚硬币。<\/p>\n<p><strong>实例<\/strong>：设 <span class=\"katex-inline\">f(x)=3x-2<\/span>，<span class=\"katex-inline\">g(x)=x^2+1<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">f(4)=3\\times 4-2=10<\/span>\n<\/li><li>\n<span class=\"katex-inline\">g(4)=16+1=17<\/span>\n<\/li><li>\n<span class=\"katex-inline\">f(g(2))=f(5)=13<\/span>\n<\/li><li>\n<span class=\"katex-inline\">g(f(2))=g(4)=17<\/span>\n<\/ul>\n<p>注意 <span class=\"katex-inline\">f(g(2))<\/span> 和 <span class=\"katex-inline\">g(f(2))<\/span> 结果不同。串联有顺序，先过哪台机器不一样。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为&quot;函数必须有公式&quot;<\/strong>——实际上函数是一套对应规则，公式只是把规则写出来的一种方式。神经网络这个函数就没有一个简洁公式，它的规则藏在成千上万个参数里，但输入定了输出就定了，仍然符合函数的定义。<\/p>\n<p><strong>别以为 <span class=\"katex-inline\">f(x)<\/span> 表示 <span class=\"katex-inline\">f<\/span> 乘 <span class=\"katex-inline\">x<\/span><\/strong>——<span class=\"katex-inline\">f(x)<\/span> 读作&quot;<span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">x<\/span> 处的值&quot;，不是乘法。<span class=\"katex-inline\">f<\/span> 是机器名，<span class=\"katex-inline\">x<\/span> 是塞进去的东西。<\/p>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n设 <span class=\"katex-inline\">f(x)=x^2-3x<\/span>，求 <span class=\"katex-inline\">f(2)<\/span> 和 <span class=\"katex-inline\">f(-1)<\/span>。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">f(2)=4-6=-2<\/span>；<span class=\"katex-inline\">f(-1)=1+3=4<\/span>。<\/p>\n<p><strong>解析<\/strong>：把 <span class=\"katex-inline\">x<\/span> 换成具体数字，逐项算。<span class=\"katex-inline\">f(-1)<\/span> 里 <span class=\"katex-inline\">(-1)^2=1<\/span>，<span class=\"katex-inline\">-3\\times(-1)=+3<\/span>，不能漏掉负号。<\/p>\n<ol><li>\n设 <span class=\"katex-inline\">g(x)=2x<\/span>，<span class=\"katex-inline\">h(x)=x+5<\/span>。求 <span class=\"katex-inline\">h(g(3))<\/span> 与 <span class=\"katex-inline\">g(h(3))<\/span>，并说明两者为什么不同。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">h(g(3))=h(6)=11<\/span>；<span class=\"katex-inline\">g(h(3))=g(8)=16<\/span>。<\/p>\n<p><strong>解析<\/strong>：<span class=\"katex-inline\">h(g(3))<\/span> 先算内层的 <span class=\"katex-inline\">g(3)=6<\/span>，再送进 <span class=\"katex-inline\">h<\/span> 加 5；<span class=\"katex-inline\">g(h(3))<\/span> 先算 <span class=\"katex-inline\">h(3)=8<\/span>，再送进 <span class=\"katex-inline\">g<\/span> 乘 2。顺序不同，中间结果不同。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n函数 = 输入定输出的机器，同一个输入只有一个输出。\n<\/li><li>\n复合函数 = 机器串联，先内层后外层，顺序不能换。\n<\/li><li>\n神经网络就是一个输入 784 个数、输出 10 个数的复合函数。\n<\/ul>", "ch02": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：函数是一台机器<\/a><\/span><\/div><h1>第 2 章：一条直线能干什么<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：0.6 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清 <span class=\"katex-inline\">y=kx+b<\/span> 里 <span class=\"katex-inline\">k<\/span> 和 <span class=\"katex-inline\">b<\/span> 各控制什么；\n<\/li><li>\n把&quot;用直线把点分成两类&quot;写成一条判断规则；\n<\/li><li>\n把两个输入的判断规则写成 <span class=\"katex-inline\">w_1x_1+w_2x_2+b&gt;0<\/span>。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>一条直线就是一个最原始的&quot;分类器&quot;：线的一侧判 1，另一侧判 0。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>一次函数：<span class=\"katex-inline\">y=kx+b<\/span><\/h3>\n<p>初中学过的一次函数，图像是一条直线：<\/p>\n<div class=\"katex-block\">y = kx + b<\/div>\n<p><span class=\"katex-inline\">k<\/span> 叫<strong>斜率<\/strong>。它的意思是：<span class=\"katex-inline\">x<\/span> 每往右走 1 格，<span class=\"katex-inline\">y<\/span> 就变化 <span class=\"katex-inline\">k<\/span>。<span class=\"katex-inline\">k=2<\/span> 时，往右 1 格，往上 2 格；<span class=\"katex-inline\">k=-1<\/span> 时，往右 1 格，往下 1 格。<\/p>\n<p><span class=\"katex-inline\">b<\/span> 叫<strong>截距<\/strong>。它是 <span class=\"katex-inline\">x=0<\/span> 时直线穿过纵轴的高度，也就是&quot;起点&quot;。<\/p>\n<p>这两个参数一改，直线就跟着变：<span class=\"katex-inline\">k<\/span> 控制倾斜程度，<span class=\"katex-inline\">b<\/span> 控制上下平移。<\/p>\n<h3>把直线变成判断规则<\/h3>\n<p>现在换个问法。不问&quot;<span class=\"katex-inline\">x<\/span> 对应哪个 <span class=\"katex-inline\">y<\/span>&quot;，而问&quot;这个点在直线的上面还是下面&quot;。<\/p>\n<p>直线的方程是 <span class=\"katex-inline\">y=kx+b<\/span>。对平面上任意一点 <span class=\"katex-inline\">(x,y)<\/span>：<\/p>\n<ul><li>\n如果 <span class=\"katex-inline\">y &gt; kx+b<\/span>，点在直线上方；\n<\/li><li>\n如果 <span class=\"katex-inline\">y &lt; kx+b<\/span>，点在直线下方；\n<\/li><li>\n如果相等，点正好落在直线上。\n<\/ul>\n<p>把这句话整理成 <span class=\"katex-inline\">kx+b-y<\/span> 的符号，或者更常见的形式：<\/p>\n<div class=\"katex-block\">z = kx + b<\/div>\n<p><span class=\"katex-inline\">z&gt;0<\/span> 判为一类，<span class=\"katex-inline\">z&lt;0<\/span> 判为另一类。这条 <span class=\"katex-inline\">z=0<\/span> 的线就是分界线。<\/p>\n<p>到这里，&quot;直线&quot;和&quot;判断&quot;已经接上了：<strong>直线的方程不是一个用来画图的公式，它是一把尺子，量出每个点该分到哪边。<\/strong><\/p>\n<h3>两个输入的情况<\/h3>\n<p>现实里的输入往往不止一个数。比如判断一封邮件是不是垃圾邮件，可能同时看&quot;广告词出现次数&quot;和&quot;感叹号数量&quot;。<\/p>\n<p>设两个输入是 <span class=\"katex-inline\">x_1<\/span> 和 <span class=\"katex-inline\">x_2<\/span>，给每个输入配一个权重：<\/p>\n<div class=\"katex-block\">z = w_1x_1 + w_2x_2 + b<\/div>\n<p><span class=\"katex-inline\">w_1<\/span>、<span class=\"katex-inline\">w_2<\/span> 叫<strong>权重<\/strong>，意思是&quot;这个输入有多重要&quot;。<span class=\"katex-inline\">b<\/span> 叫<strong>偏置<\/strong>，它决定门槛高低。<\/p>\n<p>把 <span class=\"katex-inline\">(x_1,x_2)<\/span> 看成平面上的横纵坐标，<span class=\"katex-inline\">w_1x_1+w_2x_2+b=0<\/span> 在平面上仍然是一条直线。<span class=\"katex-inline\">z&gt;0<\/span> 的一侧判 1，<span class=\"katex-inline\">z&lt;0<\/span> 的一侧判 0。<\/p>\n<p>输入从一个变成两个，几何上从&quot;数轴上的分点&quot;升级成&quot;平面上的分界线&quot;。再往上加输入（三个、四个、784 个），分界线变成三维空间里的平面、高维空间里的超平面。名字变复杂了，干的事没变：<strong>用一个线性方程把空间切成两半。<\/strong><\/p>\n<h2>图示<\/h2>\n<div>\n<svg viewBox=\"0 0 460 320\" width=\"100%\" role=\"img\" aria-label=\"一条直线把平面分成两侧\">\n<rect x=\"40\" y=\"20\" width=\"380\" height=\"260\" fill=\"none\" stroke=\"#9ca3af\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"280\" x2=\"420\" y2=\"280\" stroke=\"#9ca3af\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"280\" x2=\"40\" y2=\"20\" stroke=\"#9ca3af\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"240\" x2=\"400\" y2=\"80\" stroke=\"#3b82f6\" stroke-width=\"2.5\"/>\n<circle cx=\"120\" cy=\"120\" r=\"5\" fill=\"#16a34a\"/>\n<circle cx=\"180\" cy=\"90\" r=\"5\" fill=\"#16a34a\"/>\n<circle cx=\"90\" cy=\"200\" r=\"5\" fill=\"#16a34a\"/>\n<circle cx=\"280\" cy=\"230\" r=\"5\" fill=\"#dc2626\"/>\n<circle cx=\"340\" cy=\"200\" r=\"5\" fill=\"#dc2626\"/>\n<circle cx=\"380\" cy=\"250\" r=\"5\" fill=\"#dc2626\"/>\n<text x=\"250\" y=\"70\" font-size=\"13\" fill=\"#6b7280\">z &gt; 0 一侧<\/text>\n<text x=\"250\" y=\"255\" font-size=\"13\" fill=\"#6b7280\">z &lt; 0 一侧<\/text>\n<text x=\"392\" y=\"160\" font-size=\"13\" fill=\"#3b82f6\">z = 0<\/text>\n<\/svg>\n<\/div>\n<p>看图说明：蓝线是 <span class=\"katex-inline\">z=0<\/span>。绿点落在 <span class=\"katex-inline\">z&gt;0<\/span> 的一侧，红点落在 <span class=\"katex-inline\">z&lt;0<\/span> 的一侧。只要给出权重和偏置，这条线的位置和角度就定了，所有点的分类结果也就定了。图里没有画出坐标刻度，因为重点不是具体数值，而是&quot;一条线把平面切成两半&quot;这个结构。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：直线分类像机场安检的地面标线。线左边排队、线右边直接通过，站在哪边由一条线决定。权重决定这条线往哪个方向斜，偏置决定它往哪边挪。<\/p>\n<p>类比失效的地方：现实安检线是人画的，神经网络里的这条线是<strong>算出来的<\/strong>——第 10 章会讲，它靠调整 <span class=\"katex-inline\">w<\/span> 和 <span class=\"katex-inline\">b<\/span> 一点点挪到合适的位置。<\/p>\n<p><strong>实例<\/strong>：设 <span class=\"katex-inline\">w_1=1<\/span>，<span class=\"katex-inline\">w_2=1<\/span>，<span class=\"katex-inline\">b=-1.5<\/span>，规则是 <span class=\"katex-inline\">z=x_1+x_2-1.5&gt;0<\/span> 判 1。<\/p>\n<table><thead><tr><th><span class=\"katex-inline\">x_1<\/span><\/th><th><span class=\"katex-inline\">x_2<\/span><\/th><th><span class=\"katex-inline\">z<\/span><\/th><th>判断<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td><span class=\"katex-inline\">-1.5<\/span><\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td><span class=\"katex-inline\">-0.5<\/span><\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td><span class=\"katex-inline\">-0.5<\/span><\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td><span class=\"katex-inline\">0.5<\/span><\/td><td>1<\/td><\/tr><\/tbody><\/table>\n<p>这四个点正好是&quot;与&quot;运算：两个都为 1 才输出 1。换一个偏置 <span class=\"katex-inline\">b=-0.5<\/span>，规则变成 <span class=\"katex-inline\">x_1+x_2-0.5&gt;0<\/span>，表格变成：<\/p>\n<table><thead><tr><th><span class=\"katex-inline\">x_1<\/span><\/th><th><span class=\"katex-inline\">x_2<\/span><\/th><th><span class=\"katex-inline\">z<\/span><\/th><th>判断<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td><span class=\"katex-inline\">-0.5<\/span><\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td><span class=\"katex-inline\">0.5<\/span><\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td><span class=\"katex-inline\">0.5<\/span><\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td><span class=\"katex-inline\">1.5<\/span><\/td><td>1<\/td><\/tr><\/tbody><\/table>\n<p>这就是&quot;或&quot;运算。同一组权重，只改偏置，分类规则就从&quot;与&quot;变成&quot;或&quot;。偏置的作用在这里看得很清楚：它挪动门槛。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为直线只能用来&quot;拟合数据点&quot;<\/strong>——直线也能用来做判断。拟合是&quot;让线穿过点&quot;，分类是&quot;让线把点分开&quot;。神经网络训练时干的是后者，只不过它调整的不止一条线。<\/p>\n<p><strong>别以为权重越大越好<\/strong>——权重只表示&quot;这个输入在打分里占多大比重&quot;，不是质量评分。所有权重同时放大 10 倍，判断结果不变（因为 <span class=\"katex-inline\">z<\/span> 的正负号不变），只是 <span class=\"katex-inline\">z<\/span> 的数值变大。<\/p>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n直线 <span class=\"katex-inline\">y=2x-3<\/span> 的斜率与截距分别是多少？<span class=\"katex-inline\">x=1<\/span> 时 <span class=\"katex-inline\">y<\/span> 等于多少？\n<\/ol>\n<p><strong>答案<\/strong>：斜率 <span class=\"katex-inline\">k=2<\/span>，截距 <span class=\"katex-inline\">b=-3<\/span>；<span class=\"katex-inline\">y=2\\times 1-3=-1<\/span>。<\/p>\n<p><strong>解析<\/strong>：对照 <span class=\"katex-inline\">y=kx+b<\/span> 的格式读系数。截距是 <span class=\"katex-inline\">x=0<\/span> 时的 <span class=\"katex-inline\">y<\/span> 值，即 <span class=\"katex-inline\">-3<\/span>，不是 <span class=\"katex-inline\">3<\/span>。<\/p>\n<ol><li>\n规则 <span class=\"katex-inline\">z=2x_1-x_2+1<\/span>，判断点 <span class=\"katex-inline\">(1,3)<\/span> 属于 <span class=\"katex-inline\">z&gt;0<\/span> 还是 <span class=\"katex-inline\">z&lt;0<\/span> 一侧？\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">z=2\\times 1-3+1=0<\/span>，点正好落在分界线上，不属于任何一侧。<\/p>\n<p><strong>解析<\/strong>：分别代入再算。<span class=\"katex-inline\">z=0<\/span> 是边界情况，实际使用时会约定归到某一类，或单独处理。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n<span class=\"katex-inline\">y=kx+b<\/span>：<span class=\"katex-inline\">k<\/span> 管倾斜，<span class=\"katex-inline\">b<\/span> 管上下平移。\n<\/li><li>\n分类规则 <span class=\"katex-inline\">z=w_1x_1+w_2x_2+b<\/span>，<span class=\"katex-inline\">z<\/span> 的符号决定类别。\n<\/li><li>\n输入变多，分界线从点升级成线、面、超平面，本质仍是&quot;切一刀&quot;。\n<\/ul>", "ch03": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：函数是一台机器<\/a><\/span> · <span class=\"prereq-soft\"><span class=\"prereq-tag\">荐<\/span> <a href=\"#/chapter/ch02\">第 2 章：一条直线能干什么<\/a><\/span><\/div><h1>第 3 章：变化率与导数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1 小时 | <strong>前置<\/strong>：第 1、2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n算出函数在两点之间的平均变化率；\n<\/li><li>\n用 <span class=\"katex-inline\">h<\/span> 越来越小的办法逼近某一点的瞬时变化率；\n<\/li><li>\n自己推出 <span class=\"katex-inline\">(x^2)&#x27;=2x<\/span>，并会用几条基本求导法则。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>导数就是&quot;某一瞬间，输入动一点点，输出跟着动多少&quot;的比例。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>先算&quot;一段路&quot;的平均速度<\/h3>\n<p>一辆车 2 小时开了 120 公里，平均速度是 <span class=\"katex-inline\">120\\div 2=60<\/span> 公里每小时。这是<strong>平均变化率<\/strong>：一段区间内，输出变化量除以输入变化量。<\/p>\n<p>换成函数语言。函数 <span class=\"katex-inline\">f(x)<\/span> 在 <span class=\"katex-inline\">x<\/span> 从 <span class=\"katex-inline\">a<\/span> 变到 <span class=\"katex-inline\">a+h<\/span> 的过程中：<\/p>\n<div class=\"katex-block\">\\text{平均变化率}=\\frac{f(a+h)-f(a)}{h}<\/div>\n<p>分子是输出的变化量，分母是输入的变化量。<span class=\"katex-inline\">h<\/span> 就是输入往前挪的那一小步。<\/p>\n<h3>把&quot;一段&quot;缩成&quot;一点&quot;<\/h3>\n<p>平均速度有个问题：它只说整段路的平均情况。中间可能有一段开到 100，有一段堵着走 20。想知道某一刻的速度，得把区间缩短。<\/p>\n<p>拿 <span class=\"katex-inline\">f(x)=x^2<\/span> 在 <span class=\"katex-inline\">x=3<\/span> 附近试一下：<\/p>\n<table><thead><tr><th><span class=\"katex-inline\">h<\/span><\/th><th><span class=\"katex-inline\">\\dfrac{f(3+h)-f(3)}{h}<\/span><\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>7<\/td><\/tr><tr><td>0.5<\/td><td>6.5<\/td><\/tr><tr><td>0.1<\/td><td>6.1<\/td><\/tr><tr><td>0.01<\/td><td>6.01<\/td><\/tr><tr><td>0.001<\/td><td>6.001<\/td><\/tr><\/tbody><\/table>\n<p><span class=\"katex-inline\">h<\/span> 越小，结果越靠近 6。<span class=\"katex-inline\">h<\/span> 缩到 0 的时候这个式子没有定义（分母不能为 0），但它逼近的那个数有明确的意义：<strong><span class=\"katex-inline\">x=3<\/span> 这一点的瞬时变化率<\/strong>，记作 <span class=\"katex-inline\">f&#x27;(3)=6<\/span>。<\/p>\n<p>这个&quot;无限逼近&quot;的过程叫<strong>极限<\/strong>。这里不追求严格定义，只需要接受一件事：<span class=\"katex-inline\">h<\/span> 可以任意小，结果会稳定到一个确定的数。<\/p>\n<h3>导数的定义<\/h3>\n<p>函数 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">x<\/span> 处的<strong>导数<\/strong>记作 <span class=\"katex-inline\">f&#x27;(x)<\/span>：<\/p>\n<div class=\"katex-block\">f'(x)=\\lim_{h\\to 0}\\frac{f(x+h)-f(x)}{h}<\/div>\n<p><span class=\"katex-inline\">\\lim_{h\\to 0}<\/span> 读作&quot;当 <span class=\"katex-inline\">h<\/span> 趋向于 0 时的极限&quot;。这个式子的意思：让 <span class=\"katex-inline\">h<\/span> 无限靠近 0，看这个比值稳定在哪。<\/p>\n<p>几何上，<span class=\"katex-inline\">\\dfrac{f(x+h)-f(x)}{h}<\/span> 是过 <span class=\"katex-inline\">(x,f(x))<\/span> 和 <span class=\"katex-inline\">(x+h,f(x+h))<\/span> 两点的<strong>割线<\/strong>斜率。<span class=\"katex-inline\">h\\to 0<\/span> 时，第二个点贴着第一个点，割线变成<strong>切线<\/strong>，导数就是切线的斜率。<\/p>\n<div>\n<svg viewBox=\"0 0 460 300\" width=\"100%\" role=\"img\" aria-label=\"割线逼近切线\">\n<line x1=\"50\" y1=\"250\" x2=\"430\" y2=\"250\" stroke=\"#9ca3af\"/>\n<line x1=\"50\" y1=\"250\" x2=\"50\" y2=\"40\" stroke=\"#9ca3af\"/>\n<path d=\"M 90 210 Q 220 60 400 190\" fill=\"none\" stroke=\"#6b7280\" stroke-width=\"2\"/>\n<line x1=\"150\" y1=\"176\" x2=\"320\" y2=\"112\" stroke=\"#9ca3af\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/>\n<line x1=\"210\" y1=\"160\" x2=\"330\" y2=\"250\" stroke=\"#3b82f6\" stroke-width=\"2.5\"/>\n<circle cx=\"210\" cy=\"160\" r=\"4.5\" fill=\"#3b82f6\"/>\n<circle cx=\"320\" cy=\"112\" r=\"4\" fill=\"#9ca3af\"/>\n<text x=\"325\" y=\"105\" font-size=\"12\" fill=\"#6b7280\">x+h<\/text>\n<text x=\"180\" y=\"180\" font-size=\"12\" fill=\"#3b82f6\">x<\/text>\n<text x=\"300\" y=\"230\" font-size=\"12\" fill=\"#3b82f6\">切线<\/text>\n<text x=\"170\" y=\"150\" font-size=\"12\" fill=\"#6b7280\">割线<\/text>\n<\/svg>\n<\/div>\n<p>看图说明：灰线是函数曲线，虚线是连接两点的割线，蓝线是把两点无限拉近后得到的切线。切线的斜率就是该点的导数。<\/p>\n<h3>亲手推 <span class=\"katex-inline\">(x^2)&#x27;=2x<\/span><\/h3>\n<p>不背公式，推一遍。按定义：<\/p>\n<div class=\"katex-block\">f'(x)=\\lim_{h\\to 0}\\frac{(x+h)^2-x^2}{h}<\/div>\n<p>第一步，展开 <span class=\"katex-inline\">(x+h)^2<\/span>：<\/p>\n<div class=\"katex-block\">(x+h)^2=x^2+2xh+h^2<\/div>\n<p>第二步，代回分子：<\/p>\n<div class=\"katex-block\">(x^2+2xh+h^2)-x^2=2xh+h^2<\/div>\n<p>第三步，除以 <span class=\"katex-inline\">h<\/span>（<span class=\"katex-inline\">h\\neq 0<\/span>，可以约）：<\/p>\n<div class=\"katex-block\">\\frac{2xh+h^2}{h}=2x+h<\/div>\n<p>第四步，让 <span class=\"katex-inline\">h\\to 0<\/span>，<span class=\"katex-inline\">h<\/span> 这一项消失：<\/p>\n<div class=\"katex-block\">f'(x)=2x<\/div>\n<p>验证：<span class=\"katex-inline\">x=3<\/span> 时 <span class=\"katex-inline\">2x=6<\/span>，和上面的数值表对上了。<\/p>\n<h3>几条够用的求导法则<\/h3>\n<table><thead><tr><th>函数<\/th><th>导数<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">C<\/span>（常数）<\/td><td><span class=\"katex-inline\">0<\/span><\/td><td>水平线，不升不降<\/td><\/tr><tr><td><span class=\"katex-inline\">x<\/span><\/td><td><span class=\"katex-inline\">1<\/span><\/td><td>输入涨 1，输出涨 1<\/td><\/tr><tr><td><span class=\"katex-inline\">x^n<\/span><\/td><td><span class=\"katex-inline\">nx^{n-1}<\/span><\/td><td>幂函数，<span class=\"katex-inline\">n<\/span> 可以是 2、3、0.5<\/td><\/tr><tr><td><span class=\"katex-inline\">Cf(x)<\/span><\/td><td><span class=\"katex-inline\">Cf&#x27;(x)<\/span><\/td><td>常数倍可以提到外面<\/td><\/tr><tr><td><span class=\"katex-i
