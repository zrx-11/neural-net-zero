<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>神经网络：从一条直线推到反向传播</title>
<link rel="stylesheet" href="https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/dist/vis-network.min.css">
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.page table{display:block;overflow-x:auto;max-width:100%}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>神经网络：从一条直线推到反向传播</h1>
    <div class="sub">初中数学起步，不跳步，每一格数字都能验算</div>

</div>

ft"}]}, {"id": "ch04", "title": "第 4 章：套娃函数怎么求导", "file": "chapters/ch04-套娃函数怎么求导.md", "difficulty": 3, "prerequisites": [{"id": "ch03", "type": "hard"}, {"id": "ch01", "type": "soft"}]}, {"id": "ch05", "title": "第 5 章：一堆数怎么算", "file": "chapters/ch05-向量点积与矩阵.md", "difficulty": 2, "prerequisites": [{"id": "ch02", "type": "hard"}]}, {"id": "ch06", "title": "第 6 章：一个神经元", "file": "chapters/ch06-一个神经元.md", "difficulty": 2, "prerequisites": [{"id": "ch02", "type": "hard"}, {"id": "ch05", "type": "hard"}]}, {"id": "ch07", "title": "第 7 章：为什么必须拐弯", "file": "chapters/ch07-为什么必须拐弯.md", "difficulty": 3, "prerequisites": [{"id": "ch04", "type": "hard"}, {"id": "ch05", "type": "hard"}]}, {"id": "ch08", "title": "第 8 章：把神经元摞起来", "file": "chapters/ch08-把神经元摞起来.md", "difficulty": 2, "prerequisites": [{"id": "ch06", "type": "hard"}, {"id": "ch07", "type": "hard"}]}, {"id": "ch09", "title": "第 9 章：错得有多离谱", "file": "chapters/ch09-错得有多离谱.md", "difficulty": 2, "prerequisites": [{"id": "ch08", "type": "hard"}]}, {"id": "ch10", "title": "第 10 章：下山", "file": "chapters/ch10-下山.md", "difficulty": 2, "prerequisites": [{"id": "ch03", "type": "hard"}, {"id": "ch09", "type": "hard"}]}, {"id": "ch11", "title": "第 11 章：误差怎么传回去", "file": "chapters/ch11-误差怎么传回去.md", "difficulty": 3, "prerequisites": [{"id": "ch04", "type": "hard"}, {"id": "ch07", "type": "hard"}, {"id": "ch09", "type": "hard"}, {"id": "ch10", "type": "hard"}]}, {"id": "ch12", "title": "第 12 章：训练完之后", "file": "chapters/ch12-训练完之后.md", "difficulty": 2, "prerequisites": [{"id": "ch11", "type": "soft"}, {"id": "ch09", "type": "soft"}]}, {"id": "ch13", "title": "第 13 章：综合检验：手搭一个异或网络", "file": "chapters/ch13-综合检验手搭异或网络.md", "difficulty": 3, "prerequisites": [{"id": "ch06", "type": "hard"}, {"id": "ch08", "type": "hard"}, {"id": "ch11", "type": "soft"}]}], "concepts": [{"id": "c01", "title": "函数", "file": "concepts/c01-函数.md", "chapterIds": ["ch01"], "difficulty": "基础", "prerequisites": []}, {"id": "c02", "title": "斜率", "file": "concepts/c02-斜率.md", "chapterIds": ["ch02", "ch03"], "difficulty": "基础", "prerequisites": [{"id": "c01", "type": "hard"}]}, {"id": "c03", "title": "导数", "file": "concepts/c03-导数.md", "chapterIds": ["ch03", "ch10", "ch11"], "difficulty": "进阶", "prerequisites": [{"id": "c02", "type": "hard"}]}, {"id": "c04", "title": "链式法则", "file": "concepts/c04-链式法则.md", "chapterIds": ["ch04", "ch07", "ch11"], "difficulty": "高难", "prerequisites": [{"id": "c03", "type": "hard"}], "depthFragment": "concepts/c04-depth-链式法则为什么是乘.md"}, {"id": "c05", "title": "点积", "file": "concepts/c05-点积.md", "chapterIds": ["ch05", "ch06"], "difficulty": "基础", "prerequisites": [{"id": "c01", "type": "soft"}]}, {"id": "c06", "title": "神经元（感知机）", "file": "concepts/c06-神经元.md", "chapterIds": ["ch06", "ch08", "ch13"], "difficulty": "进阶", "prerequisites": [{"id": "c05", "type": "hard"}, {"id": "c02", "type": "hard"}]}, {"id": "c07", "title": "激活函数", "file": "concepts/c07-激活函数.md", "chapterIds": ["ch07", "ch08", "ch11"], "difficulty": "进阶", "prerequisites": [{"id": "c04", "type": "hard"}]}, {"id": "c08", "title": "前向传播", "file": "concepts/c08-前向传播.md", "chapterIds": ["ch08", "ch11"], "difficulty": "进阶", "prerequisites": [{"id": "c06", "type": "hard"}, {"id": "c07", "type": "hard"}]}, {"id": "c09", "title": "损失函数", "file": "concepts/c09-损失函数.md", "chapterIds": ["ch09", "ch10", "ch11"], "difficulty": "基础", "prerequisites": [{"id": "c08", "type": "hard"}]}, {"id": "c10", "title": "梯度下降", "file": "concepts/c10-梯度下降.md", "chapterIds": ["ch10", "ch11"], "difficulty": "进阶", "prerequisites": [{"id": "c03", "type": "hard"}, {"id": "c09", "type": "hard"}]}, {"id": "c11", "title": "反向传播", "file": "concepts/c11-反向传播.md", "chapterIds": ["ch11"], "difficulty": "高难", "prerequisites": [{"id": "c04", "type": "hard"}, {"id": "c07", "type": "hard"}, {"id": "c09", "type": "soft"}], "depthFragment": "concepts/c11-depth-反向传播的每一步.md"}, {"id": "c12", "title": "过拟合", "file": "concepts/c12-过拟合.md", "chapterIds": ["ch12"], "difficulty": "进阶", "prerequisites": [{"id": "c09", "type": "soft"}, {"id": "c10", "type": "soft"}]}], "glossary": [{"term": "函数", "def": "输入定输出的对应规则，每个输入对应唯一输出。", "chapterId": "ch01"}, {"term": "自变量", "def": "函数里可以自由取值的输入。", "chapterId": "ch01"}, {"term": "因变量", "def": "随自变量变化而变化的输出。", "chapterId": "ch01"}, {"term": "复合函数", "def": "把一个函数的输出当作另一个函数的输入，机器套机器。", "chapterId": "ch01"}, {"term": "斜率", "def": "横着走一格，竖着变多少，衡量倾斜程度。", "chapterId": "ch02"}, {"term": "截距", "def": "直线与纵轴交点的纵坐标，即 x=0 时的 y 值。", "chapterId": "ch02"}, {"term": "权重", "def": "给某个输入分配的乘数，表示这个输入在打分中的比重。", "chapterId": "ch02"}, {"term": "偏置", "def": "加权和之外额外加的一个数，控制判断门槛的高低。", "chapterId": "ch02"}, {"term": "平均变化率", "def": "一段区间内输出变化量除以输入变化量。", "chapterId": "ch03"}, {"term": "极限", "def": "让某个量无限靠近一个值时，表达式稳定到的那个数。", "chapterId": "ch03"}, {"term": "导数", "def": "函数在某一点的瞬时变化率，等于该点切线斜率。", "chapterId": "ch03"}, {"term": "切线", "def": "曲线上某点附近与曲线最贴近的直线。", "chapterId": "ch03"}, {"term": "幂法则", "def": "(x^n)' = n x^(n-1)，幂函数的求导规则。", "chapterId": "ch03"}, {"term": "链式法则", "def": "复合函数求导等于外层导数乘内层导数。", "chapterId": "ch04"}, {"term": "向量", "def": "按顺序排好的一组数，作为一个整体参与运算。", "chapterId": "ch05"}, {"term": "维数", "def": "向量里包含的数的个数。", "chapterId": "ch05"}, {"term": "点积", "def": "两个向量对应相乘再相加，结果是一个数。", "chapterId": "ch05"}, {"term": "矩阵", "def": "按行列排布的一堆数，可看作多个向量叠起来。", "chapterId": "ch05"}, {"term": "矩阵乘法", "def": "左边矩阵的每一行与右边向量或列做点积。", "chapterId": "ch05"}, {"term": "神经元", "def": "加权求和后过激活函数的计算单元。", "chapterId": "ch06"}, {"term": "感知机", "def": "使用阶跃函数的最早期神经元模型。", "chapterId": "ch06"}, {"term": "阶跃函数", "def": "输入大于 0 输出 1，否则输出 0 的开关式函数。", "chapterId": "ch06"}, {"term": "分界线", "def": "把平面分成两部分的直线，对应 z=0 的位置。", "chapterId": "ch06"}, {"term": "法向量", "def": "垂直于某条直线或平面的向量。", "chapterId": "ch06"}, {"term": "异或", "def": "两个输入不同时输出 1，相同时输出 0 的运算。", "chapterId": "ch06"}, {"term": "激活函数", "def": "加权求和之后加的非线性函数。", "chapterId": "ch07"}, {"term": "sigmoid", "def": "把任意实数压到 (0,1) 区间的 S 形函数。", "chapterId": "ch07"}, {"term": "ReLU", "def": "max(0,z)，负数输出 0，正数原样输出。", "chapterId": "ch07"}, {"term": "梯度消失", "def": "反向传播连乘小导数，导致浅层梯度趋近 0。", "chapterId": "ch07"}, {"term": "前向传播", "def": "输入逐层经过矩阵乘、偏置、激活，算到输出。", "chapterId": "ch08"}, {"term": "隐藏层", "def": "输入和输出之间的层，其值没有直接标签。", "chapterId": "ch08"}, {"term": "参数", "def": "网络里可以被训练调整的数，包括权重和偏置。", "chapterId": "ch08"}, {"term": "损失函数", "def": "衡量预测与真实差距的函数，越小越好。", "chapterId": "ch09"}, {"term": "平方损失", "def": "预测与真实之差的平方。", "chapterId": "ch09"}, {"term": "均方误差", "def": "所有样本平方损失的平均值。", "chapterId": "ch09"}, {"term": "交叉熵", "def": "分类任务常用的损失，对自信地答错惩罚极重。", "chapterId": "ch09"}, {"term": "梯度", "def": "损失对所有参数偏导组成的向量，指向上升最快方向。", "chapterId": "ch10"}, {"term": "梯度下降", "def": "沿梯度反方向按学习率更新参数。", "chapterId": "ch10"}, {"term": "学习率", "def": "每次更新沿梯度方向走多远，记作 eta。", "chapterId": "ch10"}, {"term": "超参数", "def": "人设定的、不被梯度更新的参数，如学习率、批大小。", "chapterId": "ch10"}, {"term": "反向传播", "def": "从损失出发，用链式法则一次算出全部参数梯度。", "chapterId": "ch11"}, {"term": "误差项 delta", "def": "损失对某一层激活前打分的偏导。", "chapterId": "ch11"}, {"term": "epoch", "def": "把整个训练集完整过一遍。", "chapterId": "ch12"}, {"term": "batch", "def": "一次参数更新所使用的样本数量。", "chapterId": "ch12"}, {"term": "mini-batch", "def": "取一小批样本估计梯度并更新，介于 SGD 与全量之间。", "chapterId": "ch12"}, {"term": "过拟合", "def": "训练集表现好、新数据表现差，模型记住了噪声。", "chapterId": "ch12"}, {"term": "正则化", "def": "在损失里加大权重惩罚，限制模型过度拟合。", "chapterId": "ch12"}, {"term": "Dropout", "def": "训练时随机丢弃部分神经元输出，减少相互依赖。", "chapterId": "ch12"}, {"term": "早停", "def": "验证损失开始上升时停止训练。", "chapterId": "ch12"}, {"term": "数据增强", "def": "对训练样本做翻转、裁剪、加噪等变换，扩充数据。", "chapterId": "ch12"}, {"term": "CNN", "def": "卷积神经网络，用滑动卷积核共享权重，适合图像。", "chapterId": "ch12"}, {"term": "RNN", "def": "循环神经网络，按时间步传递隐藏状态，适合序列。", "chapterId": "ch12"}, {"term": "Transformer", "def": "以注意力机制为核心的网络结构，适合长距离依赖。", "chapterId": "ch12"}, {"term": "注意力机制", "def": "让每个位置直接按相关性聚合其他位置的信息。", "chapterId": "ch12"}, {"term": "雅可比矩阵", "def": "一个向量函数对所有输入分量的偏导排成的矩阵。", "chapterId": "ch11"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "q01", "chapterId": "ch01", "type": "single", "question": "f(x)=2x+3，f(4) 等于多少？", "options": ["11", "8", "14", "10"], "answer": 0, "explain": "把 x=4 代入：2×4+3=11。", "relatedConceptId": "c01"}, {"id": "q02", "chapterId": "ch01", "type": "single", "question": "计算 f(g(2)) 时，应该先算谁？", "options": ["先算外层 f", "先算内层 g", "两个同时算", "顺序无所谓"], "answer": 1, "explain": "复合函数从里往外算：先算 g(2)，把结果喂给 f。", "relatedConceptId": "c01"}, {"id": "q03", "chapterId": "ch02", "type": "single", "question": "直线 y=-2x+5 的斜率是多少？", "options": ["-2", "2", "5", "-5"], "answer": 0, "explain": "对照 y=kx+b，k=-2，b=5。", "relatedConceptId": "c02"}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "规则 z=2x1+x2-3，点 (1,1) 在哪里？", "options": ["z>0 一侧", "z<0 一侧", "正好在 z=0 上", "无法计算"], "answer": 2, "explain": "2×1+1-3=0，点落在分界线上。", "relatedConceptId": "c02"}, {"id": "q05", "chapterId": "ch03", "type": "single", "question": "f(x)=x² 在 x=4 处的导数是多少？", "options": ["4", "8", "16", "2"], "answer": 1, "explain": "(x²)'=2x，代入 x=4 得 8。", "relatedConceptId": "c03"}, {"id": "q06", "chapterId": "ch03", "type": "single", "question": "f(x)=x² 在区间 [2, 2.1] 上的平均变化率是多少？", "options": ["4.1", "4", "4.2", "8.1"], "answer": 0, "explain": "(2.1²-2²)/0.1=(4.41-4)/0.1=4.1。", "relatedConceptId": "c03"}, {"id": "q07", "chapterId": "ch04", "type": "single", "question": "y=(3x+1)² 的导数是什么？", "options": ["6(3x+1)", "2(3x+1)", "18x+1", "3(3x+1)²"], "answer": 0, "explain": "外层导数 2(3x+1)，内层导数 3，相乘得 6(3x+1)，展开为 18x+6。", "relatedConceptId": "c04"}, {"id": "q08", "chapterId": "ch04", "type": "single", "question": "链式法则为什么是相乘而不是相加？", "options": ["因为导数可以相加", "因为变化率沿链条传导，中间变化量被约掉", "因为外层函数更大", "因为乘法计算更快"], "answer": 1, "explain": "Δy/Δx=(Δy/Δu)(Δu/Δx)，中间的 Δu 在分子分母各出现一次被约掉。", "relatedConceptId": "c04"}, {"id": "q09", "chapterId": "ch05", "type": "single", "question": "向量 (1,2) 与 (3,-1) 的点积是多少？", "options": ["1", "5", "-1", "4"], "answer": 0, "explain": "1×3+2×(-1)=3-2=1。", "relatedConceptId": "c05"}, {"id": "q10", "chapterId": "ch05", "type": "blank", "question": "矩阵 [[2,1],[0,3]] 乘向量 [1,2]，结果的第一个分量是多少？", "answer": "4", "explain": "第一行点积：2×1+1×2=4。", "relatedConceptId": "c05"}, {"id": "q11", "chapterId": "ch06", "type": "single", "question": "单个神经元可以完成下面哪个运算？", "options": ["异或", "与运算", "同或", "任意分类"], "answer": 1, "explain": "单条直线能分开与运算的两类点，异或不能。", "relatedConceptId": "c06"}, {"id": "q12", "chapterId": "ch06", "type": "single", "question": "w=(1,1)、b=-0.5，阶跃判断 z>0 输出 1，实现的是哪个运算？", "options": ["与", "或", "非", "异或"], "answer": 1, "explain": "只有 (0,0) 时 z=-0.5 输出 0，其余都输出 1，这是或。", "relatedConceptId": "c06"}, {"id": "q13", "chapterId": "ch07", "type": "single", "question": "两层不带激活函数的线性网络，等价于什么？", "options": ["两层非线性网络", "一层线性变换", "无穷层网络", "无法计算"], "answer": 1, "explain": "W2(W1x+b1)+b2=(W2W1)x+(...)，仍是线性变换。", "relatedConceptId": "c07"}, {"id": "q14", "chapterId": "ch07", "type": "single", "question": "sigmoid 在 z=0 处的导数是多少？", "options": ["0", "0.25", "0.5", "1"], "answer": 1, "explain": "σ(0)=0.5，σ'(0)=0.5×(1-0.5)=0.25。", "relatedConceptId": "c07"}, {"id": "q15", "chapterId": "ch07", "type": "single", "question": "ReLU(-3) 等于多少？", "options": ["-3", "0", "3", "1"], "answer": 1, "explain": "ReLU(z)=max(0,z)，负数输出 0。", "relatedConceptId": "c07"}, {"id": "q16", "chapterId": "ch08", "type": "single", "question": "2 个输入、2 个隐藏神经元、1 个输出的全连接网络，有多少个可训练参数？", "options": ["6", "8", "9", "12"], "answer": 2, "explain": "隐藏层 2×2=4 个权重加 2 个偏置，输出层 2 个权重加 1 个偏置，共 9 个。", "relatedConceptId": "c08"}, {"id": "q17", "chapterId": "ch08", "type": "blank", "question": "z1=0.5×1.0+(-0.3)×0.5+0.1，z1 等于多少？", "answer": "0.45", "explain": "0.5-0.15+0.1=0.45。", "relatedConceptId": "c08"}, {"id": "q18", "chapterId": "ch09", "type": "single", "question": "真实标签 y=0，预测 ŷ=0.5，平方损失是多少？", "options": ["0.25", "0.5", "0.05", "1"], "answer": 0, "explain": "(0-0.5)²=0.25。", "relatedConceptId": "c09"}, {"id": "q19", "chapterId": "ch09", "type": "single", "question": "为什么平方损失不用绝对值？下面哪个理由成立？", "options": ["绝对值计算更慢", "绝对值在 0 处不可导", "绝对值不能避免正负抵消", "绝对值会放大错误"], "answer": 1, "explain": "|x| 在 0 处左导 -1、右导 +1，不可导，梯度下降会卡住。", "relatedConceptId": "c09"}, {"id": "q20", "chapterId": "ch10", "type": "single", "question": "L(w)=(w-2)²，从 w=4 出发，学习率 0.1，走一步后 w 是多少？", "options": ["3.6", "3.8", "3.2", "2.0"], "answer": 0, "explain": "梯度 2(4-2)=4，w=4-0.1×4=3.6。", "relatedConceptId": "c10"}, {"id": "q21", "chapterId": "ch10", "type": "single", "question": "学习率过大会发生什么？", "options": ["收敛更快", "震荡或发散", "梯度消失", "参数变成 0"], "answer": 1, "explain": "步子太大跨过谷底，可能来回震荡甚至越走越远。", "relatedConceptId": "c10"}, {"id": "q22", "chapterId": "ch11", "type": "single", "question": "平方损失配 sigmoid 输出层，δo 的公式是哪个？", "options": ["2(ŷ-y)ŷ(1-ŷ)", "(ŷ-y)", "2(ŷ-y)", "ŷ(1-ŷ)"], "answer": 0, "explain": "损失对 ŷ 求导得 2(ŷ-y)，再乘 sigmoid 导数 ŷ(1-ŷ)。", "relatedConceptId": "c11"}, {"id": "q23", "chapterId": "ch11", "type": "single", "question": "隐藏层 δ1 的公式里乘了 v1，v1 是什么？", "options": ["激活函数的值", "输出层连到 h1 的权重", "输入 x1", "学习率"], "answer": 1, "explain": "h1 通过 zo=v1h1+v2h2+bo 影响输出，所以要乘 v1。", "relatedConceptId": "c11"}, {"id": "q24", "chapterId": "ch11", "type": "single", "question": "某个参数的梯度为正，更新时应该怎么调？", "options": ["调大", "调小", "不变", "随机"], "answer": 1, "explain": "梯度为正表示增大参数会让损失增大，所以减小参数。", "relatedConceptId": "c11"}, {"id": "q25", "chapterId": "ch11", "type": "single", "question": "某个权重的梯度等于该层的 δ 乘以什么？", "options": ["这个权重的输入", "学习率", "损失值", "激活函数"], "answer": 0, "explain": "z 对 w 的偏导就是 w 的输入，所以梯度 = δ × 输入。", "relatedConceptId": "c11"}, {"id": "q26", "chapterId": "ch12", "type": "single", "question": "下面哪个是过拟合的典型信号？", "options": ["训练损失下降，验证损失上升", "训练损失上升，验证损失下降", "两者都上升", "两者都下降"], "answer": 0, "explain": "模型开始记训练集细节，训练损失继续降，但换数据就变差。", "relatedConceptId": "c12"}, {"id": "q27", "chapterId": "ch12", "type": "single", "question": "Dropout 的作用是什么？", "options": ["训练时随机丢弃部分神经元，减少相互依赖", "永久删除神经元", "增加网络层数", "提高学习率"], "answer": 0, "explain": "随机丢弃逼网络不要依赖少数特定神经元，属于正则化手段。", "relatedConceptId": "c12"}, {"id": "q28", "chapterId": "ch13", "type": "single", "question": "本教程的异或网络里，两个隐藏神经元分别负责什么？", "options": ["都算与", "一个算或，一个算与", "都算或", "都不参与"], "answer": 1, "explain": "h1 算 OR，h2 算 AND，输出层做 OR 且非 AND。", "relatedConceptId": "c06"}, {"id": "q29", "chapterId": "ch13", "type": "single", "question": "隐藏层在异或问题里起的关键作用是什么？", "options": ["再切一刀", "把数据换到新坐标，使两类点可分", "减少参数", "增大损失"], "answer": 1, "explain": "隐藏层把四个点映射到 (h1,h2)，原本交错的两类在新坐标下可被一条线分开。", "relatedConceptId": "c08"}, {"id": "q30", "chapterId": "__all__", "type": "single", "question": "一次正确的反向传播加参数更新之后，损失通常会怎样？", "options": ["下降", "上升", "不变", "立刻变成 0"], "answer": 0, "explain": "更新沿梯度反方向，学习率合适时损失下降。本教程例子从 0.175555 降到 0.140693。", "relatedConceptId": "c11"}, {"id": "q31", "chapterId": "__all__", "type": "single", "question": "下面哪个不能直接当作训练目标？", "options": ["平方损失", "交叉熵", "准确率", "均方误差"], "answer": 2, "explain": "准确率是分段常数，几乎处处导数为 0，不能直接做梯度下降。", "relatedConceptId": "c09"}, {"id": "q32", "chapterId": "__all__", "type": "multi", "question": "下面哪些手段可以缓解过拟合？（多选）", "options": ["L2 正则化", "Dropout", "早停", "增大学习率"], "answer": [0, 1, 2], "explain": "正则化、Dropout、早停都在限制模型死记硬背。增大学习率不解决过拟合，还可能让训练不稳定。", "relatedConceptId": "c12"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "函数的核心含义是什么？", "back": "输入定输出：每个输入对应唯一输出。", "tags": ["函数"]}, {"id": "f02", "chapterId": "ch01", "front": "f(g(x)) 先算哪层？", "back": "先算内层 g(x)，把结果喂给外层 f。", "tags": ["复合"]}, {"id": "f03", "chapterId": "ch01", "front": "神经网络整体是什么？", "back": "一个函数：输入一组数，输出一组数。", "tags": ["函数"]}, {"id": "f04", "chapterId": "ch02", "front": "y=kx+b 中 k 和 b 各管什么？", "back": "k 管倾斜（每走一格升降多少），b 管上下平移。", "tags": ["直线"]}, {"id": "f05", "chapterId": "ch02", "front": "线性分类规则的判断依据是什么？", "back": "z=w1x1+w2x2+b 的符号，正判 1，负判 0。", "tags": ["分类"]}, {"id": "f06", "chapterId": "ch03", "front": "导数的定义式是什么？", "back": "f'(x)=lim(h→0)[f(x+h)-f(x)]/h。", "tags": ["导数"]}, {"id": "f07", "chapterId": "ch03", "front": "(x²)' 等于什么？怎么推？", "back": "2x。展开 (x+h)² 减 x²，除以 h 得 2x+h，令 h→0。", "tags": ["导数"]}, {"id": "f08", "chapterId": "ch03", "front": "导数为正说明什么？", "back": "输入增大时输出增大；要让输出变小，应减小输入。", "tags": ["导数"]}, {"id": "f09", "chapterId": "ch04", "front": "链式法则的公式是什么？", "back": "dy/dx=(dy/du)(du/dx)，外层导数乘内层导数。", "tags": ["链式法则"]}, {"id": "f10", "chapterId": "ch04", "front": "链式法则为什么是乘？", "back": "变化量链条上中间变量被约掉，传导率逐段相乘。", "tags": ["链式法则"]}, {"id": "f11", "chapterId": "ch05", "front": "点积怎么算？", "back": "对应位置相乘，再把所有乘积加起来。", "tags": ["向量"]}, {"id": "f12", "chapterId": "ch05", "front": "矩阵乘向量的维度规则？", "back": "W 是 m×n，x 是 n 维，结果是 m 维。", "tags": ["矩阵"]}, {"id": "f13", "chapterId": "ch06", "front": "一个神经元做哪两步？", "back": "加权求和 z=w·x+b，再过激活函数。", "tags": ["神经元"]}, {"id": "f14", "chapterId": "ch06", "front": "为什么单个神经元做不了异或？", "back": "异或两类点对角交错，一条直线无法完整分开。", "tags": ["异或"]}, {"id": "f15", "chapterId": "ch07", "front": "两层纯线性网络等价于什么？为什么？", "back": "等价于一层线性。W2(W1x+b1)+b2 仍是 Wx+B 的形式。", "tags": ["激活函数"]}, {"id": "f16", "chapterId": "ch07", "front": "sigmoid 的导数是什么？", "back": "σ'(z)=σ(z)(1-σ(z))，最大值 0.25。", "tags": ["sigmoid"]}, {"id": "f17", "chapterId": "ch07", "front": "ReLU 的定义和导数？", "back": "ReLU(z)=max(0,z)；正区间导数 1，负区间 0。", "tags": ["ReLU"]}, {"id": "f18", "chapterId": "ch08", "front": "前向传播每层做哪三件事？", "back": "矩阵乘、加偏置、过激活。", "tags": ["前向传播"]}, {"id": "f19", "chapterId": "ch08", "front": "2-2-1 网络有多少参数？", "back": "9 个：6 个权重加 3 个偏置。", "tags": ["参数"]}, {"id": "f20", "chapterId": "ch08", "front": "隐藏层为什么叫隐藏？", "back": "它的值没有标签监督，是网络自己算出的中间表示。", "tags": ["隐藏层"]}, {"id": "f21", "chapterId": "ch09", "front": "平方损失怎么算？", "back": "L=(y-ŷ)²，多样本取平均。", "tags": ["损失"]}, {"id": "f22", "chapterId": "ch09", "front": "用平方而不是绝对值的三个理由？", "back": "不抵消、放大严重错误、处处可导。", "tags": ["损失"]}, {"id": "f23", "chapterId": "ch09", "front": "损失和准确率的区别？", "back": "损失看差距大小，准确率只看对错。", "tags": ["损失"]}, {"id": "f24", "chapterId": "ch10", "front": "梯度下降的更新公式？", "back": "θ←θ-η∂L/∂θ，沿梯度反方向走一步。", "tags": ["梯度下降"]}, {"id": "f25", "chapterId": "ch10", "front": "学习率过大会怎样？过小呢？", "back": "过大震荡或发散，过小收敛很慢。", "tags": ["学习率"]}, {"id": "f26", "chapterId": "ch10", "front": "梯度为 0 一定是谷底吗？", "back": "不一定，也可能是山顶或鞍点。", "tags": ["梯度"]}, {"id": "f27", "chapterId": "ch11", "front": "δ 的定义是什么？", "back": "δ=∂L/∂z，损失对该层激活前打分的偏导。", "tags": ["反向传播"]}, {"id": "f28", "chapterId": "ch11", "front": "隐藏层 δ 的递推公式？", "back": "δ_l=(W_{l+1}ᵀδ_{l+1})⊙σ'(z_l)。", "tags": ["反向传播"]}, {"id": "f29", "chapterId": "ch11", "front": "权重梯度和 δ 的关系？", "back": "∂L/∂W=δ×该层的输入，∂L/∂b=δ。", "tags": ["反向传播"]}, {"id": "f30", "chapterId": "ch12", "front": "过拟合的典型曲线形状？", "back": "训练损失持续下降，验证损失先降后升。", "tags": ["过拟合"]}, {"id": "f31", "chapterId": "ch12", "front": "四种对抗过拟合的手段？", "back": "正则化、Dropout、早停、数据增强。", "tags": ["过拟合"]}, {"id": "f32", "chapterId": "ch13", "front": "异或网络的三步逻辑？", "back": "OR 且非 AND：h1 算 OR，h2 算 AND，输出层组合。", "tags": ["异或"]}, {"id": "f33", "chapterId": "ch13", "front": "隐藏层解决异或的本质？", "back": "换坐标：把交错的两类点映射到可分的新位置。", "tags": ["异或"]}, {"id": "f34", "chapterId": "ch13", "front": "手工设计用阶跃，实际训练为什么不行？", "back": "阶跃不可导，无法做反向传播，要用 sigmoid 等平滑近似。", "tags": ["激活函数"]}]}, "pages": {"ch01": {"html": "<h1>第 1 章：函数是一台机器<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：0.5 小时 | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出函数、自变量、因变量分别指什么；\n<\/li><li>\n给定一个函数，算出任意输入对应的输出；\n<\/li><li>\n把两个函数串起来，算出&quot;先过第一台机器、再过第二台&quot;的结果。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>神经网络不是一堆神秘的零件，它是一个函数：塞进去一组数，吐出来一组数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>函数就是&quot;输入定输出&quot;<\/h3>\n<p>初中课本里的函数定义是：在一个变化过程中有两个变量 <span class=\"katex-inline\">x<\/span> 和 <span class=\"katex-inline\">y<\/span>，如果给定一个 <span class=\"katex-inline\">x<\/span>，<span class=\"katex-inline\">y<\/span> 都有唯一确定的值和它对应，就说 <span class=\"katex-inline\">y<\/span> 是 <span class=\"katex-inline\">x<\/span> 的函数。<\/p>\n<p>这句话翻译成人话：<strong>你递进去一个数，它按固定规矩还你一个数，而且同一个输入不会还你两个不同的输出。<\/strong><\/p>\n<p>比如这台机器：<\/p>\n<div class=\"katex-block\">f(x) = 2x + 1<\/div>\n<p>递进去 <span class=\"katex-inline\">x=3<\/span>，它还你 <span class=\"katex-inline\">f(3)=2\\times 3+1=7<\/span>。递进去 <span class=\"katex-inline\">x=0<\/span>，还你 <span class=\"katex-inline\">1<\/span>。递进去 <span class=\"katex-inline\">x=-2<\/span>，还你 <span class=\"katex-inline\">-3<\/span>。<\/p>\n<p>这里 <span class=\"katex-inline\">x<\/span> 叫<strong>自变量<\/strong>，是你能控制的输入；<span class=\"katex-inline\">f(x)<\/span> 叫<strong>因变量<\/strong>，是机器的输出，它跟着 <span class=\"katex-inline\">x<\/span> 变。<span class=\"katex-inline\">f<\/span> 是这个机器的名字，括号里的 <span class=\"katex-inline\">x<\/span> 是&quot;往哪个口子塞&quot;。<\/p>\n<h3>机器的内部可以很简单，也可以很复杂<\/h3>\n<p><span class=\"katex-inline\">f(x)=2x+1<\/span> 的内部只干两件事：先把输入乘 2，再加 1。<\/p>\n<p>神经网络内部干的事多得多：几百个乘法、几百个加法、几次非线性弯折。但它的身份没变——仍然是一台&quot;输入定输出&quot;的机器。<\/p>\n<p>一张 28×28 的手写数字图片，有 784 个像素点。你可以把这 784 个数打包塞进网络，它吐出 10 个数，分别表示&quot;这张图是 0、1、2……9 的可能性&quot;。这就是一个函数，只不过输入是 784 个数，输出是 10 个数。<\/p>\n<h3>复合：把机器串起来<\/h3>\n<p>假设有两台机器：<\/p>\n<div class=\"katex-block\">g(x) = x^2,\\qquad f(u) = 2u + 1<\/div>\n<p>先把 <span class=\"katex-inline\">x<\/span> 塞进 <span class=\"katex-inline\">g<\/span>，得到 <span class=\"katex-inline\">u=x^2<\/span>；再把 <span class=\"katex-inline\">u<\/span> 塞进 <span class=\"katex-inline\">f<\/span>，得到 <span class=\"katex-inline\">f(u)=2u+1<\/span>。整个过程写成：<\/p>\n<div class=\"katex-block\">F(x) = f(g(x)) = 2x^2 + 1<\/div>\n<p>取 <span class=\"katex-inline\">x=3<\/span>：<span class=\"katex-inline\">g(3)=9<\/span>，<span class=\"katex-inline\">f(9)=19<\/span>，所以 <span class=\"katex-inline\">F(3)=19<\/span>。<\/p>\n<p>这种&quot;机器套机器&quot;的结构叫<strong>复合函数<\/strong>。它是第 4 章的主角，也是神经网络的基本构造方式：一层算完，结果喂给下一层，再喂给下一层。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[&quot;输入 x&quot;] --&gt; B[&quot;第一层：乘 2 加 1&quot;]\n    B --&gt; C[&quot;中间结果 u&quot;]\n    C --&gt; D[&quot;第二层：平方&quot;]\n    D --&gt; E[&quot;输出 y&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是入口，右边是出口，方框是加工步骤，箭头是数据的流向。神经网络就是把这条链拉长到几十层，每层里塞进很多个并排的加工单元。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：函数像自动售货机。投一个币（输入），按固定的内部机制，掉一罐饮料（输出）。同一个币不会有时掉可乐、有时掉矿泉水。<\/p>\n<p>这个类比在&quot;一个输入只能有一个输出&quot;这一点上成立。它失效的地方是：售货机可以卡住不出货，函数不允许——每个合法输入都必须有输出。另外，神经网络的一个输入是一整组数（比如 784 个像素），不是一枚硬币。<\/p>\n<p><strong>实例<\/strong>：设 <span class=\"katex-inline\">f(x)=3x-2<\/span>，<span class=\"katex-inline\">g(x)=x^2+1<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">f(4)=3\\times 4-2=10<\/span>\n<\/li><li>\n<span class=\"katex-inline\">g(4)=16+1=17<\/span>\n<\/li><li>\n<span class=\"katex-inline\">f(g(2))=f(5)=13<\/span>\n<\/li><li>\n<span class=\"katex-inline\">g(f(2))=g(4)=17<\/span>\n<\/ul>\n<p>注意 <span class=\"katex-inline\">f(g(2))<\/span> 和 <span class=\"katex-inline\">g(f(2))<\/span> 结果不同。串联有顺序，先过哪台机器不一样。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为&quot;函数必须有公式&quot;<\/strong>——实际上函数是一套对应规则，公式只是把规则写出来的一种方式。神经网络这个函数就没有一个简洁公式，它的规则藏在成千上万个参数里，但输入定了输出就定了，仍然符合函数的定义。<\/p>\n<p><strong>别以为 <span class=\"katex-inline\">f(x)<\/span> 表示 <span class=\"katex-inline\">f<\/span> 乘 <span class=\"katex-inline\">x<\/span><\/strong>——<span class=\"katex-inline\">f(x)<\/span> 读作&quot;<span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">x<\/span> 处的值&quot;，不是乘法。<span class=\"katex-inline\">f<\/span> 是机器名，<span class=\"katex-inline\">x<\/span> 是塞进去的东西。<\/p>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n设 <span class=\"katex-inline\">f(x)=x^2-3x<\/span>，求 <span class=\"katex-inline\">f(2)<\/span> 和 <span class=\"katex-inline\">f(-1)<\/span>。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">f(2)=4-6=-2<\/span>；<span class=\"katex-inline\">f(-1)=1+3=4<\/span>。<\/p>\n<p><strong>解析<\/strong>：把 <span class=\"katex-inline\">x<\/span> 换成具体数字，逐项算。<span class=\"katex-inline\">f(-1)<\/span> 里 <span class=\"katex-inline\">(-1)^2=1<\/span>，<span class=\"katex-inline\">-3\\times(-1)=+3<\/span>，不能漏掉负号。<\/p>\n<ol><li>\n设 <span class=\"katex-inline\">g(x)=2x<\/span>，<span class=\"katex-inline\">h(x)=x+5<\/span>。求 <span class=\"katex-inline\">h(g(3))<\/span> 与 <span class=\"katex-inline\">g(h(3))<\/span>，并说明两者为什么不同。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">h(g(3))=h(6)=11<\/span>；<span class=\"katex-inline\">g(h(3))=g(8)=16<\/span>。<\/p>\n<p><strong>解析<\/strong>：<span class=\"katex-inline\">h(g(3))<\/span> 先算内层的 <span class=\"katex-inline\">g(3)=6<\/span>，再送进 <span class=\"katex-inline\">h<\/span> 加 5；<span class=\"katex-inline\">g(h(3))<\/span> 先算 <span class=\"katex-inline\">h(3)=8<\/span>，再送进 <span class=\"katex-inline\">g<\/span> 乘 2。顺序不同，中间结果不同。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n函数 = 输入定输出的机器，同一个输入只有一个输出。\n<\/li><li>\n复合函数 = 机器串联，先内层后外层，顺序不能换。\n<\/li><li>\n神经网络就是一个输入 784 个数、输出 10 个数的复合函数。\n<\/ul>", "kind": "chapter", "title": "第 1 章：函数是一台机器"}, "ch02": {"html": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：函数是一台机器<\/a><\/span><\/div><h1>第 2 章：一条直线能干什么<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：0.6 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清 <span class=\"katex-inline\">y=kx+b<\/span> 里 <span class=\"katex-inline\">k<\/span> 和 <span class=\"katex-inline\">b<\/span> 各控制什么；\n<\/li><li>\n把&quot;用直线把点分成两类&quot;写成一条判断规则；\n<\/li><li>\n把两个输入的判断规则写成 <span class=\"katex-inline\">w_1x_1+w_2x_2+b&gt;0<\/span>。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>一条直线就是一个最原始的&quot;分类器&quot;：线的一侧判 1，另一侧判 0。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>一次函数：<span class=\"katex-inline\">y=kx+b<\/span><\/h3>\n<p>初中学过的一次函数，图像是一条直线：<\/p>\n<div class=\"katex-block\">y = kx + b<\/div>\n<p><span class=\"katex-inline\">k<\/span> 叫<strong>斜率<\/strong>。它的意思是：<span class=\"katex-inline\">x<\/span> 每往右走 1 格，<span class=\"katex-inline\">y<\/span> 就变化 <span class=\"katex-inline\">k<\/span>。<span class=\"katex-inline\">k=2<\/span> 时，往右 1 格，往上 2 格；<span class=\"katex-inline\">k=-1<\/span> 时，往右 1 格，往下 1 格。<\/p>\n<p><span class=\"katex-inline\">b<\/span> 叫<strong>截距<\/strong>。它是 <span class=\"katex-inline\">x=0<\/span> 时直线穿过纵轴的高度，也就是&quot;起点&quot;。<\/p>\n<p>这两个参数一改，直线就跟着变：<span class=\"katex-inline\">k<\/span> 控制倾斜程度，<span class=\"katex-inline\">b<\/span> 控制上下平移。<\/p>\n<h3>把直线变成判断规则<\/h3>\n<p>现在换个问法。不问&quot;<span class=\"katex-inline\">x<\/span> 对应哪个 <span class=\"katex-inline\">y<\/span>&quot;，而问&quot;这个点在直线的上面还是下面&quot;。<\/p>\n<p>直线的方程是 <span class=\"katex-inline\">y=kx+b<\/span>。对平面上任意一点 <span class=\"katex-inline\">(x,y)<\/span>：<\/p>\n<ul><li>\n如果 <span class=\"katex-inline\">y &gt; kx+b<\/span>，点在直线上方；\n<\/li><li>\n如果 <span class=\"katex-inline\">y &lt; kx+b<\/span>，点在直线下方；\n<\/li><li>\n如果相等，点正好落在直线上。\n<\/ul>\n<p>把这句话整理成 <span class=\"katex-inline\">kx+b-y<\/span> 的符号，或者更常见的形式：<\/p>\n<div class=\"katex-block\">z = kx + b<\/div>\n<p><span class=\"katex-inline\">z&gt;0<\/span> 判为一类，<span class=\"katex-inline\">z&lt;0<\/span> 判为另一类。这条 <span class=\"katex-inline\">z=0<\/span> 的线就是分界线。<\/p>\n<p>到这里，&quot;直线&quot;和&quot;判断&quot;已经接上了：<strong>直线的方程不是一个用来画图的公式，它是一把尺子，量出每个点该分到哪边。<\/strong><\/p>\n<h3>两个输入的情况<\/h3>\n<p>现实里的输入往往不止一个数。比如判断一封邮件是不是垃圾邮件，可能同时看&quot;广告词出现次数&quot;和&quot;感叹号数量&quot;。<\/p>\n<p>设两个输入是 <span class=\"katex-inline\">x_1<\/span> 和 <span class=\"katex-inline\">x_2<\/span>，给每个输入配一个权重：<\/p>\n<div class=\"katex-block\">z = w_1x_1 + w_2x_2 + b<\/div>\n<p><span class=\"katex-inline\">w_1<\/span>、<span class=\"katex-inline\">w_2<\/span> 叫<strong>权重<\/strong>，意思是&quot;这个输入有多重要&quot;。<span class=\"katex-inline\">b<\/span> 叫<strong>偏置<\/strong>，它决定门槛高低。<\/p>\n<p>把 <span class=\"katex-inline\">(x_1,x_2)<\/span> 看成平面上的横纵坐标，<span class=\"katex-inline\">w_1x_1+w_2x_2+b=0<\/span> 在平面上仍然是一条直线。<span class=\"katex-inline\">z&gt;0<\/span> 的一侧判 1，<span class=\"katex-inline\">z&lt;0<\/span> 的一侧判 0。<\/p>\n<p>输入从一个变成两个，几何上从&quot;数轴上的分点&quot;升级成&quot;平面上的分界线&quot;。再往上加输入（三个、四个、784 个），分界线变成三维空间里的平面、高维空间里的超平面。名字变复杂了，干的事没变：<strong>用一个线性方程把空间切成两半。<\/strong><\/p>\n<h2>图示<\/h2>\n<div>\n<svg viewBox=\"0 0 460 320\" width=\"100%\" role=\"img\" aria-label=\"一条直线把平面分成两侧\">\n<rect x=\"40\" y=\"20\" width=\"380\" height=\"260\" fill=\"none\" stroke=\"#9ca3af\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"280\" x2=\"420\" y2=\"280\" stroke=\"#9ca3af\" stroke-width=\"1\"/>\n<line x1=\"40\" y1=\"280\" x2=\"40\" y2=\"20\" stroke=\"#9ca3af\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"240\" x2=\"400\" y2=\"80\" stroke=\"#3b82f6\" stroke-width=\"2.5\"/>\n<circle cx=\"120\" cy=\"120\" r=\"5\" fill=\"#16a34a\"/>\n<circle cx=\"180\" cy=\"90\" r=\"5\" fill=\"#16a34a\"/>\n<circle cx=\"90\" cy=\"200\" r=\"5\" fill=\"#16a34a\"/>\n<circle cx=\"280\" cy=\"230\" r=\"5\" fill=\"#dc2626\"/>\n<circle cx=\"340\" cy=\"200\" r=\"5\" fill=\"#dc2626\"/>\n<circle cx=\"380\" cy=\"250\" r=\"5\" fill=\"#dc2626\"/>\n<text x=\"250\" y=\"70\" font-size=\"13\" fill=\"#6b7280\">z &gt; 0 一侧<\/text>\n<text x=\"250\" y=\"255\" font-size=\"13\" fill=\"#6b7280\">z &lt; 0 一侧<\/text>\n<text x=\"392\" y=\"160\" font-size=\"13\" fill=\"#3b82f6\">z = 0<\/text>\n<\/svg>\n<\/div>\n<p>看图说明：蓝线是 <span class=\"katex-inline\">z=0<\/span>。绿点落在 <span class=\"katex-inline\">z&gt;0<\/span> 的一侧，红点落在 <span class=\"katex-inline\">z&lt;0<\/span> 的一侧。只要给出权重和偏置，这条线的位置和角度就定了，所有点的分类结果也就定了。图里没有画出坐标刻度，因为重点不是具体数值，而是&quot;一条线把平面切成两半&quot;这个结构。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：直线分类像机场安检的地面标线。线左边排队、线右边直接通过，站在哪边由一条线决定。权重决定这条线往哪个方向斜，偏置决定它往哪边挪。<\/p>\n<p>类比失效的地方：现实安检线是人画的，神经网络里的这条线是<strong>算出来的<\/strong>——第 10 章会讲，它靠调整 <span class=\"katex-inline\">w<\/span> 和 <span class=\"katex-inline\">b<\/span> 一点点挪到合适的位置。<\/p>\n<p><strong>实例<\/strong>：设 <span class=\"katex-inline\">w_1=1<\/span>，<span class=\"katex-inline\">w_2=1<\/span>，<span class=\"katex-inline\">b=-1.5<\/span>，规则是 <span class=\"katex-inline\">z=x_1+x_2-1.5&gt;0<\/span> 判 1。<\/p>\n<table><thead><tr><th><span class=\"katex-inline\">x_1<\/span><\/th><th><span class=\"katex-inline\">x_2<\/span><\/th><th><span class=\"katex-inline\">z<\/span><\/th><th>判断<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td><span class=\"katex-inline\">-1.5<\/span><\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td><span class=\"katex-inline\">-0.5<\/span><\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td><span class=\"katex-inline\">-0.5<\/span><\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td><span class=\"katex-inline\">0.5<\/span><\/td><td>1<\/td><\/tr><\/tbody><\/table>\n<p>这四个点正好是&quot;与&quot;运算：两个都为 1 才输出 1。换一个偏置 <span class=\"katex-inline\">b=-0.5<\/span>，规则变成 <span class=\"katex-inline\">x_1+x_2-0.5&gt;0<\/span>，表格变成：<\/p>\n<table><thead><tr><th><span class=\"katex-inline\">x_1<\/span><\/th><th><span class=\"katex-inline\">x_2<\/span><\/th><th><span class=\"katex-inline\">z<\/span><\/th><th>判断<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td><span class=\"katex-inline\">-0.5<\/span><\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td><span class=\"katex-inline\">0.5<\/span><\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td><span class=\"katex-inline\">0.5<\/span><\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td><span class=\"katex-inline\">1.5<\/span><\/td><td>1<\/td><\/tr><\/tbody><\/table>\n<p>这就是&quot;或&quot;运算。同一组权重，只改偏置，分类规则就从&quot;与&quot;变成&quot;或&quot;。偏置的作用在这里看得很清楚：它挪动门槛。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为直线只能用来&quot;拟合数据点&quot;<\/strong>——直线也能用来做判断。拟合是&quot;让线穿过点&quot;，分类是&quot;让线把点分开&quot;。神经网络训练时干的是后者，只不过它调整的不止一条线。<\/p>\n<p><strong>别以为权重越大越好<\/strong>——权重只表示&quot;这个输入在打分里占多大比重&quot;，不是质量评分。所有权重同时放大 10 倍，判断结果不变（因为 <span class=\"katex-inline\">z<\/span> 的正负号不变），只是 <span class=\"katex-inline\">z<\/span> 的数值变大。<\/p>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n直线 <span class=\"katex-inline\">y=2x-3<\/span> 的斜率与截距分别是多少？<span class=\"katex-inline\">x=1<\/span> 时 <span class=\"katex-inline\">y<\/span> 等于多少？\n<\/ol>\n<p><strong>答案<\/strong>：斜率 <span class=\"katex-inline\">k=2<\/span>，截距 <span class=\"katex-inline\">b=-3<\/span>；<span class=\"katex-inline\">y=2\\times 1-3=-1<\/span>。<\/p>\n<p><strong>解析<\/strong>：对照 <span class=\"katex-inline\">y=kx+b<\/span> 的格式读系数。截距是 <span class=\"katex-inline\">x=0<\/span> 时的 <span class=\"katex-inline\">y<\/span> 值，即 <span class=\"katex-inline\">-3<\/span>，不是 <span class=\"katex-inline\">3<\/span>。<\/p>\n<ol><li>\n规则 <span class=\"katex-inline\">z=2x_1-x_2+1<\/span>，判断点 <span class=\"katex-inline\">(1,3)<\/span> 属于 <span class=\"katex-inline\">z&gt;0<\/span> 还是 <span class=\"katex-inline\">z&lt;0<\/span> 一侧？\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">z=2\\times 1-3+1=0<\/span>，点正好落在分界线上，不属于任何一侧。<\/p>\n<p><strong>解析<\/strong>：分别代入再算。<span class=\"katex-inline\">z=0<\/span> 是边界情况，实际使用时会约定归到某一类，或单独处理。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n<span class=\"katex-inline\">y=kx+b<\/span>：<span class=\"katex-inline\">k<\/span> 管倾斜，<span class=\"katex-inline\">b<\/span> 管上下平移。\n<\/li><li>\n分类规则 <span class=\"katex-inline\">z=w_1x_1+w_2x_2+b<\/span>，<span class=\"katex-inline\">z<\/span> 的符号决定类别。\n<\/li><li>\n输入变多，分界线从点升级成线、面、超平面，本质仍是&quot;切一刀&quot;。\n<\/ul>", "kind": "chapter", "title": "第 2 章：一条直线能干什么"}, "ch03": {"html": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：函数是一台机器<\/a><\/span> · <span class=\"prereq-soft\"><span class=\"prereq-tag\">荐<\/span> <a href=\"#/chapter/ch02\">第 2 章：一条直线能干什么<\/a><\/span><\/div><h1>第 3 章：变化率与导数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1 小时 | <strong>前置<\/strong>：第 1、2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n算出函数在两点之间的平均变化率；\n<\/li><li>\n用 <span class=\"katex-inline\">h<\/span> 越来越小的办法逼近某一点的瞬时变化率；\n<\/li><li>\n自己推出 <span class=\"katex-inline\">(x^2)&#x27;=2x<\/span>，并会用几条基本求导法则。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>导数就是&quot;某一瞬间，输入动一点点，输出跟着动多少&quot;的比例。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>先算&quot;一段路&quot;的平均速度<\/h3>\n<p>一辆车 2 小时开了 120 公里，平均速度是 <span class=\"katex-inline\">120\\div 2=60<\/span> 公里每小时。这是<strong>平均变化率<\/strong>：一段区间内，输出变化量除以输入变化量。<\/p>\n<p>换成函数语言。函数 <span class=\"katex-inline\">f(x)<\/span> 在 <span class=\"katex-inline\">x<\/span> 从 <span class=\"katex-inline\">a<\/span> 变到 <span class=\"katex-inline\">a+h<\/span> 的过程中：<\/p>\n<div class=\"katex-block\">\\text{平均变化率}=\\frac{f(a+h)-f(a)}{h}<\/div>\n<p>分子是输出的变化量，分母是输入的变化量。<span class=\"katex-inline\">h<\/span> 就是输入往前挪的那一小步。<\/p>\n<h3>把&quot;一段&quot;缩成&quot;一点&quot;<\/h3>\n<p>平均速度有个问题：它只说整段路的平均情况。中间可能有一段开到 100，有一段堵着走 20。想知道某一刻的速度，得把区间缩短。<\/p>\n<p>拿 <span class=\"katex-inline\">f(x)=x^2<\/span> 在 <span class=\"katex-inline\">x=3<\/span> 附近试一下：<\/p>\n<table><thead><tr><th><span class=\"katex-inline\">h<\/span><\/th><th><span class=\"katex-inline\">\\dfrac{f(3+h)-f(3)}{h}<\/span><\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>7<\/td><\/tr><tr><td>0.5<\/td><td>6.5<\/td><\/tr><tr><td>0.1<\/td><td>6.1<\/td><\/tr><tr><td>0.01<\/td><td>6.01<\/td><\/tr><tr><td>0.001<\/td><td>6.001<\/td><\/tr><\/tbody><\/table>\n<p><span class=\"katex-inline\">h<\/span> 越小，结果越靠近 6。<span class=\"katex-inline\">h<\/span> 缩到 0 的时候这个式子没有定义（分母不能为 0），但它逼近的那个数有明确的意义：<strong><span class=\"katex-inline\">x=3<\/span> 这一点的瞬时变化率<\/strong>，记作 <span class=\"katex-inline\">f&#x27;(3)=6<\/span>。<\/p>\n<p>这个&quot;无限逼近&quot;的过程叫<strong>极限<\/strong>。这里不追求严格定义，只需要接受一件事：<span class=\"katex-inline\">h<\/span> 可以任意小，结果会稳定到一个确定的数。<\/p>\n<h3>导数的定义<\/h3>\n<p>函数 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">x<\/span> 处的<strong>导数<\/strong>记作 <span class=\"katex-inline\">f&#x27;(x)<\/span>：<\/p>\n<div class=\"katex-block\">f'(x)=\\lim_{h\\to 0}\\frac{f(x+h)-f(x)}{h}<\/div>\n<p><span class=\"katex-inline\">\\lim_{h\\to 0}<\/span> 读作&quot;当 <span class=\"katex-inline\">h<\/span> 趋向于 0 时的极限&quot;。这个式子的意思：让 <span class=\"katex-inline\">h<\/span> 无限靠近 0，看这个比值稳定在哪。<\/p>\n<p>几何上，<span class=\"katex-inline\">\\dfrac{f(x+h)-f(x)}{h}<\/span> 是过 <span class=\"katex-inline\">(x,f(x))<\/span> 和 <span class=\"katex-inline\">(x+h,f(x+h))<\/span> 两点的<strong>割线<\/strong>斜率。<span class=\"katex-inline\">h\\to 0<\/span> 时，第二个点贴着第一个点，割线变成<strong>切线<\/strong>，导数就是切线的斜率。<\/p>\n<div>\n<svg viewBox=\"0 0 460 300\" width=\"100%\" role=\"img\" aria-label=\"割线逼近切线\">\n<line x1=\"50\" y1=\"250\" x2=\"430\" y2=\"250\" stroke=\"#9ca3af\"/>\n<line x1=\"50\" y1=\"250\" x2=\"50\" y2=\"40\" stroke=\"#9ca3af\"/>\n<path d=\"M 90 210 Q 220 60 400 190\" fill=\"none\" stroke=\"#6b7280\" stroke-width=\"2\"/>\n<line x1=\"150\" y1=\"176\" x2=\"320\" y2=\"112\" stroke=\"#9ca3af\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/>\n<line x1=\"210\" y1=\"160\" x2=\"330\" y2=\"250\" stroke=\"#3b82f6\" stroke-width=\"2.5\"/>\n<circle cx=\"210\" cy=\"160\" r=\"4.5\" fill=\"#3b82f6\"/>\n<circle cx=\"320\" cy=\"112\" r=\"4\" fill=\"#9ca3af\"/>\n<text x=\"325\" y=\"105\" font-size=\"12\" fill=\"#6b7280\">x+h<\/text>\n<text x=\"180\" y=\"180\" font-size=\"12\" fill=\"#3b82f6\">x<\/text>\n<text x=\"300\" y=\"230\" font-size=\"12\" fill=\"#3b82f6\">切线<\/text>\n<text x=\"170\" y=\"150\" font-size=\"12\" fill=\"#6b7280\">割线<\/text>\n<\/svg>\n<\/div>\n<p>看图说明：灰线是函数曲线，虚线是连接两点的割线，蓝线是把两点无限拉近后得到的切线。切线的斜率就是该点的导数。<\/p>\n<h3>亲手推 <span class=\"katex-inline\">(x^2)&#x27;=2x<\/span><\/h3>\n<p>不背公式，推一遍。按定义：<\/p>\n<div class=\"katex-block\">f'(x)=\\lim_{h\\to 0}\\frac{(x+h)^2-x^2}{h}<\/div>\n<p>第一步，展开 <span class=\"katex-inline\">(x+h)^2<\/span>：<\/p>\n<div class=\"katex-block\">(x+h)^2=x^2+2xh+h^2<\/div>\n<p>第二步，代回分子：<\/p>\n<div class=\"katex-block\">(x^2+2xh+h^2)-x^2=2xh+h^2<\/div>\n<p>第三步，除以 <span class=\"katex-inline\">h<\/span>（<span class=\"katex-inline\">h\\neq 0<\/span>，可以约）：<\/p>\n<div class=\"katex-block\">\\frac{2xh+h^2}{h}=2x+h<\/div>\n<p>第四步，让 <span class=\"katex-inline\">h\\to 0<\/span>，<span class=\"katex-inline\">h<\/span> 这一项消失：<\/p>\n<div class=\"katex-block\">f'(x)=2x<\/div>\n<p>验证：<span class=\"katex-inline\">x=3<\/span> 时 <span class=\"katex-inline\">2x=6<\/span>，和上面的数值表对上了。<\/p>\n<h3>几条够用的求导法则<\/h3>\n<table><thead><tr><th>函数<\/th><th>导数<\/th><th>说明<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">C<\/span>（常数）<\/td><td><span class=\"katex-inline\">0<\/span><\/td><td>水平线，不升不降<\/td><\/tr><tr><td><span class=\"katex-inline\">x<\/span><\/td><td><span class=\"katex-inline\">1<\/span><\/td><td>输入涨 1，输出涨 1<\/td><\/tr><tr><td><span class=\"katex-inline\">x^n<\/span><\/td><td><span class=\"katex-inline\">nx^{n-1}<\/span><\/td><td>幂函数，<span class=\"katex-inline\">n<\/span> 可以是 2、3、0.5<\/td><\/tr><tr><td><span class=\"katex-inline\">Cf(x)<\/span><\/td><td><span class=\"katex-inline\">Cf&#x27;(x)<\/span><\/td><td>常数倍可以提到外面<\/td><\/tr><tr><td><span class=\"katex-inline\">f(x)+g(x)<\/span><\/td><td><span class=\"katex-inline\">f&#x27;(x)+g&#x27;(x)<\/span><\/td><td>加法逐项求导<\/td><\/tr><\/tbody><\/table>\n<p>用这条幂法则验一下上面的结果：<span class=\"katex-inline\">(x^2)&#x27;=2x^{2-1}=2x<\/span>，和手推一致。<\/p>\n<h3>神经网络为什么盯着导数<\/h3>\n<p>训练网络时，我们有一个&quot;损失&quot;（第 9 章会定义），它衡量输出错得有多离谱。目标是让损失变小。<\/p>\n<p>假设损失只由一个参数 <span class=\"katex-inline\">w<\/span> 决定，记作 <span class=\"katex-inline\">L(w)<\/span>。要知道&quot;<span class=\"katex-inline\">w<\/span> 往哪边调能让 <span class=\"katex-inline\">L<\/span> 变小&quot;，就看 <span class=\"katex-inline\">L<\/span> 对 <span class=\"katex-inline\">w<\/span> 的导数：<\/p>\n<ul><li>\n导数为正：<span class=\"katex-inline\">w<\/span> 增大，<span class=\"katex-inline\">L<\/span> 变大，应该把 <span class=\"katex-inline\">w<\/span> 调小；\n<\/li><li>\n导数为负：<span class=\"katex-inline\">w<\/span> 增大，<span class=\"katex-inline\">L<\/span> 变小，应该把 <span class=\"katex-inline\">w<\/span> 调大；\n<\/li><li>\n导数为 0：这个位置暂时是平的。\n<\/ul>\n<p>导数的正负号提供方向，大小提供&quot;有多陡&quot;。第 10 章的梯度下降，整台机器就靠这个符号和大小决定每一步怎么走。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：导数像汽车仪表盘上的瞬时速度表。平均速度是&quot;这段路开了多久、跑了多远&quot;，瞬时速度是&quot;此刻指针指在哪&quot;。导航软件用平均速度估算到达时间，自动驾驶控制油门看的是瞬时速度。<\/p>\n<p>类比失效的地方：速度表读的是真实车辆，导数是算出来的极限值，不是&quot;测量&quot;出来的。对不光滑的函数（比如有尖角的折线），尖角那一点导数可能不存在。<\/p>\n<p><strong>实例<\/strong>：求 <span class=\"katex-inline\">f(x)=3x^2+2x-1<\/span> 在 <span class=\"katex-inline\">x=2<\/span> 处的导数。<\/p>\n<p>逐项求导：<span class=\"katex-inline\">(3x^2)&#x27;=3\\cdot 2x=6x<\/span>，<span class=\"katex-inline\">(2x)&#x27;=2<\/span>，<span class=\"katex-inline\">(-1)&#x27;=0<\/span>。所以 <span class=\"katex-inline\">f&#x27;(x)=6x+2<\/span>。代入 <span class=\"katex-inline\">x=2<\/span>：<span class=\"katex-inline\">f&#x27;(2)=14<\/span>。<\/p>\n<p>用定义验一遍：<span class=\"katex-inline\">f(2)=12+4-1=15<\/span>，<span class=\"katex-inline\">f(2.001)=3(4.004001)+4.002-1\\approx 15.014003<\/span>，差约 <span class=\"katex-inline\">0.014003<\/span>，除以 <span class=\"katex-inline\">0.001<\/span> 得 <span class=\"katex-inline\">14.003<\/span>，逼近 14。对上了。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为导数是&quot;变化量&quot;<\/strong>——导数是变化量与输入变化量的<strong>比值<\/strong>，是&quot;每单位输入变化带来多少输出变化&quot;。<span class=\"katex-inline\">f&#x27;(3)=6<\/span> 的意思是&quot;在 <span class=\"katex-inline\">x=3<\/span> 附近，<span class=\"katex-inline\">x<\/span> 每增加一点点，<span class=\"katex-inline\">y<\/span> 大约增加 6 倍那么一点点&quot;，不是&quot;<span class=\"katex-inline\">y<\/span> 增加了 6&quot;。<\/p>\n<p><strong>别以为导数一定是正的<\/strong>——导数为负表示函数在下降。<span class=\"katex-inline\">f(x)=-x<\/span> 的导数是 <span class=\"katex-inline\">-1<\/span>，<span class=\"katex-inline\">x<\/span> 增大时 <span class=\"katex-inline\">y<\/span> 减小。<\/p>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n用定义推 <span class=\"katex-inline\">(x^3)&#x27;<\/span>。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">3x^2<\/span>。<\/p>\n<p><strong>解析<\/strong>：<span class=\"katex-inline\">(x+h)^3=x^3+3x^2h+3xh^2+h^3<\/span>，减去 <span class=\"katex-inline\">x^3<\/span> 后除以 <span class=\"katex-inline\">h<\/span> 得 <span class=\"katex-inline\">3x^2+3xh+h^2<\/span>，令 <span class=\"katex-inline\">h\\to 0<\/span> 得 <span class=\"katex-inline\">3x^2<\/span>。<\/p>\n<ol><li>\n求 <span class=\"katex-inline\">f(x)=x^2<\/span> 在 <span class=\"katex-inline\">x=5<\/span> 处的切线斜率，并说明 <span class=\"katex-inline\">x<\/span> 从 5 增加到 5.1 时 <span class=\"katex-inline\">y<\/span> 大约增加多少。\n<\/ol>\n<p><strong>答案<\/strong>：斜率 <span class=\"katex-inline\">f&#x27;(5)=10<\/span>；<span class=\"katex-inline\">y<\/span> 大约增加 <span class=\"katex-inline\">10\\times 0.1=1<\/span>。<\/p>\n<p><strong>解析<\/strong>：导数给出&quot;每单位输入变化对应的输出变化&quot;。实际增量用导数乘以输入增量近似，输入增量为 0.1 时约增加 1。精确值是 <span class=\"katex-inline\">5.1^2-25=1.01<\/span>，与近似值差 0.01。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n平均变化率是&quot;一段&quot;的，导数是&quot;一点&quot;的。\n<\/li><li>\n导数定义：<span class=\"katex-inline\">f&#x27;(x)=\\lim_{h\\to 0}\\frac{f(x+h)-f(x)}{h}<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">(x^2)&#x27;=2x<\/span> 可以自己推，不必背。\n<\/li><li>\n导数的符号告诉你&quot;往哪边调参数能让结果变小&quot;。\n<\/ul>", "kind": "chapter", "title": "第 3 章：变化率与导数"}, "ch04": {"html": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：变化率与导数<\/a><\/span> · <span class=\"prereq-soft\"><span class=\"prereq-tag\">荐<\/span> <a href=\"#/chapter/ch01\">第 1 章：函数是一台机器<\/a><\/span><\/div><h1>第 4 章：套娃函数怎么求导<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 1、3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n认出什么样的函数是复合函数，分清哪层在内、哪层在外；\n<\/li><li>\n用链式法则求导，写出完整的乘法链条；\n<\/li><li>\n解释链式法则为什么是&quot;乘&quot;而不是&quot;加&quot;。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>复合函数求导，就是外层导数乘内层导数，一层一层剥。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>复合函数长什么样<\/h3>\n<p>第 1 章见过这种结构：<span class=\"katex-inline\">F(x)=f(g(x))<\/span>。<span class=\"katex-inline\">g<\/span> 在里层先算，<span class=\"katex-inline\">f<\/span> 在外层后算。<\/p>\n<p>判断哪层是外层，看&quot;最后一步算什么&quot;。<\/p>\n<div class=\"katex-block\">y=(2x+1)^2<\/div>\n<p>这个函数最后一步是平方。平方运算作用在 <span class=\"katex-inline\">(2x+1)<\/span> 这个整体上。所以外层是&quot;平方&quot;，内层是&quot;<span class=\"katex-inline\">2x+1<\/span>&quot;。<\/p>\n<p>设 <span class=\"katex-inline\">u=2x+1<\/span>，则 <span class=\"katex-inline\">y=u^2<\/span>。写成复合形式：<span class=\"katex-inline\">y=f(g(x))<\/span>，其中 <span class=\"katex-inline\">g(x)=2x+1<\/span>，<span class=\"katex-inline\">f(u)=u^2<\/span>。<\/p>\n<h3>直接展开也能做，但撑不了多久<\/h3>\n<p><span class=\"katex-inline\">y=(2x+1)^2=4x^2+4x+1<\/span>，求导得 <span class=\"katex-inline\">y&#x27;=8x+4<\/span>。这道题展开确实能做。<\/p>\n<p>换成 <span class=\"katex-inline\">y=(2x+1)^{10}<\/span>，展开要写十一项。换成 <span class=\"katex-inline\">y=\\sin(3x^2+1)<\/span>，根本展不开。神经网络里的复合深度是几十层，靠展开不可行。<\/p>\n<p>需要一条通用规则。<\/p>\n<h3>链式法则<\/h3>\n<p>设 <span class=\"katex-inline\">y=f(u)<\/span>，<span class=\"katex-inline\">u=g(x)<\/span>，则：<\/p>\n<div class=\"katex-block\">\\frac{dy}{dx}=\\frac{dy}{du}\\cdot\\frac{du}{dx}<\/div>\n<p>用函数记号写：<\/p>\n<div class=\"katex-block\">\\big(f(g(x))\\big)'=f'(g(x))\\cdot g'(x)<\/div>\n<p>读法：<strong>外层函数在&quot;内层结果&quot;处的导数，乘以内层函数对 <span class=\"katex-inline\">x<\/span> 的导数。<\/strong><\/p>\n<p>用 <span class=\"katex-inline\">y=(2x+1)^2<\/span> 走一遍：<\/p>\n<ul><li>\n外层 <span class=\"katex-inline\">f(u)=u^2<\/span>，导数 <span class=\"katex-inline\">f&#x27;(u)=2u<\/span>；\n<\/li><li>\n内层 <span class=\"katex-inline\">u=g(x)=2x+1<\/span>，导数 <span class=\"katex-inline\">g&#x27;(x)=2<\/span>；\n<\/li><li>\n代回：<span class=\"katex-inline\">f&#x27;(g(x))\\cdot g&#x27;(x)=2(2x+1)\\cdot 2=8x+4<\/span>。\n<\/ul>\n<p>和展开的结果一致。<\/p>\n<p>注意 <span class=\"katex-inline\">f&#x27;(u)=2u<\/span> 里的 <span class=\"katex-inline\">u<\/span> 要保留成 <span class=\"katex-inline\">2x+1<\/span>，不能直接写 <span class=\"katex-inline\">2x<\/span>。<strong>外层导数要代回内层的表达式<\/strong>，这是最容易错的一步。<\/p>\n<h3>为什么是乘<\/h3>\n<p>把导数的定义拿出来。<span class=\"katex-inline\">y<\/span> 随 <span class=\"katex-inline\">u<\/span> 变，<span class=\"katex-inline\">u<\/span> 随 <span class=\"katex-inline\">x<\/span> 变。输入动一点点 <span class=\"katex-inline\">\\Delta x<\/span>，引起 <span class=\"katex-inline\">u<\/span> 动 <span class=\"katex-inline\">\\Delta u<\/span>，再引起 <span class=\"katex-inline\">y<\/span> 动 <span class=\"katex-inline\">\\Delta y<\/span>。<\/p>\n<p>把两个比值串起来：<\/p>\n<div class=\"katex-block\">\\frac{\\Delta y}{\\Delta x}=\\frac{\\Delta y}{\\Delta u}\\cdot\\frac{\\Delta u}{\\Delta x}<\/div>\n<p>右边第一个分式的分母和第二个分式的分子都是 <span class=\"katex-inline\">\\Delta u<\/span>，像普通分数一样约掉，剩下 <span class=\"katex-inline\">\\Delta y/\\Delta x<\/span>。这就是&quot;乘&quot;的来源：<strong>变化是通过中间变量传导的，传导率相乘。<\/strong><\/p>\n<p>严格来说，<span class=\"katex-inline\">\\Delta u<\/span> 可能为 0，不能直接除。严谨的处理要用极限的语言说明&quot;<span class=\"katex-inline\">u<\/span> 在一点附近的变化率&quot;与&quot;<span class=\"katex-inline\">y<\/span> 对 <span class=\"katex-inline\">u<\/span> 的变化率&quot;可以相乘。这里不展开证明，但逻辑链条是清楚的：变化率沿链条传递，每一段乘一次。<\/p>\n<div>\n<svg viewBox=\"0 0 460 130\" width=\"100%\" role=\"img\" aria-label=\"变化率沿链条传导\">\n<rect x=\"20\" y=\"40\" width=\"90\" height=\"50\" rx=\"8\" fill=\"none\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n<text x=\"46\" y=\"72\" font-size=\"15\" fill=\"#3b82f6\">x<\/text>\n<rect x=\"185\" y=\"40\" width=\"90\" height=\"50\" rx=\"8\" fill=\"none\" stroke=\"#6b7280\" stroke-width=\"2\"/>\n<text x=\"211\" y=\"72\" font-size=\"15\" fill=\"#6b7280\">u<\/text>\n<rect x=\"350\" y=\"40\" width=\"90\" height=\"50\" rx=\"8\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n<text x=\"376\" y=\"72\" font-size=\"15\" fill=\"#16a34a\">y<\/text>\n<line x1=\"110\" y1=\"65\" x2=\"175\" y2=\"65\" stroke=\"#6b7280\" stroke-width=\"2\"/>\n<line x1=\"275\" y1=\"65\" x2=\"340\" y2=\"65\" stroke=\"#6b7280\" stroke-width=\"2\"/>\n<text x=\"120\" y=\"55\" font-size=\"12\" fill=\"#6b7280\">du/dx<\/text>\n<text x=\"285\" y=\"55\" font-size=\"12\" fill=\"#6b7280\">dy/du<\/text>\n<text x=\"120\" y=\"105\" font-size=\"12\" fill=\"#9ca3af\">第一段传导率<\/text>\n<text x=\"285\" y=\"105\" font-size=\"12\" fill=\"#9ca3af\">第二段传导率<\/text>\n<\/svg>\n<\/div>\n<p>看图说明：<span class=\"katex-inline\">x<\/span> 的变化先传导到 <span class=\"katex-inline\">u<\/span>，再传导到 <span class=\"katex-inline\">y<\/span>。两段各有自己的变化率，总变化率是两段相乘。这个图也解释了为什么复合越深、链越长、连乘的因子越多。<\/p>\n<h3>多剥几层<\/h3>\n<p>三层复合：<span class=\"katex-inline\">y=f(g(h(x)))<\/span>。<\/p>\n<div class=\"katex-block\">\\frac{dy}{dx}=f'(g(h(x)))\\cdot g'(h(x))\\cdot h'(x)<\/div>\n<p>从外往里，每层乘一个导数，最内层用 <span class=\"katex-inline\">x<\/span>。<\/p>\n<p>例：<span class=\"katex-inline\">y=(x^2+1)^3<\/span>。<\/p>\n<ul><li>\n外层：<span class=\"katex-inline\">u^3<\/span> 的导数是 <span class=\"katex-inline\">3u^2<\/span>，代回 <span class=\"katex-inline\">u=x^2+1<\/span> 得 <span class=\"katex-inline\">3(x^2+1)^2<\/span>；\n<\/li><li>\n内层：<span class=\"katex-inline\">x^2+1<\/span> 的导数是 <span class=\"katex-inline\">2x<\/span>；\n<\/li><li>\n相乘：<span class=\"katex-inline\">y&#x27;=3(x^2+1)^2\\cdot 2x=6x(x^2+1)^2<\/span>。\n<\/ul>\n<p>验一下：<span class=\"katex-inline\">x=1<\/span> 时 <span class=\"katex-inline\">y=(1+1)^3=8<\/span>，<span class=\"katex-inline\">y&#x27;=6\\cdot 1\\cdot 4=24<\/span>。用数值法：<span class=\"katex-inline\">x=1.001<\/span> 时 <span class=\"katex-inline\">y=(1.002001)^3\\approx 8.024024<\/span>，差 <span class=\"katex-inline\">0.024024<\/span>，除以 <span class=\"katex-inline\">0.001<\/span> 得 <span class=\"katex-inline\">24.024<\/span>，逼近 24。对上了。<\/p>\n<h3>这就是神经网络求导的全部工具<\/h3>\n<p>一个网络是几十层复合函数：<\/p>\n<div class=\"katex-block\">L = \\ell\\big(f_3(f_2(f_1(x)))\\big)<\/div>\n<p>对任何一个参数求导，都要从最外层一路乘到那个参数所在的那一层。第 11 章的反向传播，做的就是这件事，只是它把中间结果存起来重复利用，避免重复计算。<\/p>\n<p>链式法则不是&quot;一个技巧&quot;，它是把深度网络拆开求导的唯一可行办法。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：齿轮组。三个齿轮咬合，第一个转 1 圈，第二个转 2 圈，第三个转 3 圈。第一个到第三个的总传动比是 <span class=\"katex-inline\">2\\times 3=6<\/span>——中间每一级的比例相乘，不是相加。<\/p>\n<p>类比失效的地方：齿轮的传动比是固定常数，函数的导数随位置变化。同一个复合函数，在 <span class=\"katex-inline\">x=1<\/span> 和 <span class=\"katex-inline\">x=5<\/span> 处的导数可以完全不同。<\/p>\n<p><strong>实例<\/strong>：<span class=\"katex-inline\">y=(3x-2)^4<\/span>，求 <span class=\"katex-inline\">y&#x27;<\/span>。<\/p>\n<p>外层 <span class=\"katex-inline\">u^4<\/span> 导数为 <span class=\"katex-inline\">4u^3<\/span>，代回 <span class=\"katex-inline\">u=3x-2<\/span> 得 <span class=\"katex-inline\">4(3x-2)^3<\/span>；内层 <span class=\"katex-inline\">3x-2<\/span> 导数为 3。相乘得：<\/p>\n<div class=\"katex-block\">y'=12(3x-2)^3<\/div>\n<p>在 <span class=\"katex-inline\">x=1<\/span> 处：<span class=\"katex-inline\">y&#x27;=12\\cdot 1^3=12<\/span>。用数值法验证：<span class=\"katex-inline\">y(1)=1<\/span>，<span class=\"katex-inline\">y(1.001)=(1.003)^4\\approx 1.012054<\/span>，差 <span class=\"katex-inline\">0.012054<\/span> 除以 <span class=\"katex-inline\">0.001<\/span> 约 <span class=\"katex-inline\">12.05<\/span>，逼近 12。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为链式法则是&quot;内层导数加外层导数&quot;<\/strong>——是乘。加法是 <span class=\"katex-inline\">(f+g)&#x27;=f&#x27;+g&#x27;<\/span>，那是两个函数相加的规则，不是复合。复合是嵌套，变化率沿链条传导，所以乘。<\/p>\n<p><strong>别以为外层导数可以直接对 <span class=\"katex-inline\">x<\/span> 求<\/strong>——外层导数必须先把内层表达式代回去，再乘内层导数。<span class=\"katex-inline\">y=(2x+1)^2<\/span> 的外层导数是 <span class=\"katex-inline\">2(2x+1)<\/span>，不是 <span class=\"katex-inline\">2x<\/span>。漏掉代回这一步会得到 <span class=\"katex-inline\">4x<\/span>，少了常数项。<\/p>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n求 <span class=\"katex-inline\">y=(5x+1)^3<\/span> 的导数。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">y&#x27;=15(5x+1)^2<\/span>。<\/p>\n<p><strong>解析<\/strong>：外层 <span class=\"katex-inline\">u^3\\to 3u^2<\/span>，代回 <span class=\"katex-inline\">u=5x+1<\/span> 得 <span class=\"katex-inline\">3(5x+1)^2<\/span>；内层导数为 5；相乘得 <span class=\"katex-inline\">15(5x+1)^2<\/span>。<\/p>\n<ol><li>\n求 <span class=\"katex-inline\">y=(x^3+2)^2<\/span> 在 <span class=\"katex-inline\">x=1<\/span> 处的导数。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">y&#x27;=6x^2(x^3+2)<\/span>，在 <span class=\"katex-inline\">x=1<\/span> 处等于 18。<\/p>\n<p><strong>解析<\/strong>：外层导数 <span class=\"katex-inline\">2(x^3+2)<\/span>，内层导数 <span class=\"katex-inline\">3x^2<\/span>，相乘得 <span class=\"katex-inline\">6x^2(x^3+2)<\/span>。代入 <span class=\"katex-inline\">x=1<\/span>：<span class=\"katex-inline\">6\\times 1\\times 3=18<\/span>。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n复合函数：先认内外层，看最后一步算什么。\n<\/li><li>\n链式法则：<span class=\"katex-inline\">\\dfrac{dy}{dx}=\\dfrac{dy}{du}\\cdot\\dfrac{du}{dx}<\/span>，外层导数代回内层表达式再乘内层导数。\n<\/li><li>\n为什么是乘：变化率沿链条一段段传导，总传导率是各段相乘。\n<\/li><li>\n深度网络求导全靠它，第 11 章会把它跑一遍完整流程。\n<\/ul>", "kind": "chapter", "title": "第 4 章：套娃函数怎么求导"}, "ch05": {"html": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：一条直线能干什么<\/a><\/span><\/div><h1>第 5 章：一堆数怎么算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1 小时 | <strong>前置<\/strong>：第 2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n算两个向量的点积，并解释它等于&quot;加权求和&quot;；\n<\/li><li>\n把一层神经元的计算写成一个矩阵乘向量再加偏置；\n<\/li><li>\n检查矩阵乘法的维度对不对。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>点积就是加权求和，矩阵乘法就是把很多个点积并排算。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>向量：把一组数打包<\/h3>\n<p>一个输入往往不是单个数。判断一封邮件，可能同时看&quot;广告词次数&quot;和&quot;感叹号个数&quot;；一张图片，有 784 个像素值。<\/p>\n<p>把这些数按顺序排成一列，用方括号括起来：<\/p>\n<div class=\"katex-block\">\\mathbf{x}=\\begin{bmatrix}x_1\\\\x_2\\\\x_3\\end{bmatrix}<\/div>\n<p>这就是一个<strong>向量<\/strong>。它没有新运算，只是把几个数捆在一起，方便整体书写。<span class=\"katex-inline\">\\mathbf{x}<\/span> 里第 <span class=\"katex-inline\">i<\/span> 个数记作 <span class=\"katex-inline\">x_i<\/span>。粗体表示这是向量，不是单个数。<\/p>\n<p>向量的长度叫<strong>维数<\/strong>。上面这个向量有 3 个数，是 3 维向量。<\/p>\n<h3>点积：对应相乘再相加<\/h3>\n<p>两个维数相同的向量可以做<strong>点积<\/strong>：<\/p>\n<div class=\"katex-block\">\\mathbf{w}\\cdot\\mathbf{x}=w_1x_1+w_2x_2+w_3x_3<\/div>\n<p>比如 <span class=\"katex-inline\">\\mathbf{w}=(2,-1,0.5)<\/span>，<span class=\"katex-inline\">\\mathbf{x}=(1,3,2)<\/span>：<\/p>\n<div class=\"katex-block\">\\mathbf{w}\\cdot\\mathbf{x}=2\\times 1+(-1)\\times 3+0.5\\times 2=2-3+1=0<\/div>\n<p>点积的结果是一个数，不是向量。<\/p>\n<p>回到第 2 章的分类规则 <span class=\"katex-inline\">z=w_1x_1+w_2x_2+b<\/span>。分子部分就是 <span class=\"katex-inline\">\\mathbf{w}\\cdot\\mathbf{x}<\/span>。所以点积正好是&quot;给每个输入配一个权重，乘完加起来&quot;这件事的紧凑写法。<\/p>\n<p><strong>点积还可以理解成相似度<\/strong>。两个向量方向越接近，点积越大；方向相反，点积为负。这个解释在后面的注意力机制里会再出现，现在知道有这层含义就行。<\/p>\n<h3>矩阵：把多个权重向量叠起来<\/h3>\n<p>一层如果有 3 个神经元，每个神经元都有自己的权重向量。把 3 个权重向量按行叠起来：<\/p>\n<div class=\"katex-block\">\\mathbf{W}=\\begin{bmatrix}w_{11}&w_{12}&w_{13}\\\\w_{21}&w_{22}&w_{23}\\\\w_{31}&w_{32}&w_{33}\\end{bmatrix}<\/div>\n<p><span class=\"katex-inline\">w_{ij}<\/span> 表示&quot;第 <span class=\"katex-inline\">i<\/span> 个神经元对第 <span class=\"katex-inline\">j<\/span> 个输入的权重&quot;。第一个下标是行（哪个神经元），第二个下标是列（哪个输入）。<\/p>\n<p><strong>矩阵乘向量<\/strong>的规则：结果的第 <span class=\"katex-inline\">i<\/span> 个数，等于矩阵第 <span class=\"katex-inline\">i<\/span> 行与向量的点积。<\/p>\n<div class=\"katex-block\">\\mathbf{W}\\mathbf{x}=\\begin{bmatrix}w_{11}x_1+w_{12}x_2+w_{13}x_3\\\\w_{21}x_1+w_{22}x_2+w_{23}x_3\\\\w_{31}x_1+w_{32}x_2+w_{33}x_3\\end{bmatrix}<\/div>\n<p>一个 3×3 矩阵乘 3 维向量，得到一个 3 维向量。三个神经元同时算完。<\/p>\n<h3>维度必须对上<\/h3>\n<p>矩阵乘法的维度规则：<span class=\"katex-inline\">\\mathbf{W}<\/span> 是 <span class=\"katex-inline\">m\\times n<\/span>，<span class=\"katex-inline\">\\mathbf{x}<\/span> 是 <span class=\"katex-inline\">n<\/span> 维，结果就是 <span class=\"katex-inline\">m<\/span> 维。<\/p>\n<p>可以记成&quot;中间的 <span class=\"katex-inline\">n<\/span> 抵消，剩下 <span class=\"katex-inline\">m<\/span>&quot;。<span class=\"katex-inline\">n<\/span> 对不上就不能乘。<\/p>\n<p>神经网络里，这一层的输入维数必须等于权重矩阵的列数。写错维度是最常见的低级错误，第 13 章动手时会专门检查这一步。<\/p>\n<h3>一层网络的完整写法<\/h3>\n<div class=\"katex-block\">\\mathbf{z}=\\mathbf{W}\\mathbf{x}+\\mathbf{b}<\/div>\n<p><span class=\"katex-inline\">\\mathbf{W}<\/span> 是权重矩阵，<span class=\"katex-inline\">\\mathbf{x}<\/span> 是输入向量，<span class=\"katex-inline\">\\mathbf{b}<\/span> 是偏置向量（每个神经元一个偏置），<span class=\"katex-inline\">\\mathbf{z}<\/span> 是这一层的&quot;打分&quot;结果。之后还要过激活函数（第 7 章）。<\/p>\n<p>这个写法比逐个神经元写循环清爽得多，计算机也能并行算——显卡擅长同时做大量乘加，矩阵运算正好合它的胃口。<\/p>\n<div>\n<svg viewBox=\"0 0 460 190\" width=\"100%\" role=\"img\" aria-label=\"矩阵乘向量\">\n<rect x=\"30\" y=\"40\" width=\"96\" height=\"110\" fill=\"none\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n<line x1=\"62\" y1=\"40\" x2=\"62\" y2=\"150\" stroke=\"#3b82f6\" stroke-width=\"1\"/>\n<line x1=\"94\" y1=\"40\" x2=\"94\" y2=\"150\" stroke=\"#3b82f6\" stroke-width=\"1\"/>\n<line x1=\"30\" y1=\"77\" x2=\"126\" y2=\"77\" stroke=\"#3b82f6\" stroke-width=\"1\"/>\n<line x1=\"30\" y1=\"113\" x2=\"126\" y2=\"113\" stroke=\"#3b82f6\" stroke-width=\"1\"/>\n<text x=\"40\" y=\"66\" font-size=\"12\" fill=\"#3b82f6\">w11<\/text>\n<text x=\"72\" y=\"66\" font-size=\"12\" fill=\"#3b82f6\">w12<\/text>\n<text x=\"100\" y=\"66\" font-size=\"12\" fill=\"#3b82f6\">w13<\/text>\n<text x=\"40\" y=\"102\" font-size=\"12\" fill=\"#3b82f6\">w21<\/text>\n<text x=\"72\" y=\"102\" font-size=\"12\" fill=\"#3b82f6\">w22<\/text>\n<text x=\"100\" y=\"102\" font-size=\"12\" fill=\"#3b82f6\">w23<\/text>\n<text x=\"40\" y=\"138\" font-size=\"12\" fill=\"#3b82f6\">w31<\/text>\n<text x=\"72\" y=\"138\" font-size=\"12\" fill=\"#3b82f6\">w32<\/text>\n<text x=\"100\" y=\"138\" font-size=\"12\" fill=\"#3b82f6\">w33<\/text>\n<text x=\"140\" y=\"105\" font-size=\"18\" fill=\"#6b7280\">×<\/text>\n<rect x=\"166\" y=\"60\" width=\"34\" height=\"70\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n<text x=\"175\" y=\"84\" font-size=\"12\" fill=\"#16a34a\">x1<\/text>\n<text x=\"175\" y=\"104\" font-size=\"12\" fill=\"#16a34a\">x2<\/text>\n<text x=\"175\" y=\"124\" font-size=\"12\" fill=\"#16a34a\">x3<\/text>\n<text x=\"214\" y=\"105\" font-size=\"18\" fill=\"#6b7280\">=<\/text>\n<rect x=\"240\" y=\"60\" width=\"34\" height=\"70\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\"/>\n<text x=\"248\" y=\"84\" font-size=\"12\" fill=\"#dc2626\">z1<\/text>\n<text x=\"248\" y=\"104\" font-size=\"12\" fill=\"#dc2626\">z2<\/text>\n<text x=\"248\" y=\"124\" font-size=\"12\" fill=\"#dc2626\">z3<\/text>\n<text x=\"292\" y=\"70\" font-size=\"12\" fill=\"#6b7280\">结果的每一行<\/text>\n<text x=\"292\" y=\"92\" font-size=\"12\" fill=\"#6b7280\">= 左边矩阵的<\/text>\n<text x=\"292\" y=\"114\" font-size=\"12\" fill=\"#6b7280\">一行 × 右边向量<\/text>\n<text x=\"292\" y=\"136\" font-size=\"12\" fill=\"#6b7280\">（做点积）<\/text>\n<\/svg>\n<\/div>\n<p>看图说明：左边矩阵的每一行与中间的向量做点积，得到右边结果向量的一个数。行数决定输出维数，列数必须等于输入维数。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：点积像餐厅结账。菜谱上每道菜有价格（权重），你点了若干份（输入），总价就是把&quot;价格×份数&quot;逐项加起来。价格向量和份数向量的点积就是账单金额。<\/p>\n<p>类比失效的地方：餐厅价格都是正数，权重可以是负数。负权重表示&quot;这个输入出现得越多，分数越低&quot;，比如垃圾邮件里的&quot;退订&quot;一词反而说明它可能是正经邮件。<\/p>\n<p><strong>实例<\/strong>：<span class=\"katex-inline\">\\mathbf{W}=\\begin{bmatrix}1&amp;2\\\\0&amp;-1\\end{bmatrix}<\/span>，<span class=\"katex-inline\">\\mathbf{x}=\\begin{bmatrix}3\\\\4\\end{bmatrix}<\/span>。<\/p>\n<p>第一行点积：<span class=\"katex-inline\">1\\times 3+2\\times 4=11<\/span>。第二行点积：<span class=\"katex-inline\">0\\times 3+(-1)\\times 4=-4<\/span>。<\/p>\n<div class=\"katex-block\">\\mathbf{W}\\mathbf{x}=\\begin{bmatrix}11\\\\-4\\end{bmatrix}<\/div>\n<p>再加上偏置 <span class=\"katex-inline\">\\mathbf{b}=\\begin{bmatrix}-5\\\\2\\end{bmatrix}<\/span>，得到 <span class=\"katex-inline\">\\mathbf{z}=\\begin{bmatrix}6\\\\-2\\end{bmatrix}<\/span>。<\/p>\n<p>维度检查：<span class=\"katex-inline\">\\mathbf{W}<\/span> 是 2×2，<span class=\"katex-inline\">\\mathbf{x}<\/span> 是 2 维，中间的 2 对上，输出 2 维。没问题。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为矩阵乘法是&quot;对应位置相乘&quot;<\/strong>——对应位置相乘叫逐元素乘法，记作 <span class=\"katex-inline\">\\mathbf{A}\\odot\\mathbf{B}<\/span>，结果是同样形状的矩阵。矩阵乘法是&quot;行与列做点积再求和&quot;，结果是不同的形状。这两个运算完全不同，写代码时也容易混。<\/p>\n<p><strong>别以为向量就是一列数字所以没区别<\/strong>——向量有维数，有方向含义。把 3 维向量塞进要求 4 维输入的层，程序会直接报错。维度是硬约束，不是建议。<\/p>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n算 <span class=\"katex-inline\">\\mathbf{w}=(1,-2,2)<\/span> 与 <span class=\"katex-inline\">\\mathbf{x}=(3,1,2)<\/span> 的点积。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">1\\times 3+(-2)\\times 1+2\\times 2=3-2+4=5<\/span>。<\/p>\n<p><strong>解析<\/strong>：逐项相乘再相加，负号跟着权重走。<\/p>\n<ol><li>\n矩阵 <span class=\"katex-inline\">\\begin{bmatrix}2&amp;1\\\\-1&amp;3\\end{bmatrix}<\/span> 乘向量 <span class=\"katex-inline\">\\begin{bmatrix}1\\\\2\\end{bmatrix}<\/span>，结果是什么？\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">\\begin{bmatrix}4\\\\5\\end{bmatrix}<\/span>。<\/p>\n<p><strong>解析<\/strong>：第一行 <span class=\"katex-inline\">2\\times 1+1\\times 2=4<\/span>；第二行 <span class=\"katex-inline\">-1\\times 1+3\\times 2=5<\/span>。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n向量 = 一组数打包；维数 = 数的个数。\n<\/li><li>\n点积 = 对应相乘再相加 = 加权求和。\n<\/li><li>\n矩阵乘向量：每一行做一个点积，行数决定输出维数。\n<\/li><li>\n一层网络写成 <span class=\"katex-inline\">\\mathbf{z}=\\mathbf{W}\\mathbf{x}+\\mathbf{b}<\/span>。\n<\/ul>", "kind": "chapter", "title": "第 5 章：一堆数怎么算"}, "ch06": {"html": "<div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：一条直线能干什么<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch05\">第 5 章：一堆数怎么算<\/a><\/span><\/div><h1>第 6 章：一个神经元<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1 小时 | <strong>前置<\/strong>：第 2、5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出一个神经元的完整计算过程；\n<\/li><li>\n说明权重向量与分界线方向的关系；\n<\/li><li>\n用表格验证一个神经元能做&quot;与&quot;和&quot;或&quot;，但做不了&quot;异或&quot;。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>一个神经元就是&quot;加权打分 + 过门槛&quot;，几何上等价于一条分界线。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>从分类规则到神经元<\/h3>\n<p>第 2 章的规则：<span class=\"katex-inline\">z=w_1x_1+w_2x_2+b<\/span>，<span class=\"katex-inline\">z&gt;0<\/span> 判 1，否则判 0。<\/p>\n<p>把这套东西画成一个单元，就是<strong>神经元<\/strong>（也叫<strong>感知机<\/strong>，perceptron）：<\/p>\n<div>\n<svg viewBox=\"0 0 460 150\" width=\"100%\" role=\"img\" aria-label=\"一个神经元的计算流程\">\n<circle cx=\"70\" cy=\"45\" r=\"14\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n<text x=\"64\" y=\"50\" font-size=\"12\" fill=\"#16a34a\">x1<\/text>\n<circle cx=\"70\" cy=\"105\" r=\"14\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n<text x=\"64\" y=\"110\" font-size=\"12\" fill=\"#16a34a\">x2<\/text>\n<rect x=\"150\" y=\"40\" width=\"150\" height=\"70\" rx=\"10\" fill=\"none\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n<text x=\"168\" y=\"68\" font-size=\"13\" fill=\"#3b82f6\">加权求和<\/text>\n<text x=\"168\" y=\"92\" font-size=\"13\" fill=\"#3b82f6\">z = w·x + b<\/text>\n<rect x=\"350\" y=\"50\" width=\"80\" height=\"50\" rx=\"8\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\"/>\n<text x=\"362\" y=\"72\" font-size=\"12\" fill=\"#dc2626\">过门槛<\/text>\n<text x=\"368\" y=\"90\" font-size=\"12\" fill=\"#dc2626\">输出 0/1<\/text>\n<line x1=\"88\" y1=\"50\" x2=\"145\" y2=\"60\" stroke=\"#6b7280\"/>\n<line x1=\"88\" y1=\"100\" x2=\"145\" y2=\"90\" stroke=\"#6b7280\"/>\n<line x1=\"302\" y1=\"75\" x2=\"345\" y2=\"75\" stroke=\"#6b7280\"/>\n<text x=\"96\" y=\"42\" font-size=\"11\" fill=\"#9ca3af\">w1<\/text>\n<text x=\"96\" y=\"112\" font-size=\"11\" fill=\"#9ca3af\">w2<\/text>\n<\/svg>\n<\/div>\n<p>计算分两步：<\/p>\n<div class=\"katex-block\">z=\\mathbf{w}\\cdot\\mathbf{x}+b,\\qquad \\hat{y}=\\begin{cases}1,& z>0\\\\0,& z\\le 0\\end{cases}<\/div>\n<p>第二步那个&quot;大于 0 输出 1，否则输出 0&quot;的函数，叫<strong>阶跃函数<\/strong>。它在 0 处突然从 0 跳到 1，形状像一级台阶。<\/p>\n<p><span class=\"katex-inline\">\\hat{y}<\/span> 读作&quot;y hat&quot;，表示模型的预测值，区别于真实标签 <span class=\"katex-inline\">y<\/span>。<\/p>\n<h3>权重向量决定分界线的方向<\/h3>\n<p>分界线是 <span class=\"katex-inline\">z=0<\/span>，即 <span class=\"katex-inline\">\\mathbf{w}\\cdot\\mathbf{x}+b=0<\/span>。<\/p>\n<p>以二维为例，<span class=\"katex-inline\">\\mathbf{w}=(w_1,w_2)<\/span>。可以证明，<span class=\"katex-inline\">\\mathbf{w}<\/span> 垂直于这条分界线。验证一下：分界线上取两点 <span class=\"katex-inline\">\\mathbf{x}<\/span> 和 <span class=\"katex-inline\">\\mathbf{x}+\\mathbf{d}<\/span>，都满足 <span class=\"katex-inline\">\\mathbf{w}\\cdot\\mathbf{x}+b=0<\/span> 和 <span class=\"katex-inline\">\\mathbf{w}\\cdot(\\mathbf{x}+\\mathbf{d})+b=0<\/span>。两式相减得 <span class=\"katex-inline\">\\mathbf{w}\\cdot\\mathbf{d}=0<\/span>。点积为 0 表示 <span class=\"katex-inline\">\\mathbf{w}<\/span> 与方向 <span class=\"katex-inline\">\\mathbf{d}<\/span> 垂直，而 <span class=\"katex-inline\">\\mathbf{d}<\/span> 是沿着分界线走的。所以 <span class=\"katex-inline\">\\mathbf{w}<\/span> 垂直于分界线。<\/p>\n<p><span class=\"katex-inline\">\\mathbf{w}<\/span> 指向的一侧，<span class=\"katex-inline\">\\mathbf{w}\\cdot\\mathbf{x}<\/span> 更大，<span class=\"katex-inline\">z<\/span> 为正。所以权重向量的方向就是&quot;判 1 的那一侧&quot;的方向。<\/p>\n<p><span class=\"katex-inline\">b<\/span> 控制分界线离原点多远。<span class=\"katex-inline\">b<\/span> 增大，分界线朝 <span class=\"katex-inline\">\\mathbf{w}<\/span> 的反方向平移。<\/p>\n<h3>它能做什么：与、或<\/h3>\n<p>固定 <span class=\"katex-inline\">\\mathbf{w}=(1,1)<\/span>，只改偏置。<\/p>\n<p><strong>与（AND）<\/strong>，<span class=\"katex-inline\">b=-1.5<\/span>：<\/p>\n<table><thead><tr><th><span class=\"katex-inline\">x_1<\/span><\/th><th><span class=\"katex-inline\">x_2<\/span><\/th><th><span class=\"katex-inline\">z=x_1+x_2-1.5<\/span><\/th><th>输出<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td><span class=\"katex-inline\">-1.5<\/span><\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td><span class=\"katex-inline\">-0.5<\/span><\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td><span class=\"katex-inline\">-0.5<\/span><\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td><span class=\"katex-inline\">0.5<\/span><\/td><td>1<\/td><\/tr><\/tbody><\/table>\n<p><strong>或（OR）<\/strong>，<span class=\"katex-inline\">b=-0.5<\/span>：<\/p>\n<table><thead><tr><th><span class=\"katex-inline\">x_1<\/span><\/th><th><span class=\"katex-inline\">x_2<\/span><\/th><th><span class=\"katex-inline\">z=x_1+x_2-0.5<\/span><\/th><th>输出<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td><span class=\"katex-inline\">-0.5<\/span><\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td><span class=\"katex-inline\">0.5<\/span><\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td><span class=\"katex-inline\">0.5<\/span><\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td><span class=\"katex-inline\">1.5<\/span><\/td><td>1<\/td><\/tr><\/tbody><\/table>\n<p>同一个权重，偏置从 <span class=\"katex-inline\">-1.5<\/span> 改成 <span class=\"katex-inline\">-0.5<\/span>，直线平移，功能就从&quot;与&quot;变成&quot;或&quot;。<\/p>\n<h3>它做不到什么：异或<\/h3>\n<p><strong>异或（XOR）<\/strong>的规则是&quot;两个输入不同时输出 1，相同时输出 0&quot;：<\/p>\n<table><thead><tr><th><span class=\"katex-inline\">x_1<\/span><\/th><th><span class=\"katex-inline\">x_2<\/span><\/th><th>期望输出<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>0<\/td><\/tr><\/tbody><\/table>\n<p>把四个点画在平面上，<span class=\"katex-inline\">(0,0)<\/span> 和 <span class=\"katex-inline\">(1,1)<\/span> 是一类，<span class=\"katex-inline\">(0,1)<\/span> 和 <span class=\"katex-inline\">(1,0)<\/span> 是另一类。两类点交错排列，像国际象棋棋盘的两个颜色。<\/p>\n<p>一条直线最多把平面切成两半，切出来的每一半都是&quot;连成一片&quot;的凸区域。异或的两类点各自分散在对角，任何一条直线都会把其中一类切成两半。所以单个神经元做不到异或。<\/p>\n<div>\n<svg viewBox=\"0 0 340 300\" width=\"100%\" role=\"img\" aria-label=\"异或四个点无法被一条直线分开\">\n<rect x=\"50\" y=\"30\" width=\"240\" height=\"240\" fill=\"none\" stroke=\"#9ca3af\"/>\n<line x1=\"50\" y1=\"270\" x2=\"290\" y2=\"270\" stroke=\"#9ca3af\"/>\n<line x1=\"50\" y1=\"270\" x2=\"50\" y2=\"30\" stroke=\"#9ca3af\"/>\n<circle cx=\"60\" cy=\"260\" r=\"8\" fill=\"#dc2626\"/>\n<circle cx=\"60\" cy=\"40\" r=\"8\" fill=\"#16a34a\"/>\n<circle cx=\"280\" cy=\"260\" r=\"8\" fill=\"#16a34a\"/>\n<circle cx=\"280\" cy=\"40\" r=\"8\" fill=\"#dc2626\"/>\n<text x=\"70\" y=\"282\" font-size=\"12\" fill=\"#6b7280\">(0,0) 判 0<\/text>\n<text x=\"70\" y=\"30\" font-size=\"12\" fill=\"#6b7280\">(0,1) 判 1<\/text>\n<text x=\"222\" y=\"282\" font-size=\"12\" fill=\"#6b7280\">(1,0) 判 1<\/text>\n<text x=\"222\" y=\"30\" font-size=\"12\" fill=\"#6b7280\">(1,1) 判 0<\/text>\n<line x1=\"50\" y1=\"150\" x2=\"290\" y2=\"150\" stroke=\"#3b82f6\" stroke-dasharray=\"6 5\"/>\n<text x=\"100\" y=\"143\" font-size=\"12\" fill=\"#3b82f6\">任何一条线都会切错<\/text>\n<\/svg>\n<\/div>\n<p>看图说明：红色是判 0 的点，绿色是判 1 的点。它们在对角交错。蓝色虚线是一种尝试，无论怎么平移或旋转，一条直线都不可能把两红两绿完整分开。<\/p>\n<p>这个失败不是&quot;参数没调好&quot;，是几何上做不到。要解决它，必须把多个神经元组合起来，或者把输入做一次变换——这正是第 8 章多层网络要做的事。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：神经元像一个评委。每个评分项有分值（权重），加起来超过及格线（负偏置的绝对值）就通过。评委只给&quot;通过/不通过&quot;，不给具体分数。<\/p>\n<p>类比失效的地方：真人评委可以改评分标准，神经元的权重在训练时才会改；一次前向计算中它是固定不变的。<\/p>\n<p><strong>实例<\/strong>：<span class=\"katex-inline\">\\mathbf{w}=(2,-1)<\/span>，<span class=\"katex-inline\">b=-1<\/span>，判断点 <span class=\"katex-inline\">(1,1)<\/span>。<\/p>\n<p><span class=\"katex-inline\">z=2\\times 1+(-1)\\times 1-1=0<\/span>。<span class=\"katex-inline\">z=0<\/span> 正好在分界线上，按约定输出 0。<\/p>\n
